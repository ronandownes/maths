<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Ronan Downes Maths — structured teaching resources and interactive mathematics.">
<title>Maths | Ronan Downes</title>
<style>
:root{--ink:#202124;--muted:#5f6368;--line:#dadce0;--paper:#fff;--page:#f1f3f4;--blue:#1a73e8}
*{box-sizing:border-box}html{font-family:Arial,Helvetica,sans-serif;font-size:16px}body{margin:0;color:var(--ink);background:var(--page);line-height:1.55}
a{color:#1557a0}.topbar{background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;min-height:78px;position:sticky;top:0;z-index:5;padding:0 15px;gap:24px}
.brand{text-decoration:none;color:#202124;font-weight:800;font-size:1.75rem;letter-spacing:-.05em;padding-right:18px;flex:0 0 auto}.brand em{font-style:normal;color:#376c9d}
.topnav{display:flex;align-items:stretch;gap:2px;min-height:78px;flex-wrap:wrap}
.tab{font:700 .87rem/1.2 Arial,sans-serif;color:#3c4043;background:none;border:0;border-bottom:3px solid transparent;padding:15px 12px;cursor:pointer}
.tab:hover,.tab[aria-selected=true]{background:#f3f5f8;color:#185abc;border-bottom-color:#1a73e8}
.mobile-toggle{display:none}
.layout{max-width:1340px;margin:auto;padding:24px 18px 70px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start}
.sidebar,.paper{background:#fff;border:1px solid #e0e0e0;box-shadow:0 1px 3px rgba(60,64,67,.12)}
.sidebar{padding:20px 12px;position:sticky;top:102px;max-height:calc(100vh - 120px);overflow:auto;border-radius:5px}
.sidebar-head{font-weight:800;margin:0 10px 12px;color:#3c4043;font-size:1.05rem}
.menu-row{width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:600 .96rem/1.4 Arial,sans-serif;padding:10px 12px;border-radius:5px;cursor:pointer}
.menu-row:hover,.menu-row.active{background:#eaf1fb;color:#174ea6}
.nested{margin-left:12px;border-left:2px solid #e3e7ec;padding:4px 0 4px 9px}
.nested .menu-row{font-size:.87rem;font-weight:500;padding:9px}
.nested .group-title{font-size:.76rem;font-weight:800;color:#64707d;padding:11px 9px 4px;text-transform:uppercase;letter-spacing:.045em}
.paper{max-width:960px;min-height:720px;padding:clamp(25px,5vw,65px);border-radius:4px}
.kicker{color:#65707b;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.75rem}
h1{font-size:clamp(1.8rem,3.5vw,2.5rem);line-height:1.2;margin:9px 0 13px}h2{font-size:1.28rem;margin:30px 0 12px}
.lead{font-size:1.08rem;color:#515962;max-width:700px}
.panel{padding:18px 20px;border:1px solid #dfe4ea;border-radius:7px;margin:18px 0;background:#fbfcfd}
.math{font-family:Cambria,'Times New Roman',serif;font-size:clamp(1.3rem,3vw,1.85rem);text-align:center;line-height:2;padding:12px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.action{display:inline-block;padding:9px 12px;border:1px solid #cbd5e1;border-radius:5px;text-decoration:none;background:#fff;font-size:.89rem;font-weight:700}
button:focus-visible,a:focus-visible{outline:3px solid #ff9d35;outline-offset:2px}
.small{color:#66717b;font-size:.88rem}.hide{display:none!important}
@media(max-width:950px){.topbar{gap:12px}.tab{padding:12px 7px;font-size:.76rem}.layout{grid-template-columns:210px minmax(0,1fr)}}
@media(max-width:720px){.topbar{flex-wrap:wrap;padding:10px 13px;min-height:unset}.brand{font-size:1.55rem}.mobile-toggle{display:block;margin-left:auto;background:white;border:1px solid #ccd2dc;border-radius:5px;padding:8px 11px;font-weight:700}.topnav{display:none;flex-basis:100%;min-height:unset;flex-wrap:wrap}.topnav.open{display:flex}.tab{min-height:42px}.layout{display:block;padding:12px}.sidebar{position:static;max-height:none;margin-bottom:12px}.paper{min-height:420px;padding:25px 20px}}
@media print{.topbar,.sidebar,.actions{display:none}.layout{display:block;padding:0}.paper{box-shadow:none;border:0;padding:0}}
</style>
</head>
<body>
<header class="topbar">
<a href="./" class="brand" aria-label="Maths home">Maths<span aria-hidden="true"><em> ••••</em></span></a>
<button class="mobile-toggle" id="mobile" type="button" aria-expanded="false" aria-controls="topnav">☰ Topics</button>
<nav class="topnav" id="topnav" aria-label="Mathematics topics">
<button class="tab" data-topic="number" aria-selected="false">Number</button>
<button class="tab" data-topic="algebra" aria-selected="true">Algebra</button>
<button class="tab" data-topic="functions" aria-selected="false">Functions</button>
<button class="tab" data-topic="geometry" aria-selected="false">Geometry</button>
<button class="tab" data-topic="trigonometry" aria-selected="false">Trigonometry</button>
<button class="tab" data-topic="probability" aria-selected="false">Probability</button>
<button class="tab" data-topic="statistics" aria-selected="false">Statistics</button>
</nav></header>
<main class="layout">
<aside class="sidebar" aria-label="Topic side menu"><div class="sidebar-head" id="side-title">Algebra</div><div id="side-links"></div></aside>
<article class="paper" id="content" tabindex="-1" aria-live="polite"></article>
</main>
<script>
const groups={
number:{title:"Number",items:[["overview","Number overview"],["fractions","Fractions"],["indices","Indices"],["sequences","Sequences"]]},
algebra:{title:"Algebra",items:[["overview","Algebra overview"],["prerequisites","First-year algebra diagnostic"],["expressions","Expressions and terminology"],["expanding","Expanding brackets"],["factorising","Factorising",[
["common","Common factors (HCF)"],["grouping","Factorising by grouping"],["binomials","Binomial factors: monic quadratics"],["nonmonic","Non-monic quadratics"],["squares","Difference of two squares"],["practice","Mixed practice"]]],["equations","Linear equations"]]},
functions:{title:"Functions",items:[["overview","Functions overview"],["notation","Function notation"],["graphs","Graphs of functions"]]},
geometry:{title:"Geometry",items:[["overview","Geometry overview"],["area","Area and perimeter"],["proof","Geometric reasoning"]]},
trigonometry:{title:"Trigonometry",items:[["overview","Trigonometry overview"],["ratios","Trigonometric ratios"],["cosine","Cosine rule"]]},
probability:{title:"Probability",items:[["overview","Probability overview"],["sample","Sample spaces"],["events","Events and probability"]]},
statistics:{title:"Statistics",items:[["overview","Statistics overview"],["data","Representing data"],["averages","Measures of centre and spread"]]}
};
const details={
"algebra/prerequisites":{title:"First-year algebra diagnostic",intro:"A short diagnostic assessment before beginning second-year factorisation.",body:"<h2>Prerequisites to assess</h2><p>Algebraic terminology, collecting like terms, multiplying terms, expanding a single bracket, and interpreting area and perimeter models.</p><p>These are teaching-assessment categories, not quotations from the NCCA specification.</p><div class='panel math'>3x + 5x &nbsp; · &nbsp; 3x × 5x &nbsp; · &nbsp; 3(x + 4)</div>"},
"algebra/expanding":{title:"Expanding brackets",intro:"Start from multiplication and the distributive law before reversing the process.",body:"<div class='panel'><div class='math'>3(x + 4) = 3x + 12</div><p>Explain each multiplication and check by substitution.</p></div>"},
"algebra/factorising":{title:"Factorising",intro:"Understand factorisation as rewriting an expression as a product.",body:"<div class='panel'><div class='math'>6x + 12 = 6(x + 2)</div><p>The distributive law works in both directions. Recognise when a particular factorisation method applies and verify by expansion.</p></div><h2>Methods</h2><p>Choose a method from the side menu. The lessons and independent exercises will be developed here.</p>"},
"algebra/common":{title:"Common factors (HCF)",intro:"Find the greatest integer or algebraic factor shared by every term.",body:"<div class='panel math'>8x + 12 = 4(2x + 3)</div><p>Not every expression has a non-trivial common factor over the integers. For example, 3x + 11 has integer-coefficient HCF 1.</p>"},
"algebra/grouping":{title:"Factorising by grouping",intro:"Group pairs of terms to produce a common bracket.",body:"<div class='panel math'>ax + ay + bx + by<br>= a(x + y) + b(x + y)<br>= (a + b)(x + y)</div><p>Include carefully selected examples where a negative factor must be taken out of the second pair.</p>"},
"algebra/binomials":{title:"Binomial factors — monic quadratics",intro:"Factorise quadratics with leading coefficient 1 into two binomials, when integer factors exist.",body:"<div class='panel math'>x² + 5x + 6 = (x + 2)(x + 3)</div><p>The product of the two numbers is 6 and their sum is 5. “Monic” describes the quadratic, not the binomial factors.</p>"},
"algebra/nonmonic":{title:"Non-monic quadratics",intro:"Factorise quadratic expressions whose leading coefficient is not 1.",body:"<div class='panel math'>2x² + 7x + 3 = (2x + 1)(x + 3)</div><p>Expand to verify the result.</p>"},
"algebra/squares":{title:"Difference of two squares",intro:"Recognise a difference of two perfect squares.",body:"<div class='panel math'>a² − b² = (a − b)(a + b)</div><p>Explain the identity by expanding the product.</p>"},
"algebra/practice":{title:"Mixed factorising practice",intro:"Choose a method before carrying out the calculation.",body:"<p>This section will contain progressive exercises, immediate feedback and printable worksheets.</p>"}
};
let topic="algebra",section="factorising";
const side=document.getElementById("side-links"), content=document.getElementById("content");
function choose(t,s,writeHash=true){
 if(!groups[t])t="algebra";topic=t;section=s||"overview";
 document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.topic===topic)));
 document.getElementById("side-title").textContent=groups[topic].title;
 side.replaceChildren();
 function entry(id,name,indent=false){const b=document.createElement("button");b.type="button";b.className="menu-row"+(section===id?" active":"");b.textContent=name;b.addEventListener("click",()=>choose(topic,id));return b}
 for(const item of groups[topic].items){
  side.appendChild(entry(item[0],item[1]));
  if(item[2] && (topic==="algebra")){const nest=document.createElement("div");nest.className="nested";const heading=document.createElement("div");heading.className="group-title";heading.textContent="Factorising methods";nest.appendChild(heading);item[2].forEach(c=>nest.appendChild(entry(c[0],c[1],true)));side.appendChild(nest)}
 }
 const d=details[topic+"/"+section]||{title:(groups[topic].items.find(x=>x[0]===section)||["",groups[topic].title])[1]||groups[topic].title,intro:"Teaching resources for this section will appear here.",body:"<p>Use the menu to select a topic. Content is being developed in small, accessible sections.</p>"};
 content.innerHTML="<div class='kicker'>Maths · "+groups[topic].title+"</div><h1></h1><p class='lead'></p><div class='lesson'></div><div class='actions'><a class='action' href='https://github.com/ronandownes/maths'>Repository</a><a class='action' href='https://www.curriculumonline.ie/junior-cycle/junior-cycle-subjects/mathematics/'>Official Junior Cycle specification</a></div><p class='small'>The examples and lesson headings are original teaching material, not verbatim NCCA learning outcomes.</p>";
 content.querySelector("h1").textContent=d.title;content.querySelector(".lead").textContent=d.intro;content.querySelector(".lesson").innerHTML=d.body;
 if(writeHash)history.replaceState(null,"","#"+topic+"/"+section);
}
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{choose(b.dataset.topic,"overview");document.getElementById("topnav").classList.remove("open");document.getElementById("mobile").setAttribute("aria-expanded","false")}));
document.getElementById("mobile").addEventListener("click",()=>{const n=document.getElementById("topnav"),open=n.classList.toggle("open");document.getElementById("mobile").setAttribute("aria-expanded",String(open))});
const hash=location.hash.slice(1).split("/");choose(hash[0]||"algebra",hash[1]||"factorising",false);
</script>
</body></html>
