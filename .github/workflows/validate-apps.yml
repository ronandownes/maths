name: Validate Maths Apps and source
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source builder
        run: |
          python -m py_compile build_site.py
          python build_site.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          import subprocess
          import tempfile
          from pathlib import Path
          files = [
              Path("apps/sets/one-set-venn.html"),
              Path("geometry/rectangle-variables/app.html"),
          ]
          for file in files:
              assert file.is_file(), f"Missing app: {file}"
              content = file.read_text(encoding="utf-8")
              scripts = re.findall(r'<script(?:\s+[^>]*)?>(.*?)</script>', content, flags=re.S|re.I)
              assert any(script.strip() for script in scripts), f"No inline JS: {file}"
              for script in scripts:
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile(mode="w", suffix=".js", encoding="utf-8") as tmp:
                      tmp.write(script)
                      tmp.flush()
                      subprocess.run(["node", "--check", tmp.name], check=True)
              print(f"Checked {file}")
          PY
