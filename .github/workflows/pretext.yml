name: Build and publish PreTeXt book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: oscarlevin/pretext-full
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned PreTeXt CLI
        run: pip install -r requirements.txt

      - name: Show version
        run: pretext --version

      - name: Build web
        run: pretext build web --clean

      - name: Build PDF
        run: pretext build print --clean

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: leaving-cert-maths-web
          path: output/web

      - name: Upload PDF build
        uses: actions/upload-artifact@v4
        with:
          name: leaving-cert-maths-pdf
          path: output/print

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
