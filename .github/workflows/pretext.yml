name: Build and publish PreTeXt book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container: oscarlevin/pretext-full
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and build PreTeXt web book
        id: pretext
        shell: bash
        run: |
          set +e
          : > /tmp/pretext-web.log

          echo '=== Python ===' | tee -a /tmp/pretext-web.log
          python --version 2>&1 | tee -a /tmp/pretext-web.log

          echo '=== Install ===' | tee -a /tmp/pretext-web.log
          python -m pip install -r requirements.txt 2>&1 | tee -a /tmp/pretext-web.log
          install_status=${PIPESTATUS[0]}

          if [ "$install_status" -eq 0 ]; then
            echo '=== PreTeXt version ===' | tee -a /tmp/pretext-web.log
            pretext --version 2>&1 | tee -a /tmp/pretext-web.log
            version_status=${PIPESTATUS[0]}
          else
            version_status=99
          fi

          if [ "$install_status" -eq 0 ] && [ "$version_status" -eq 0 ]; then
            echo '=== Build web ===' | tee -a /tmp/pretext-web.log
            pretext build web 2>&1 | tee -a /tmp/pretext-web.log
            build_status=${PIPESTATUS[0]}
          else
            build_status=99
          fi

          echo "install_status=$install_status" >> "$GITHUB_OUTPUT"
          echo "version_status=$version_status" >> "$GITHUB_OUTPUT"
          echo "build_status=$build_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report PreTeXt diagnostic log
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALL_EXIT: ${{ steps.pretext.outputs.install_status }}
          VERSION_EXIT: ${{ steps.pretext.outputs.version_status }}
          BUILD_EXIT: ${{ steps.pretext.outputs.build_status }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          log = open('/tmp/pretext-web.log', encoding='utf-8', errors='replace').read()
          if len(log) > 55000:
              log = log[-55000:]
          body = (
              f"### PreTeXt diagnostic run\nCommit: `{os.environ['SHA']}`\n"
              f"Install: `{os.environ['INSTALL_EXIT']}` · Version: `{os.environ['VERSION_EXIT']}` · Build: `{os.environ['BUILD_EXIT']}`\n\n"
              f"```text\n{log}\n```"
          )
          url = f"https://api.github.com/repos/{os.environ['REPO']}/issues/1/comments"
          req = urllib.request.Request(url, data=json.dumps({'body': body}).encode(), headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }, method='POST')
          with urllib.request.urlopen(req) as response:
              print(response.status)
          PY

      - name: Stop if PreTeXt build failed
        if: steps.pretext.outputs.build_status != '0'
        run: exit 1

      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/web

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Report deployment result
        if: always() && steps.pretext.outputs.build_status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CONFIGURE_OUTCOME: ${{ steps.pages.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body = (
              f"### Pages deployment\nCommit: `{os.environ['SHA']}`\n"
              f"Configure Pages: `{os.environ['CONFIGURE_OUTCOME']}`\n"
              f"Deploy Pages: `{os.environ['DEPLOY_OUTCOME']}`\n"
              f"Page URL: {os.environ.get('PAGE_URL') or '(none)'}"
          )
          url = f"https://api.github.com/repos/{os.environ['REPO']}/issues/1/comments"
          req = urllib.request.Request(url, data=json.dumps({'body': body}).encode(), headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }, method='POST')
          with urllib.request.urlopen(req) as response:
              print(response.status)
          PY

      - name: Stop if deployment failed
        if: steps.deployment.outcome != 'success'
        run: exit 1
