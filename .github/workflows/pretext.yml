name: Build and publish PreTeXt book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  web:
    runs-on: ubuntu-latest
    container: oscarlevin/pretext-full
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned PreTeXt CLI
        run: python -m pip install -r requirements.txt

      - name: Show PreTeXt version
        run: pretext --version

      - name: Build web book
        run: pretext build web

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: leaving-cert-maths-web
          path: output/web

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/web

  print:
    runs-on: ubuntu-latest
    container: oscarlevin/pretext-full
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned PreTeXt CLI
        run: python -m pip install -r requirements.txt

      - name: Build PDF book
        run: pretext build print

      - name: Upload PDF build
        uses: actions/upload-artifact@v4
        with:
          name: leaving-cert-maths-pdf
          path: output/print

  deploy:
    if: github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
