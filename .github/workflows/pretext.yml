name: Build and publish PreTeXt book

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container: oscarlevin/pretext-full
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned PreTeXt CLI
        run: python -m pip install -r requirements.txt

      - name: Show PreTeXt version
        run: pretext --version

      - name: Build web book
        id: build
        shell: bash
        run: |
          set +e
          pretext build web > /tmp/pretext-web.log 2>&1
          status=$?
          cat /tmp/pretext-web.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report PreTeXt build log
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_EXIT: ${{ steps.build.outputs.exit_code }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          log = open('/tmp/pretext-web.log', encoding='utf-8', errors='replace').read()
          if len(log) > 55000:
              log = log[-55000:]
          body = f"### PreTeXt web build\nCommit: `{os.environ['SHA']}`\nExit code: `{os.environ['BUILD_EXIT']}`\n\n```text\n{log}\n```"
          url = f"https://api.github.com/repos/{os.environ['REPO']}/issues/1/comments"
          req = urllib.request.Request(
              url,
              data=json.dumps({'body': body}).encode(),
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req) as response:
              print(response.status)
          PY

      - name: Stop if PreTeXt build failed
        if: steps.build.outputs.exit_code != '0'
        run: exit 1

      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: output/web

      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Report deployment result
        if: always() && steps.build.outputs.exit_code == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          CONFIGURE_OUTCOME: ${{ steps.pages.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          body = (
              f"### Pages deployment\nCommit: `{os.environ['SHA']}`\n"
              f"Configure Pages: `{os.environ['CONFIGURE_OUTCOME']}`\n"
              f"Deploy Pages: `{os.environ['DEPLOY_OUTCOME']}`\n"
              f"Page URL: {os.environ.get('PAGE_URL') or '(none)'}"
          )
          url = f"https://api.github.com/repos/{os.environ['REPO']}/issues/1/comments"
          req = urllib.request.Request(
              url,
              data=json.dumps({'body': body}).encode(),
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(req) as response:
              print(response.status)
          PY

      - name: Stop if deployment failed
        if: steps.deployment.outcome != 'success'
        run: exit 1
