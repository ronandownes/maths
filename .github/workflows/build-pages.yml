name: Build Maths website from source

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "build_site.py"
      - ".github/workflows/build-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: maths-source-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source and generated pages
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild static pages
        run: python build_site.py
      - name: Commit generated pages only when changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html number algebra functions geometry trigonometry statistics probability unifying
          if git diff --cached --quiet; then
            echo "Generated pages are already up to date."
          else
            git commit -m "Rebuild published Maths pages from source"
            git push origin HEAD:main
          fi
