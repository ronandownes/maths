<script>

(function(){
'use strict';
const el=id=>document.getElementById(id);
const D=Math.PI/180, sind=x=>Math.sin(x*D), cosd=x=>Math.cos(x*D), tand=x=>Math.tan(x*D), rad=x=>x/D;
const rng=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=x=>x[Math.floor(Math.random()*x.length)];
const fmt=x=>Number(Number(x).toFixed(7)).toString();
const pwr=x=>fmt(x)+'<sup>2</sup>';
const frac=(a,b)=>'<span class="frac"><span class="num">'+a+'</span><span class="den">'+b+'</span></span>';
const deg='°';
let family='general',mode='cos-angle',level=1,viewMode='all',n=0,steps=[];
let v={a:8,b:9,c:7};
const tasks={
 general:[
 ['cos-angle','Cosine rule · find angle'],
 ['cos-side','Cosine rule · find side'],
 ['sin-angle','Sine rule · find angle'],
 ['sin-side','Sine rule · find side'],
 ['area-value','Area · find area (SAS)'],
 ['area-side','Area · find side'],
 ['area-angle','Area · find angle(s)'],
 ['area-heron','Area · three sides (Heron)'],
 ['area-baseheight','Area · base and height']
 ],
 right:[
 ['sin-opposite','Sine · find opposite'],
 ['sin-hypotenuse','Sine · find hypotenuse'],
 ['sin-angle','Sine · find angle'],
 ['cos-adjacent','Cosine · find adjacent'],
 ['cos-hypotenuse','Cosine · find hypotenuse'],
 ['cos-angle','Cosine · find angle'],
 ['tan-opposite','Tangent · find opposite'],
 ['tan-adjacent','Tangent · find adjacent'],
 ['tan-angle','Tangent · find angle'],
 ['pyth-hypotenuse','Pythagoras · find hypotenuse'],
 ['pyth-leg','Pythagoras · find a shorter side']
 ]
};
function opts(){
 el('task').replaceChildren();
 for(const [value,label] of tasks[family]){
   const o=document.createElement('option');o.value=value;o.textContent=label;el('task').append(o);
 }
 el('task').value=mode;
 el('type').disabled=family==='right';
 el('diagram-info').textContent=family==='right'?'Right angle shown. Diagram not to scale.':'Diagram not to scale. Only the angle category is represented.';
 for(const k of ['general','right']){
   el(k).classList.toggle('selected',family===k);
   el(k).setAttribute('aria-pressed',String(family===k));
 }
}
function measure(){
 if(level===1)return rng(2,9);
 if(level===2)return rng(10,99);
 if(level===4)return rng(8,60);
 return Number(((rng(100,999)/100)*10**rng(-1,2)).toPrecision(3));
}
function angleChoice(kind){
 if(kind==='right')return 90;
 if(level===1)return kind==='obtuse'?pick([111,122,133,144,155]):pick([22,33,44,55,66,77]);
 if(level===2)return Number((kind==='obtuse'?rng(1050,1550):rng(280,750))/10);
 return Number((kind==='obtuse'?rng(10500,15500):rng(2800,7500))/100);
}
function acuteOrObtuse(){
 const t=el('type').value;
 return t==='random'?pick(['acute','obtuse','right']):t;
}
let wordText='',wordRankCycle=0,wordVariantCycle=0;
const wordTriples=[[14,19,23],[11,16,19],[18,21,26],[13,14,17],
[15,20,25],[14,18,29],[12,17,23],[17,23,27],[10,24,26],[18,25,37],[8,15,17],[13,21,27]];
function wordTriangle(request){
 const candidates=wordTriples.filter(t=>{
  const [x,y,z]=t;
  if(x+y<=z)return false;
  const largestAngle=rad(Math.acos(Math.max(-1,Math.min(1,(x*x+y*y-z*z)/(2*x*y)))));
  const category=Math.abs(largestAngle-90)<.001?'right':largestAngle<87?'acute':largestAngle>102?'obtuse':'near';
  return request==='random'?category!=='near':category===request;
 });
 const sorted=[...pick(candidates.length?candidates:wordTriples)].sort((x,y)=>x-y);
 const rank=request==='obtuse'||request==='right'?2:wordRankCycle++%3;
 const remaining=sorted.filter((v,i)=>i!==rank);
 const a=sorted[rank],sides=sorted.join(', '),variant=wordVariantCycle%8,unit=['cm','cm','cm','cm','m','cm','m','cm'][variant];
 const names=['smallest','middle-sized','largest'],opps=['shortest','middle-length','longest'];
 const rankName=names[rank],sideName=opps[rank];
 const variants=[
  'A triangle has sides '+sides+' '+unit+'. Find its '+rankName+' angle.',
  'The sides of a triangle measure '+sides+' '+unit+'. Calculate the '+rankName+' interior angle.',
  'A triangle has side lengths '+sides+' '+unit+'. Determine the angle opposite its '+sideName+' side.',
  'The three sides of a triangle are '+sides+' '+unit+'. Work out the angle facing its '+sideName+' side.',
  'A triangular plot has boundary lengths of '+sides+' '+unit+'. Calculate its '+rankName+' angle.',
  'A triangular frame has sides '+sides+' '+unit+'. Find the angle between the two sides other than the '+sideName+' side.',
  'A surveyor records the sides of a triangle as '+sides+' '+unit+'. Calculate the angle opposite the '+sideName+' side.',
  'A triangle has sides '+sides+' '+unit+'. Find '+(rank===1?'the angle that is neither the smallest nor the largest':rank===0?'the least of its three interior angles':'the greatest of its three interior angles')+'.'
 ];
 return {values:{a,b:remaining[0],c:remaining[1]},rank,text:variants[(wordVariantCycle++,variant)]};
}
function updateProblem(){const p=el('word-problem');p.hidden=level!==4||!wordText;p.textContent=p.hidden?'':wordText;}

function createWordContext(){
 if(family==='general'){
   if(mode==='cos-side')return 'Two straight routes leave a junction at an angle of '+fmt(v.A)+'°. They measure '+fmt(v.b)+' m and '+fmt(v.c)+' m. Find the distance between their endpoints.';
   if(mode==='sin-side')return 'In a triangular field, side a is '+fmt(v.a)+' m opposite angle A = '+fmt(v.A)+'°. Another angle B is '+fmt(v.B)+'°. Calculate the side opposite B.';
   if(mode==='sin-angle')return 'A triangle has a side of '+fmt(v.a)+' m opposite angle '+fmt(v.A)+'°, and another side of '+fmt(v.b)+' m. Find the possible angle or angles opposite the second side.';
   return '';
 }
 if(mode==='pyth-hypotenuse')return 'Two paths meet at a right angle. Their lengths are '+fmt(v.O)+' m and '+fmt(v.Adj)+' m. Find the straight-line distance between their far endpoints.';
 if(mode==='pyth-leg')return 'A ladder is '+fmt(v.H)+' m long and its foot is '+fmt(v.Adj)+' m from a wall. How high does it reach?';
 if(mode==='sin-opposite')return 'A ladder of length '+fmt(v.H)+' m makes an angle of '+fmt(v.theta)+'° with the ground. Find the height it reaches.';
 if(mode==='sin-hypotenuse')return 'A ladder reaches '+fmt(v.O)+' m up a wall at '+fmt(v.theta)+'° to the ground. Find its length.';
 if(mode==='sin-angle')return 'A ladder of length '+fmt(v.H)+' m reaches '+fmt(v.O)+' m vertically. Calculate its angle to the ground.';
 if(mode==='cos-adjacent')return 'A ramp '+fmt(v.H)+' m long makes an angle of '+fmt(v.theta)+'° to the ground. Find its horizontal run.';
 if(mode==='cos-hypotenuse')return 'A ramp runs '+fmt(v.Adj)+' m horizontally and slopes at '+fmt(v.theta)+'°. Find the ramp length.';
 if(mode==='cos-angle')return 'A ramp is '+fmt(v.H)+' m long with a horizontal run of '+fmt(v.Adj)+' m. Calculate its angle of inclination.';
 if(mode==='tan-opposite')return 'From '+fmt(v.Adj)+' m away from a tree, the angle of elevation to its top is '+fmt(v.theta)+'°. Find the tree’s height.';
 if(mode==='tan-adjacent')return 'A mast is '+fmt(v.O)+' m tall. Its top has an angle of elevation of '+fmt(v.theta)+'°. Find the horizontal distance from the observer.';
 if(mode==='tan-angle')return 'A tower is '+fmt(v.O)+' m high and an observer stands '+fmt(v.Adj)+' m from its foot. Calculate the angle of elevation to its top.';
 return '';
}
function generate(){
 level=Number(el('level').value);wordText='';
 const kind=family==='right'?'right':acuteOrObtuse();
 if(family==='general'){
  if(mode==='cos-angle'){
   if(level===4){const w=wordTriangle(el('type').value);v=w.values;wordText=w.text;}
   else if(kind==='right'){
    const triples=level===1?[[3,4,5]]:level===2?[[5,12,13],[8,15,17],[9,12,15]]:[[30,40,50],[120,160,200],[0.3,0.4,0.5]];
    const t=pick(triples);v={a:t[2],b:t[0],c:t[1]};
   }else{
    let result=null;
    for(let i=0;i<4000;i++){
     const a=measure(),b=measure(),c=measure();
     if(a+b<=c||a+c<=b||b+c<=a)continue;
     const A=rad(Math.acos(Math.max(-1,Math.min(1,(b*b+c*c-a*a)/(2*b*c)))));
     if((kind==='acute'&&A>=26&&A<=77)||(kind==='obtuse'&&A>=106&&A<=153)){result={a,b,c};break;}
    }
    v=result||(kind==='acute'?{a:8,b:9,c:7}:{a:9,b:5,c:6});
   }
  } else if(mode==='area-value')v={b:measure(),c:measure(),A:angleChoice(kind)};
  else if(mode==='area-side'){
   const b=measure(),c=measure(),A=angleChoice(kind);
   v={K:Number((.5*b*c*sind(A)).toPrecision(5)),b,A};
  }else if(mode==='area-angle'){
   const b=measure(),c=measure(),A=kind==='right'?90:kind==='obtuse'?rng(108,150):rng(30,73);
   v={K:Number((.5*b*c*sind(A)).toPrecision(5)),b,c};
  }else if(mode==='area-heron'){
   let tri;
   for(let i=0;i<300;i++){const a=measure(),b=measure(),c=measure();if(a+b>c&&a+c>b&&b+c>a){tri={a,b,c};break}}
   v=tri||{a:13,b:14,c:15};
  }else if(mode==='area-baseheight')v={base:measure(),height:measure()};
  else if(mode==='cos-side')v={b:measure(),c:measure(),A:angleChoice(kind)};
  else if(mode==='sin-side'){
   const A=angleChoice(kind);
   const B=rng(15,Math.max(16,Math.min(85,170-A)));
   v={a:measure(),A,B};
  }else{
   const A=angleChoice(kind);
   let a=measure(),b=measure();
   if(b>=a){const t=a;a=b;b=t;}
   if(a===b)a=a*1.25;
   v={a,A,b};
  }
 }else{
  const ratio=mode.split('-')[0];
  const theta=level===1?pick([22,33,44,55,66,77]):level===2?rng(200,750)/10:rng(2000,7500)/100;
  if(mode==='pyth-hypotenuse')v={O:measure(),Adj:measure()};
  else if(mode==='pyth-leg'){
    const Adj=measure(),O=measure();v={H:Math.hypot(Adj,O),Adj};
    // For level 1 and 2 select a familiar exact right triangle.
    if(level===1)v={H:5,Adj:4};
    if(level===2)v={H:13,Adj:12};
  }else{
   const wanted=mode.split('-')[1],knownSide=(wanted==='opposite')?(ratio==='sin'?'H':'Adj'):(wanted==='hypotenuse')?(ratio==='sin'?'O':'Adj'):(wanted==='adjacent')?(ratio==='cos'?'H':'O'):'';
   if(wanted==='angle'){
    if(ratio==='sin'||ratio==='cos'){
      // An angle question shows only the two supplied sides.
      let H=measure(),leg=measure();
      if(leg>=H){const t=leg;leg=H;H=t;}
      if(leg===H){if(level===1){leg=8;H=9;}else H=H*1.25;}
      v=ratio==='sin'?{O:leg,H}:{Adj:leg,H};
    }else v={O:measure(),Adj:measure()};
   }else{
    v={theta};
    const given=measure();
    if(knownSide==='H')v.H=given;
    else if(knownSide==='Adj')v.Adj=given;
    else v.O=given;
   }
  }
 }
 if(!valid())throw Error('Generated measurements invalid: '+mode+' '+JSON.stringify(v));
 if(level===4&&!wordText)wordText=createWordContext();
 refresh();
}
function valid(){
 const ok=x=>Number.isFinite(x)&&x>0;
 if(family==='general'){
  if(mode==='cos-angle')return ok(v.a)&&ok(v.b)&&ok(v.c)&&v.a+v.b>v.c&&v.a+v.c>v.b&&v.b+v.c>v.a;
  if(mode==='cos-side')return ok(v.b)&&ok(v.c)&&ok(v.A)&&v.A<180;
  if(mode==='sin-side')return ok(v.a)&&ok(v.A)&&ok(v.B)&&v.A+v.B<180;
  if(mode==='area-value')return ok(v.b)&&ok(v.c)&&ok(v.A)&&v.A<180;
  if(mode==='area-side')return ok(v.K)&&ok(v.b)&&ok(v.A)&&v.A<180;
  if(mode==='area-angle')return ok(v.K)&&ok(v.b)&&ok(v.c)&&2*v.K<=v.b*v.c+1e-9;
  if(mode==='area-heron')return ok(v.a)&&ok(v.b)&&ok(v.c)&&v.a+v.b>v.c&&v.a+v.c>v.b&&v.b+v.c>v.a;
  if(mode==='area-baseheight')return ok(v.base)&&ok(v.height);
  const x=v.b*sind(v.A)/v.a;
  return ok(v.a)&&ok(v.b)&&ok(v.A)&&v.A<180&&x>0&&x<=1&&v.A+rad(Math.asin(Math.min(1,x)))<180;
 }
 if(mode==='pyth-hypotenuse')return ok(v.O)&&ok(v.Adj);
 if(mode==='pyth-leg')return ok(v.H)&&ok(v.Adj)&&v.H>v.Adj;
 const ending=mode.split('-')[1],ratio=mode.split('-')[0];
 if(ending==='angle'){
  return ratio==='sin'?ok(v.O)&&ok(v.H)&&v.O<v.H:ratio==='cos'?ok(v.Adj)&&ok(v.H)&&v.Adj<v.H:ok(v.O)&&ok(v.Adj);
 }
 if(!ok(v.theta)||v.theta>=90)return false;
 if(ending==='opposite')return ratio==='sin'?ok(v.H):ok(v.Adj);
 if(ending==='adjacent')return ratio==='cos'?ok(v.H):ok(v.O);
 if(ending==='hypotenuse')return ratio==='sin'?ok(v.O):ok(v.Adj);
 return false;
}
function getKeys(){
 if(family==='general'){
  if(mode==='cos-angle')return ['a','b','c'];
  if(mode==='cos-side')return ['b','c','A'];
  if(mode==='sin-side')return ['a','A','B'];
  if(mode==='area-value')return ['b','c','A'];
  if(mode==='area-side')return ['K','b','A'];
  if(mode==='area-angle')return ['K','b','c'];
  if(mode==='area-heron')return ['a','b','c'];
  if(mode==='area-baseheight')return ['base','height'];
  return ['a','b','A'];
 }
 if(mode==='pyth-hypotenuse')return ['O','Adj'];
 if(mode==='pyth-leg')return ['H','Adj'];
 const ending=mode.split('-')[1],ratio=mode.split('-')[0];
 if(ending==='angle')return ratio==='sin'?['O','H']:ratio==='cos'?['Adj','H']:['O','Adj'];
 if(ending==='opposite')return ratio==='sin'?['theta','H']:['theta','Adj'];
 if(ending==='adjacent')return ratio==='cos'?['theta','H']:['theta','O'];
 if(ending==='hypotenuse')return ratio==='sin'?['theta','O']:['theta','Adj'];
 return [];
}
function labelKey(key){
 return {a:'Side a',b:'Side b',c:'Side c',A:'Angle A (°)',B:'Angle B (°)',K:'Area',base:'Base',height:'Height',O:'Opposite',Adj:'Adjacent',H:'Hypotenuse',theta:'Angle θ (°)'}[key]||key;
}
function syncInputs(){
 const keys=getKeys();
 ['a','b','c'].forEach((id,i)=>{
  const key=keys[i],parent=el('label-'+id);
  parent.hidden=!key;
  if(key){el('l'+id).textContent=labelKey(key);el(id).value=v[key]??'';}
 });
 el('validation').textContent='';
}
function solve(){
 if(family==='general'){
  if(mode==='cos-angle'){
   const z=(v.b*v.b+v.c*v.c-v.a*v.a)/(2*v.b*v.c);
   return {value:rad(Math.acos(Math.max(-1,Math.min(1,z)))),symbol:'A',unit:'°'};
  }
  if(mode==='cos-side')return {value:Math.sqrt(Math.max(0,v.b*v.b+v.c*v.c-2*v.b*v.c*cosd(v.A))),symbol:'a',unit:''};
  if(mode==='area-value')return {value:.5*v.b*v.c*sind(v.A),symbol:'K',unit:' units²'};
  if(mode==='area-side')return {value:2*v.K/(v.b*sind(v.A)),symbol:'c',unit:''};
  if(mode==='area-angle'){
   const ratio=Math.min(1,2*v.K/(v.b*v.c)),first=rad(Math.asin(ratio)),second=180-first;
   return {value:first,symbol:'A',unit:'°',ratio,alternative:Math.abs(first-second)<1e-7?null:second};
  }
  if(mode==='area-heron'){
   const t=(v.a+v.b+v.c)/2;
   return {value:Math.sqrt(Math.max(0,t*(t-v.a)*(t-v.b)*(t-v.c))),symbol:'K',unit:' units²'};
  }
  if(mode==='area-baseheight')return {value:.5*v.base*v.height,symbol:'K',unit:' units²'};
  if(mode==='sin-side')return {value:v.a*sind(v.B)/sind(v.A),symbol:'b',unit:''};
  const s=v.b*sind(v.A)/v.a;
  const first=rad(Math.asin(Math.min(1,s))),second=180-first;
  return {value:first,symbol:'B',unit:'°',alternative:v.A+second<180-1e-8&&Math.abs(first-second)>1e-7?second:null};
 }
 if(mode==='pyth-hypotenuse')return {value:Math.hypot(v.O,v.Adj),symbol:'H',unit:''};
 if(mode==='pyth-leg')return {value:Math.sqrt(Math.max(0,v.H*v.H-v.Adj*v.Adj)),symbol:'O',unit:''};
 const [ratio,ending]=mode.split('-');
 if(ending==='angle'){
  const val=ratio==='sin'?rad(Math.asin(v.O/v.H)):ratio==='cos'?rad(Math.acos(v.Adj/v.H)):rad(Math.atan(v.O/v.Adj));
  return {value:val,symbol:'θ',unit:'°'};
 }
 const theta=v.theta,fn=ratio==='sin'?sind(theta):ratio==='cos'?cosd(theta):tand(theta);
 let val;
 if(ending==='opposite')val=ratio==='sin'?v.H*fn:v.Adj*fn;
 if(ending==='adjacent')val=ratio==='cos'?v.H*fn:v.O/fn;
 if(ending==='hypotenuse')val=ratio==='sin'?v.O/fn:v.Adj/fn;
 return {value:val,symbol:ending==='opposite'?'O':ending==='adjacent'?'Adj':'H',unit:''};
}
function classify(){
 if(family!=='general')return 'right';
 if(mode==='cos-angle'||mode==='area-heron'){
  const delta=v.a*v.a-v.b*v.b-v.c*v.c;
  return Math.abs(delta)<1e-9?'right':delta<0?'acute':'obtuse';
 }
 if(mode==='area-angle'||mode==='area-baseheight')return 'acute';
 return (mode==='cos-side'||mode==='area-value'||mode==='area-side')?v.A===90?'right':v.A<90?'acute':'obtuse':v.A>=90?'obtuse':'acute';
}
function numStage(value,symbol,unit,add){
 const dp=Number(el('dp').value),extra=dp+1,near=Math.round(value);
 if(Math.abs(value-near)<1e-9){
   add('Exact answer: no rounding is needed.',symbol+' = <span class="box">'+near+unit+'</span>','final');
   return;
 }
 const calculator=value.toFixed(Math.min(12,dp+7))+'…';
 const cut=Math.trunc((value+1e-12)*10**extra)/10**extra;
 const trunc=cut.toFixed(extra),digit=Number(trunc.slice(-1));
 const mark=trunc.slice(0,-1)+'<span class="cutmark" data-arrow="'+(digit>=5?'↑':'↓')+'">'+digit+'</span>';
 const rounded=(Math.round((value+Number.EPSILON)*10**dp)/10**dp).toFixed(dp);
 add('Real number (calculator). Skip with pen and paper.',
     symbol+' ≈ '+calculator+unit+' <span class="skip-paper">Skip with pen and paper</span>','calculator-display');
 add('Truncate to '+extra+' decimal place'+(extra===1?'':'s')+' (one extra digit).',
     symbol+' ≈ '+mark+unit,'truncated-value');
 add('Round to '+dp+' decimal place'+(dp===1?'':'s')+' and box the answer.',
     symbol+' ≈ <span class="box">'+rounded+unit+'</span>','final');
}
function sineGraph(k,first,second){
 const L=28,R=469,Y=166,px=a=>L+(R-L)*a/180,py=y=>Y-132*y;
 const line=Array.from({length:91},(_,i)=>(i?'L':'M')+px(i*2).toFixed(1)+' '+py(sind(2*i)).toFixed(1)).join(' ');
 const roots=[first,second].filter((v,i,a)=>i===0||Math.abs(v-a[0])>1e-7);
 return '<svg class="sine-graph" viewBox="0 0 500 205" role="img" aria-label="Sine curve between 0 and 180 degrees with two equal sine values">'+
 '<line x1="'+L+'" x2="'+R+'" y1="'+Y+'" y2="'+Y+'" stroke="#7891a8" stroke-width="2"/>'+
 '<path d="'+line+'" stroke="#2169b6" stroke-width="3" fill="none"/>'+
 '<line x1="'+L+'" x2="'+R+'" y1="'+py(k)+'" y2="'+py(k)+'" stroke="#ce8738" stroke-width="2" stroke-dasharray="7 4"/>'+
 roots.map((a,i)=>'<line x1="'+px(a)+'" x2="'+px(a)+'" y1="'+py(k)+'" y2="'+Y+'" stroke="#178879" stroke-dasharray="4 3"/>'+
 '<circle cx="'+px(a)+'" cy="'+py(k)+'" r="6" fill="'+(i?'#14877a':'#ce5255')+'"/>'+
 '<text x="'+px(a)+'" y="193" text-anchor="middle" font-size="18" fill="#28527d">'+a.toFixed(1)+'°</text>').join('')+'</svg>';
}
function buildSteps(){
 const high=el('detail').value==='high',z=solve(),items=[];
 const add=(instruction,math,cls='',result='')=>items.push({instruction,math,cls,result});
 if(family==='general'){
 if(mode==='cos-angle'){
  const A=z.value,numer=v.b*v.b+v.c*v.c-v.a*v.a,denom=2*v.b*v.c;
  const type=classify(),sq=v.a*v.a,other=v.b*v.b+v.c*v.c;
  const sign=type==='right'?'=':type==='obtuse'?'&gt;':'&lt;';
  const ordered=[v.a,v.b,v.c].sort((x,y)=>x-y),rank=ordered.findIndex(x=>Math.abs(x-v.a)<1e-8);
  const note=level===4?'<span class="checkline">'+ordered.map(fmt).join(' &lt; ')+
     ' &nbsp; ⇒ &nbsp; a = '+fmt(v.a)+'</span>':'';
  add('Classify the problem: three known sides, one unknown angle.',
      'a = '+fmt(v.a)+' &nbsp; b = '+fmt(v.b)+' &nbsp; c = '+fmt(v.c)+
      ' &nbsp; <span class="unknown">A = ?</span>'+note,'classify',
      level===4?['Shortest','Middle','Longest'][rank]+' side → angle A':'SSS → cosine rule (angle)');
  add('Write the cosine rule. The unknown is green.',
      'a<sup>2</sup> = b<sup>2</sup> + c<sup>2</sup> − 2bc <span class="unknown">cos A</span>');
  const predicted='<span class="checkline">'+pwr(v.a)+' = '+fmt(sq)+' &nbsp;;&nbsp; '+
   pwr(v.b)+' + '+pwr(v.c)+' = '+fmt(v.b*v.b)+' + '+fmt(v.c*v.c)+' = '+fmt(other)+'</span>'+
   '<span class="checkline">'+fmt(sq)+' '+sign+' '+fmt(other)+' &nbsp; ⇒ &nbsp; '+
   '<span class="unknown">A '+sign+' 90°</span></span>';
  add('Predict whether the angle is acute, right or obtuse.',predicted,'prediction','Predicted '+type+' angle');
  add('Make cos A the subject.','<span class="unknown">cos A</span> = '+
      frac('b<sup>2</sup> + c<sup>2</sup> − a<sup>2</sup>','2bc'));
  add('Substitute the three side lengths.','<span class="unknown">cos A</span> = '+
      frac(pwr(v.b)+' + '+pwr(v.c)+' − '+pwr(v.a),'2 × '+fmt(v.b)+' × '+fmt(v.c)));
  add('Calculate the numerator and denominator.','<span class="unknown">cos A</span> = '+
      frac(fmt(numer),fmt(denom)));
  const gcd=(a,b)=>{a=Math.abs(Math.round(a));b=Math.abs(Math.round(b));while(b){const t=b;b=a%b;a=t}return a};
  let top=fmt(numer),bottom=fmt(denom);
  if([numer,denom].every(x=>Math.abs(x-Math.round(x))<1e-8)){
    const d=gcd(numer,denom);
    if(d>1){top=fmt(numer/d);bottom=fmt(denom/d);
      add('Reduce the fraction to its simplest form.','<span class="unknown">cos A</span> = '+frac(top,bottom));
    }
  }
  add('Apply inverse cosine (cos⁻¹).','<span class="unknown">A</span> = cos<sup>−1</sup>('+frac(top,bottom)+')');
  add('Enter SHIFT, cos in DEG mode.','<span class="unknown">A</span> = <span class="keycap">SHIFT</span> <span class="keycap">cos</span>('+frac(top,bottom)+')');
  numStage(z.value,z.symbol,z.unit,add);
  add('Look back: does the answer agree with your prediction?',
     '<span class="unknown">A ≈ '+A.toFixed(Number(el('dp').value))+'°</span> &nbsp; '+sign+' 90° &nbsp; ✓',
     'prediction','Look back ✓ '+type+' angle');
  }else if(mode==='cos-side'){
   const lo=Math.abs(v.b-v.c),hi=v.b+v.c;
   add('Classify: two known sides and an included angle.',

       'classify','SAS → cosine rule (side)');
   add('Predict the side-length bounds.','|'+fmt(v.b)+' − '+fmt(v.c)+'| &lt; a &lt; '+fmt(v.b)+' + '+fmt(v.c),'prediction');
   if(high)add('Write the cosine rule.','a<sup>2</sup> = b<sup>2</sup> + c<sup>2</sup> − 2bc cos A');
   add('Substitute the sides and included angle.','a<sup>2</sup> = '+pwr(v.b)+' + '+pwr(v.c)+' − 2 × '+fmt(v.b)+' × '+fmt(v.c)+' cos '+fmt(v.A)+'°');
   if(v.A===90)add('At 90°, cosine rule becomes Pythagoras.','cos 90° = 0 &nbsp; ⇒ &nbsp; a<sup>2</sup> = b<sup>2</sup> + c<sup>2</sup>');
   add('Calculate the square of the missing side.','a<sup>2</sup> ≈ '+(z.value*z.value).toFixed(Math.min(8,Number(el('dp').value)+2)));
   add('Take the positive square root.','a = √('+pwr(v.b)+' + '+pwr(v.c)+' − 2 × '+fmt(v.b)+' × '+fmt(v.c)+' cos '+fmt(v.A)+'°)');
   numStage(z.value,z.symbol,z.unit,add);
   add('Check the side length lies within its bounds.',fmt(lo)+' &lt; '+z.value.toFixed(Number(el('dp').value)+1)+' &lt; '+fmt(hi)+' &nbsp; ✓','prediction');
  }else if(mode==='area-value'){
   add('Classify: two sides and an included angle; find the area.','b = '+fmt(v.b)+' &nbsp; c = '+fmt(v.c)+' &nbsp; A = '+fmt(v.A)+'° &nbsp; <span class="unknown">K = ?</span>','classify','Area · SAS');
   add('Write the triangle area formula.','K = ½bc sin A');
   add('Substitute the known numbers.','K = ½ × '+fmt(v.b)+' × '+fmt(v.c)+' × sin '+fmt(v.A)+'°');
   numStage(z.value,'K',' units²',add);
   add('Check the area is positive and at most ½bc.','0 &lt; K ≤ '+fmt(.5*v.b*v.c)+' &nbsp; ✓','prediction');
  }else if(mode==='area-side'){
   add('Classify: area, included angle and one side given.','K = '+fmt(v.K)+' &nbsp; b = '+fmt(v.b)+' &nbsp; A = '+fmt(v.A)+'° &nbsp; <span class="unknown">c = ?</span>','classify','Area · side');
   add('Write the area formula.','K = ½bc sin A');
   add('Make the unknown side the subject.','c = '+frac('2K','b sin A'));
   add('Substitute the numbers.','c = '+frac('2 × '+fmt(v.K),fmt(v.b)+' × sin '+fmt(v.A)+'°'));
   numStage(z.value,'c','',add);
   add('Check by substituting back into the area formula.','½bc sin A = '+fmt(v.K)+' &nbsp; ✓','prediction');
  }else if(mode==='area-angle'){
   const k=z.ratio;
   add('Classify: area and two sides given; find the included angle.','K = '+fmt(v.K)+' &nbsp; b = '+fmt(v.b)+' &nbsp; c = '+fmt(v.c)+' &nbsp; <span class="unknown">A = ?</span>','classify','Area · angle(s)');
   add('Write the area formula.','K = ½bc sin A');
   add('Make sin A the subject.','sin A = '+frac('2K','bc'));
   add('Substitute and calculate the sine ratio.','sin A = '+frac('2 × '+fmt(v.K),fmt(v.b)+' × '+fmt(v.c))+' ≈ '+Number(k.toPrecision(7)));
   add('Use inverse sine to find the first angle.','A₁ = sin<sup>−1</sup>('+Number(k.toPrecision(7))+')');
   numStage(z.value,'A₁','°',add);
   if(z.alternative!==null){
    add('Use the sine graph to see two possible angles.',sineGraph(k,z.value,z.alternative),'prediction');
    add('Find the supplementary angle.','A₂ = 180° − A₁ ≈ <span class="box">'+z.alternative.toFixed(Number(el('dp').value))+'°</span>','final');
    add('Look back: both angles have the same sine, so the same area.','sin A₁ = sin A₂ &nbsp; ✓','prediction');
   }else add('At 90°, there is only one included angle.','A = 90° &nbsp; ✓','prediction');
  }else if(mode==='area-heron'){
   const semi=(v.a+v.b+v.c)/2;
   add('Classify: three sides given; find area.','a = '+fmt(v.a)+' &nbsp; b = '+fmt(v.b)+' &nbsp; c = '+fmt(v.c)+' &nbsp; <span class="unknown">K = ?</span>','classify','Heron');
   add('Write Heron’s formula.','K = √[s(s−a)(s−b)(s−c)]');
   add('Calculate the semiperimeter.','s = '+frac('a+b+c','2')+' = '+fmt(semi));
   add('Substitute all three side lengths.','K = √['+fmt(semi)+' × '+fmt(semi-v.a)+' × '+fmt(semi-v.b)+' × '+fmt(semi-v.c)+']');
   numStage(z.value,'K',' units²',add);
   add('Look back: the area is positive.','K &gt; 0 &nbsp; ✓','prediction');
  }else if(mode==='area-baseheight'){
   add('Classify: base and perpendicular height given.','base = '+fmt(v.base)+' &nbsp; height = '+fmt(v.height)+' &nbsp; <span class="unknown">K = ?</span>','classify','Area · base-height');
   add('Write the area formula.','K = ½ × base × height');
   add('Substitute and evaluate.','K = ½ × '+fmt(v.base)+' × '+fmt(v.height));
   numStage(z.value,'K',' units²',add);
   add('Check that the units are square units.','K &gt; 0 &nbsp; ✓','prediction');
  }else if(mode==='sin-side'){
   add('Classify: two angles and a known opposite side.',
       'a = '+fmt(v.a)+' &nbsp; A = '+fmt(v.A)+'° &nbsp; B = '+fmt(v.B)+'° &nbsp; <span class="unknown">b = ?</span>',
       'classify','Sine rule → find side');
   if(high)add('Identify the side–opposite-angle pair.','a ↔ A &nbsp;;&nbsp; b ↔ B');
   add('Write the sine rule.','a / sin A = b / sin B');
   add('Make the unknown side the subject.','b = '+frac('a sin B','sin A'));
   add('Substitute the known measurements.','b = '+frac(fmt(v.a)+' sin '+fmt(v.B)+'°','sin '+fmt(v.A)+'°'));
   if(high)add('Enter the expression in DEG mode.','b = '+frac(fmt(v.a)+' × sin '+fmt(v.B)+'°','sin '+fmt(v.A)+'°'));
   numStage(z.value,z.symbol,z.unit,add);
   add('Check the bigger angle faces the bigger side.',(v.B>v.A?'b &gt; a':v.B<v.A?'b &lt; a':'b = a')+' &nbsp; ✓','prediction');
  }else{
   add('Classify: two sides and a known opposite angle.',
       'a = '+fmt(v.a)+' &nbsp; b = '+fmt(v.b)+' &nbsp; A = '+fmt(v.A)+'° &nbsp; <span class="unknown">B = ?</span>',
       'classify','Sine rule → find angle (SSA)');
   if(high)add('Identify the known opposite pair.','a ↔ A &nbsp;;&nbsp; b ↔ B');
   add('Write the sine rule.','a / sin A = b / sin B');
   add('Make sin B the subject.','sin B = '+frac('b sin A','a'));
   add('Substitute the known measurements.','sin B = '+frac(fmt(v.b)+' sin '+fmt(v.A)+'°',fmt(v.a)));
   add('Use inverse sine in DEG mode.','B = sin<sup>−1</sup>('+frac(fmt(v.b)+' sin '+fmt(v.A)+'°',fmt(v.a))+')');
   numStage(z.value,z.symbol,z.unit,add);
   if(z.alternative!==null){
    add('Read the two intersections on the sine curve.',sineGraph(v.b*sind(v.A)/v.a,z.value,z.alternative),'prediction');
    add('Find the supplementary angle; check both angle sums.','B₂ = 180° − B₁ ≈ <span class="box">'+z.alternative.toFixed(Number(el('dp').value))+'°</span>','final');
   }
   add('Check the angle sum.','A + B &lt; 180° &nbsp; ✓','prediction');
  }
 }else{
  const parts=mode.split('-'),ratio=parts[0],kind=parts[1];
  const known=Object.entries(v).map(([k,x])=>k+' = '+fmt(x)+(k==='theta'?'°':'')).join(' &nbsp; ');
  add('Classify the right triangle and identify the unknown.',
      known+' &nbsp; <span class="unknown">'+z.symbol+' = ?</span>',
      'classify',ratio==='pyth'?'Pythagoras':ratio==='sin'?'SOH':ratio==='cos'?'CAH':'TOA');
  if(ratio==='pyth'){
   const equation='H<sup>2</sup> = O<sup>2</sup> + Adj<sup>2</sup>';
   if(high)add('Cosine rule with a right angle: cos 90° = 0.','c<sup>2</sup> = a<sup>2</sup> + b<sup>2</sup> − 2ab cos 90° = a<sup>2</sup> + b<sup>2</sup>');
   if(high)add('Write Pythagoras’ theorem.',equation);
   if(kind==='hypotenuse'){

   }else{
    add('Rearrange to make the missing side the subject.','O<sup>2</sup> = H<sup>2</sup> − Adj<sup>2</sup>');

   }
   numStage(z.value,z.symbol,z.unit,add);
   add('Check the hypotenuse is longest.',kind==='hypotenuse'?'H &gt; O &nbsp; and &nbsp; H &gt; Adj &nbsp; ✓':'H &gt; O &nbsp; ✓','prediction');
  }else{
   const names={sin:'sin',cos:'cos',tan:'tan'}, ratios={sin:['O','H'],cos:['Adj','H'],tan:['O','Adj']};
   const top=ratios[ratio][0],bottom=ratios[ratio][1],R=names[ratio];
   const tag={sin:'SOH',cos:'CAH',tan:'TOA'}[ratio];
   if(high)add('Recall '+tag+'.',R+' θ = '+frac(top,bottom));
   const symbol=z.symbol;
   let formula,sub;
   if(kind==='angle'){
    const inv={sin:'sin',cos:'cos',tan:'tan'}[ratio];
    formula='θ = '+inv+'<sup>−1</sup>('+frac(top,bottom)+')';
    sub='θ = '+inv+'<sup>−1</sup>('+frac(fmt(v[top]),fmt(v[bottom]))+')';
   }else if(symbol===top){
    formula=top+' = '+bottom+' '+R+' θ';
    sub=top+' = '+fmt(v[bottom])+' '+R+' '+fmt(v.theta)+'°';
   }else{
    formula=bottom+' = '+frac(top,R+' θ');
    sub=bottom+' = '+frac(fmt(v[top]),R+' '+fmt(v.theta)+'°');
   }
   add('Make the unknown the subject.',formula);
   add('Substitute the known values.',sub);
   if(kind==='angle')add('Use SHIFT then '+R+' on the calculator in DEG mode.',sub);
   else if(high)add('Enter the expression in DEG mode.',sub);
   numStage(z.value,z.symbol,z.unit,add);
   if(kind==='angle')add('Check the angle is acute.','0° &lt; θ &lt; 90° &nbsp; ✓','prediction');
   else add('Check the side length is positive.',symbol+' &gt; 0 &nbsp; ✓','prediction');
  }
 }
 steps=items;
 n=viewMode==='all'?steps.length:0;
}
function drawNode(tag,attrs,label){
 const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
 for(const [k,val] of Object.entries(attrs))e.setAttribute(k,String(val));
 if(label!==undefined)e.textContent=label;
 el('triangle').append(e);return e;
}
function textAt(x,y,label,color='#20558d',size=33){
 drawNode('text',{x,y,'text-anchor':'middle','dominant-baseline':'middle','font-size':size,fill:color,'font-weight':800,'paint-order':'stroke',stroke:'#fff','stroke-width':8,'stroke-linejoin':'round'},label);
}
function drawSide(p,q,center,label,color='#20558d'){
 let dx=q[0]-p[0],dy=q[1]-p[1],len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len;
 let mx=(p[0]+q[0])/2,my=(p[1]+q[1])/2;
 if((mx-center[0])*nx+(my-center[1])*ny<0){nx=-nx;ny=-ny;}
 textAt(Math.min(476,Math.max(26,mx+nx*35)),Math.min(330,Math.max(28,my+ny*35)),label,label.includes('?')?'#087d6c':'#263b51',33);
}
function draw(){
 const svg=el('triangle');svg.replaceChildren();
 drawNode('rect',{x:0,y:0,width:500,height:355,rx:10,fill:'#fff'});
 const z=solve();
 if(family==='right'){
  const P={A:[89,277],B:[419,277],C:[419,60]},ctr=[310,204];
  drawNode('polygon',{points:Object.values(P).map(t=>t.join(',')).join(' '),stroke:'#2868dc','stroke-width':5,fill:'#edf4ff','stroke-linejoin':'round'});
  const get=k=>k in v?fmt(v[k]):k===z.symbol?'?':'';
  drawSide(P.B,P.C,ctr,'O '+(get('O')||''),'#bc3344');
  drawSide(P.A,P.B,ctr,'Adj '+(get('Adj')||''),'#20558d');
  drawSide(P.A,P.C,ctr,'H '+(get('H')||''),'#20558d');
  drawNode('polyline',{points:'390,277 390,248 419,248',fill:'none',stroke:'#0b8378','stroke-width':4});
  textAt(170,242,v.theta!==undefined?fmt(v.theta)+'°':z.symbol==='θ'?'?':'θ','#087d76',30);
  textAt(69,296,'A','#6c8298',18);
 }else{
  let cat=classify(),P={A:[108,275],B:[445,275],C:cat==='obtuse'?[26,48]:cat==='right'?[108,57]:[277,46]},ctr=[(P.A[0]+P.B[0]+P.C[0])/3,(P.A[1]+P.B[1]+P.C[1])/3];
  drawNode('polygon',{points:['A','B','C'].map(k=>P[k].join(',')).join(' '),stroke:'#2868dc','stroke-width':5,fill:'#edf4ff','stroke-linejoin':'round'});
  const display={a:mode==='cos-angle'?fmt(v.a):mode==='cos-side'?'?':mode==='sin-side'?fmt(v.a):fmt(v.a),
                 b:mode==='cos-angle'||mode==='cos-side'?fmt(v.b):mode==='sin-side'?'?':fmt(v.b),
                 c:mode==='cos-angle'||mode==='cos-side'?fmt(v.c):''};
  drawSide(P.B,P.C,ctr,display.a,'#b92d3e');
  drawSide(P.A,P.C,ctr,display.b,'#20558d');
  if(display.c)drawSide(P.A,P.B,ctr,display.c,'#20558d');
  const aa=Math.atan2(P.B[1]-P.A[1],P.B[0]-P.A[0]),ac=Math.atan2(P.C[1]-P.A[1],P.C[0]-P.A[0]),rr=43;
  if(cat==='right')drawNode('polyline',{points:'135,275 135,248 108,248',fill:'none',stroke:'#0b8378','stroke-width':3});
  else{let pts=[];for(let k=0;k<=24;k++){let t=ac+(aa-ac)*k/24;pts.push((P.A[0]+rr*Math.cos(t))+','+(P.A[1]+rr*Math.sin(t)));}
   drawNode('polyline',{points:pts.join(' '),fill:'none',stroke:'#078579','stroke-width':3});
  }
  let at=(aa+ac)/2;
  textAt(P.A[0]+83*Math.cos(at),P.A[1]+83*Math.sin(at),mode==='cos-angle'?'?':fmt(v.A)+'°','#087e72',29);
  if(mode==='sin-side'||mode==='sin-angle')textAt(P.B[0]-70,P.B[1]-38,mode==='sin-side'?fmt(v.B)+'°':'?','#087e72',25);
  textAt(P.A[0]-24,P.A[1]+26,'A','#72869b',20);
 }
}
function render(){
 draw();updateProblem();
 const board=el('mathboard');board.replaceChildren();
 if(n===0)board.innerHTML='<div class="blank">'+solve().symbol+' = ?</div>';
 else steps.slice(0,n).forEach((s,i)=>{
  const row=document.createElement('div');row.className='mathrow '+s.cls+(i===n-1?' current':'');
  row.innerHTML=s.math;board.append(row);
 });
 el('all').setAttribute('aria-pressed',String(viewMode==='all'));
 el('reset').setAttribute('aria-pressed',String(viewMode==='step'));
 el('next').disabled=n>=steps.length;el('back').disabled=n===0;
 el('progress').textContent=n+' / '+steps.length+' steps revealed · click any instruction';
 if(typeof compactWork==='function')compactWork();
 const list=el('outline');list.replaceChildren();
 steps.forEach((s,i)=>{
   const b=document.createElement('button');b.type='button';
   b.className='step-button '+(i<n?'done':i===n?'next-step':'later');
   const num=document.createElement('span');num.className='step-number';num.textContent=(i<n?'✓':i+1)+'.';
   const label=document.createElement('span');label.textContent=i<n&&s.result?s.result:s.instruction;
   b.append(num,label);
   b.addEventListener('click',()=>{viewMode='step';n=i+1;render();});
   b.setAttribute('aria-label','Step '+(i+1)+': '+s.instruction);
   list.append(b);
 });
}
function refresh(){syncInputs();buildSteps();render();}

}

el('right').addEventListener('click',()=>switchFamily('right'));
el('task').addEventListener('change',()=>{mode=el('task').value;generate()});
for(const k of ['level','type'])el(k).addEventListener('change',generate);
for(const k of ['detail','dp'])el(k).addEventListener('change',()=>{
 const old=n,wasAll=viewMode==='all',last=old?steps[old-1]?.instruction:null;
 buildSteps();const index=last?steps.findIndex(s=>s.instruction===last):-1;
 n=wasAll?steps.length:old===0?0:index>=0?index+1:Math.min(old,steps.length);render();
});
el('new').addEventListener('click',generate);
el('all').addEventListener('click',()=>{viewMode='all';n=steps.length;render()});
el('reset').addEventListener('click',()=>{viewMode='step';n=0;render()});
el('restart').addEventListener('click',()=>{viewMode='step';n=0;render()});
el('step-restart').addEventListener('click',()=>{viewMode='step';n=0;render()});
el('next').addEventListener('click',()=>{viewMode='step';n=Math.min(steps.length,n+1);render()});
el('back').addEventListener('click',()=>{viewMode='step';n=Math.max(0,n-1);render()});
el('edit').addEventListener('click',()=>{el('manual').hidden=!el('manual').hidden;syncInputs()});
el('apply').addEventListener('click',()=>{
 const keys=getKeys(),cand={};
 for(let i=0;i<keys.length;i++)cand[keys[i]]=Number(el(['a','b','c'][i]).value);
 const prev=v;v=cand;
 if(!valid()){v=prev;el('validation').textContent='Check positive lengths, valid angles and triangle constraints.';return;}
 if(level===4)wordText=family==='general'&&mode==='cos-angle'?'A triangle has sides '+[v.a,v.b,v.c].sort((x,y)=>x-y).join(', ')+'. Calculate the angle opposite side '+v.a+'.':createWordContext();
 refresh();
});

/* Draggable and keyboard-accessible splitters. The existing width slider remains active. */
const layout=document.getElementById('main'),resizeVisual=document.getElementById('resize-visual'),resizeLanguage=document.getElementById('resize-language');
let visualShare=38,languageShare=24;
const clampShare=(n,min,max)=>Math.max(min,Math.min(max,n));
function applyColumnWidths(v,l,priority='visual'){
 let visual=clampShare(Number(v),18,60),language=clampShare(Number(l),16,52);
 if(visual+language>78){
  if(priority==='language')language=78-visual;
  else visual=78-language;
 }
 visualShare=clampShare(visual,18,60);
 languageShare=clampShare(language,16,52);
 document.documentElement.style.setProperty('--visual-fr',visualShare+'fr');
 document.documentElement.style.setProperty('--symbols-fr',(100-visualShare-languageShare)+'fr');
 document.documentElement.style.setProperty('--language-fr',languageShare+'fr');
 el('width').value=String(Math.round(visualShare));
 el('shrink').textContent=visualShare<=21?'Expand diagram':'Shrink diagram';
 resizeVisual.setAttribute('aria-valuenow',String(Math.round(visualShare)));
 resizeVisual.setAttribute('aria-valuetext',Math.round(visualShare)+'% Visual');
 resizeLanguage.setAttribute('aria-valuenow',String(Math.round(100-languageShare)));
 resizeLanguage.setAttribute('aria-valuetext',Math.round(languageShare)+'% Language');
}
function resizeColumn(kind,change){
 if(kind==='visual')applyColumnWidths(visualShare+change,languageShare,'visual');
 else applyColumnWidths(visualShare,languageShare-change,'language');
}
for(const [handle,kind] of [[resizeVisual,'visual'],[resizeLanguage,'language']]){
 let start=null;
 handle.addEventListener('pointerdown',e=>{
  if(e.button!==0&&e.pointerType==='mouse')return;
  const rects=[el('visual-panel').getBoundingClientRect(),el('symbols-panel').getBoundingClientRect(),el('language-panel').getBoundingClientRect()];
  const pixelWidth=rects.reduce((sum,r)=>sum+r.width,0)||layout.clientWidth;
  if(kind==='visual')markDiagramCustom();
  start={pointer:e.pointerId,x:e.clientX,v:visualShare,l:languageShare,pixelWidth};
  handle.setPointerCapture(e.pointerId);
  handle.classList.add('dragging');
  document.body.classList.add('resizing-columns');
  e.preventDefault();
 });
 handle.addEventListener('pointermove',e=>{
  if(!start||e.pointerId!==start.pointer)return;
  const delta=100*(e.clientX-start.x)/start.pixelWidth;
  if(kind==='visual')applyColumnWidths(start.v+delta,start.l,'visual');
  else applyColumnWidths(start.v,start.l-delta,'language');
 });
 function stop(e){
  if(start&&e.pointerId===start.pointer){
   start=null;handle.classList.remove('dragging');document.body.classList.remove('resizing-columns');
   if(handle.hasPointerCapture(e.pointerId))handle.releasePointerCapture(e.pointerId);
  }
 }
 handle.addEventListener('pointerup',stop);
 handle.addEventListener('pointercancel',stop);
 handle.addEventListener('lostpointercapture',()=>{start=null;handle.classList.remove('dragging');document.body.classList.remove('resizing-columns')});
 handle.addEventListener('keydown',e=>{
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight'&&e.key!=='Home')return;
  e.preventDefault();
  if(e.key==='Home'){if(kind==='visual')setDiagramMode('auto');else applyColumnWidths(visualShare,24,'language');return}
  const amount=(e.shiftKey?5:2)*(e.key==='ArrowRight'?1:-1);
  if(kind==='visual')markDiagramCustom();
  resizeColumn(kind,amount);
 });
 handle.addEventListener('dblclick',()=>{if(kind==='visual')setDiagramMode('auto');else applyColumnWidths(visualShare,24,'language')});
}

const diagramSizes={auto:42,full:50,large:42,medium:32,small:24,minimum:18};
let diagramMode='auto';
function setDiagramMode(mode){
 if(!(mode in diagramSizes))return;
 diagramMode=mode;el('diagram-size').value=mode;
 el('main').classList.toggle('diagram-only',mode==='full');
 if(mode==='full')document.body.classList.add('focus-mode');
 applyColumnWidths(mode==='auto'&&document.body.classList.contains('focus-mode')?18:diagramSizes[mode],languageShare,'visual');
}
function markDiagramCustom(){diagramMode='custom';el('diagram-size').value='custom'}
function compactWork(){
 if(!document.body.classList.contains('focus-mode')||typeof requestAnimationFrame!=='function')return;
 requestAnimationFrame(()=>{
  const panel=el('symbols-panel'),board=el('mathboard');
  document.body.classList.remove('dense-work');
  if(board.scrollHeight>panel.clientHeight-42)document.body.classList.add('dense-work');
 });
}
function enterWorkspace(e){
 if(document.body.classList.contains('focus-mode'))return;
 const target=e&&e.target;
 const manual=target&&typeof target.closest==='function'&&
   target.closest('#resize-visual,#resize-language,#width,#shrink,#diagram-size');
 document.body.classList.add('focus-mode');
 document.body.classList.remove('controls-open');
 if(diagramMode==='auto'&&!manual)applyColumnWidths(18,languageShare,'visual');
 if(typeof window!=='undefined')window.scrollTo(0,0);
 compactWork();
}
const chrome=el('app-chrome'),hotzone=el('chrome-hotzone');
hotzone.addEventListener('pointerenter',()=>document.body.classList.add('controls-open'));
hotzone.addEventListener('click',()=>document.body.classList.toggle('controls-open'));
chrome.addEventListener('pointerenter',()=>document.body.classList.add('controls-open'));
chrome.addEventListener('pointerleave',()=>document.body.classList.remove('controls-open'));
el('main').addEventListener('pointerdown',enterWorkspace);
el('main').addEventListener('keydown',e=>{
 if(e.key==='Enter'||e.key===' ')enterWorkspace(e);
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&document.body.classList.contains('focus-mode')&&!document.fullscreenElement){
  document.body.classList.remove('focus-mode','controls-open','dense-work');
  if(diagramMode==='auto')applyColumnWidths(42,languageShare,'visual');
 }
});
el('diagram-size').addEventListener('change',e=>setDiagramMode(e.target.value));
el('diagram-back').addEventListener('click',()=>setDiagramMode('auto'));
function toggleDiagram(hide){
 el('main').classList.toggle('diagram-hidden',hide);
 el('show-diagram').hidden=!hide;
 if(hide)el('main').classList.remove('diagram-only');
}
el('hide-diagram').addEventListener('click',()=>toggleDiagram(true));
el('show-diagram').addEventListener('click',()=>toggleDiagram(false));
el('width').addEventListener('input',e=>{
 markDiagramCustom();applyColumnWidths(Number(e.target.value),languageShare,'visual');
});
el('shrink').addEventListener('click',()=>setDiagramMode(visualShare<=21?'large':'minimum'));
setDiagramMode('auto');
el('screen').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()});

opts();
const params=new URLSearchParams(location.search);
if(params.get('family')==='right'){family='right';mode='sin-opposite';opts();generate();}
else if(params.get('method') && tasks.general.some(x=>x[0]===params.get('method'))){mode=params.get('method');opts();generate();}
else {v={a:8,b:9,c:7};refresh();}
})();
