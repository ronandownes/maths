<!doctype html>
<html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polynomial multiplication | Maths</title><link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202124;background:#f1f3f4}*{box-sizing:border-box}body{margin:0}
header{display:flex;justify-content:space-between;gap:18px;align-items:center;background:white;border-bottom:1px solid #dadce0;padding:10px max(18px,calc((100vw - 1150px)/2));flex-wrap:wrap}
.identity{display:flex;align-items:center;gap:16px}.identity img{width:145px;max-width:24vw;display:block}.identity a{color:#174ea6}.identity h1{font-size:1.4rem;margin:2px 0}
main{max-width:1150px;margin:22px auto;background:white;padding:24px 28px 40px;min-height:85vh}
button,select,input{font:inherit;border:1px solid #a5adb8;border-radius:7px;background:white;padding:10px;color:#202124}button{cursor:pointer}button[aria-pressed=true]{background:#e8f0fe;border-color:#1a73e8}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #4285f4;outline-offset:2px}
.controls,.stages,.fieldgroups,.nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:12px 0}.controls label{font-weight:600}
.fieldgroups{gap:25px;align-items:end}.field{display:flex;flex-direction:column;gap:5px;color:#596474;font-size:.85rem}
.field input{width:112px;min-width:112px;font-size:1.22rem;padding:10px 9px;appearance:auto;line-height:1.35;font-variant-numeric:tabular-nums}
.stages{margin-top:20px}.stages button{font-size:.97rem}.canvas{overflow-x:auto;border:1px solid #d7dde4;border-radius:10px;padding:22px 16px;min-height:335px}
table{margin:auto;border-collapse:collapse;table-layout:fixed;width:min(100%,800px);font-variant-numeric:tabular-nums}td,th{text-align:center;padding:10px 5px;font-size:clamp(1.35rem,2.4vw,2rem);white-space:nowrap}th{font-size:1.12rem;color:#657080;font-weight:500}td.tag{font: .85rem Arial,sans-serif;color:#657080;text-align:right;width:100px}
tr.line td{border-bottom:2px solid #9ca3af}tr.total td{font-weight:700;border-top:2px solid #9ca3af}
.result{font:2rem/1.5 'Cambria Math',Cambria,Georgia,serif;text-align:center;margin-top:19px}.result sup{font-size:.63em}
.nav{justify-content:space-between;margin-top:17px}.nav button{min-width:100px}#prev:disabled,#next:disabled{opacity:.4;cursor:default}
@media(max-width:700px){main{padding:15px 9px}.identity img{width:90px}.field input{min-width:83px;width:83px}td,th{font-size:1.25rem;padding:8px 4px}td.tag{width:58px;font-size:.7rem}.canvas{padding:12px 4px}.stages button{font-size:.82rem}}
@media print{header,.controls,.fieldgroups,.stages,.nav{display:none!important}body,main{background:white;margin:0;max-width:none;padding:0;min-height:0}.canvas{border:none;min-height:0;padding:16mm 0}td,th{font-size:20pt}.result{font-size:24pt}#stageTitle{font-size:18pt}}

.controls{row-gap:12px}.practice-note{color:#606b75;font-size:.95rem;margin:7px 0 14px}.fieldgroups{gap:16px}.fieldgroups>div{display:flex;flex-wrap:wrap;gap:10px;align-items:end}.field{font-size:.88rem}.math-factor{font:1.55rem/1.4 Cambria,"Cambria Math",Georgia,serif;text-align:center;margin:10px 0 18px}.math-factor sup,.result sup{vertical-align:super;font-size:.65em}
td,th{font-family:Cambria,"Cambria Math",Georgia,serif}.result{margin-top:12px}
.stage-heading{font-weight:600}.answer-controls{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 16px}.answer-controls button{font-weight:600}.answer-controls button:first-child{border-color:#657080}@media print{.answer-controls{display:none}}
@media(max-width:700px){.field input{width:94px;min-width:94px}.controls button{font-size:.88rem}}
@media print{.practice-note{display:none}.math-factor{font-size:20pt} @page{size:A4;margin:15mm}}

.primary{background:#e8f0fe;color:#174ea6;border-color:#1a73e8;font-weight:700}.controls select{max-width:100%;min-height:43px}.controls{row-gap:12px}
.factor-inputs{display:flex;flex-wrap:wrap;gap:11px;align-items:end}.factor-inputs::before{content:attr(data-title);display:block;width:100%;font-size:.86rem;font-weight:700;color:#526071}
.field input{width:112px!important;min-width:112px!important;font-size:1.23rem!important;appearance:auto!important}.field input::-webkit-inner-spin-button{-webkit-appearance:auto!important;opacity:1}
.math-factor{font:2rem/1.4 "Cambria Math",Cambria,Georgia,serif;text-align:center;margin:8px 0 18px}.math-factor sup,.result sup{font-size:.64em;vertical-align:super}
td,th{font-family:"Cambria Math",Cambria,Georgia,serif}.practice-note{color:#5f6368;font-size:.93rem}.method-note{font-size:.88rem;color:#586575;margin:8px 0}.method-note:empty{display:none}
.cross{margin:auto;max-width:600px;text-align:center;font:1.65rem/1.5 "Cambria Math",Cambria,Georgia,serif}.cross-factors{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:center;border-bottom:2px solid #9ca3af;padding:8px}.cross-products{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;margin-top:8px}.cross-products>div{padding:8px}.cross-products strong{font-size:.9rem;color:#647082;display:block;font-family:Arial,sans-serif;font-weight:500}
@media print{.controls,.practice-note,.answer-controls,.stages,.fieldgroups,.nav{display:none!important}}
</style></head><body>
<header><div class="identity"><a href="../../index.html" aria-label="Maths home"><img src="../../assets/maths-logo.svg" alt="Maths four-dot logo"></a><div><a href="../../algebra/index.html">Algebra</a><h1>Polynomial multiplication</h1></div></div><button id="print">Print current stage</button></header>
<main>
<div class="controls"><label for="fixed">Class questions</label><select id="fixed"><option value="0">Q1</option><option value="1">Q2</option><option value="2">Q3</option><option value="3">Q4</option></select><button id="openFixed">Open question</button><button id="random" class="primary">Random</button></div>
<div class="controls filters"><label for="type">Type</label><select id="type"><option value="bb">Binomial × binomial</option><option value="qb" selected>Quadratic × linear</option><option value="qq">Quadratic × quadratic</option></select><label for="sign">Signs</label><select id="sign"><option value="positive">Positive</option><option value="negative">Negative</option><option value="mixed" selected>Mixed</option></select><label for="pattern">Coefficients</label><select id="pattern"></select></div>
<div class="controls"><button id="previousQuestion">← Previous question</button><strong id="questionLabel">Q1</strong><button id="nextQuestion">Next question →</button><button id="restore">Restore coefficients</button></div>
<p class="practice-note">Complete Q1–Q4, then try Random. Work independently first; reveal steps only when needed.</p>
<div class="fieldgroups" id="fields"></div><p class="method-note" id="methodNote"></p>
<div class="stages" id="stages"></div><div class="answer-controls"><button id="questionOnly">Question only</button><button id="showAnswer">Show answer</button></div>
<h2 id="stageTitle"></h2><div class="canvas" id="canvas" aria-live="polite"></div>
<div class="nav"><button id="prev">← Previous step</button><button id="next">Next step →</button></div>
</main>
<script>
(()=>{'use strict';
const bank=[
 {a:[2,3,4],b:[5,6],type:'qb'},
 {a:[3,-4,5],b:[7,-2],type:'qb'},
 {a:[2,3,4],b:[5,6,-3],type:'qq'},
 {a:[2,-4,6],b:[-3,2,-5],type:'qq'}
];
const titles=['1. Stacked factors','2. Strip the powers','3. Partial products','4. Add the columns','5. Restore the powers'];
const $=id=>document.getElementById(id),copy=q=>({a:q.a.slice(),b:q.b.slice(),type:q.type});
let history=bank.map(copy),index=0,step=0,answerOnly=false,current=copy(bank[0]);
const power=n=>n===0?'':n===1?'x':'x<sup>'+n+'</sup>';
function fmt(a){let s='',d=a.length-1;for(let i=0;i<a.length;i++){let v=a[i],k=d-i;if(!v)continue;let t=(k&&Math.abs(v)===1?'':Math.abs(v))+power(k);s+=(s?(v<0?' − ':' + '):(v<0?'−':''))+t}return s||'0'}
function mul(a,b){let out=Array(a.length+b.length-1).fill(0);a.forEach((v,i)=>b.forEach((w,j)=>out[i+j]+=v*w));return out}
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function options(){let t=$('type').value,p=$('pattern'),old=p.value;let choices=t==='bb'?[['bothUnit','Both x coefficients = 1'],['firstUnit','First x coefficient = 1'],['secondUnit','Second x coefficient = 1'],['general','General coefficients']]:t==='qb'?[['monic','Quadratic leading coefficient = 1'],['general','General coefficients']]:[['bothMonic','Both leading coefficients = 1'],['firstMonic','First leading coefficient = 1'],['secondMonic','Second leading coefficient = 1'],['general','General coefficients']];
p.replaceChildren();choices.forEach(([value,name])=>{let op=document.createElement('option');op.value=value;op.textContent=name;p.append(op)});p.value=choices.some(q=>q[0]===old)?old:(t==='bb'?'bothUnit':'general')}
function generate(){let type=$('type').value,pattern=$('pattern').value,sign=$('sign').value,al=type==='bb'?2:3,bl=type==='qq'?3:2;
function coefficients(size){let arr=[rand(2,9)];for(let i=1;i<size;i++){let v=rand(1,9);if(sign==='negative'||(sign==='mixed'&&rand(0,1)))v=-v;arr.push(v)}return arr}
let a=coefficients(al),b=coefficients(bl);
if(pattern==='bothUnit'||pattern==='firstUnit'||pattern==='monic'||pattern==='bothMonic'||pattern==='firstMonic')a[0]=1;
if(pattern==='bothUnit'||pattern==='secondUnit'||pattern==='bothMonic'||pattern==='secondMonic')b[0]=1;
if(sign==='mixed'){let non=[...a.slice(1),...b.slice(1)];if(non.every(v=>v>0))b[b.length-1]*=-1;else if(non.every(v=>v<0))a[a.length-1]*=-1}
return {a,b,type}
}
function load(n){index=Math.max(0,Math.min(n,history.length-1));current=copy(history[index]);fieldInputs();render();navigation()}
function navigation(){$('questionLabel').textContent=index<4?'Q'+(index+1):'Random '+(index-3);$('previousQuestion').disabled=index===0;$('nextQuestion').disabled=index>=history.length-1;$('fixed').value=String(Math.min(index,3))}
function fieldInputs(){$('fields').replaceChildren();[['First factor','a'],['Second factor','b']].forEach(([name,key])=>{let div=document.createElement('div');div.className='factor-inputs';div.dataset.title=name;current[key].forEach((v,i)=>{let d=current[key].length-i-1,label=document.createElement('label');label.className='field';label.textContent=d===0?'#':d===1?'x':'x'+d;let input=document.createElement('input');input.type='number';input.step='1';input.min='-999';input.max='999';input.value=v;input.setAttribute('aria-label',name+' coefficient of '+label.textContent);input.oninput=()=>{if(input.value.trim()===''||!Number.isInteger(+input.value)||Math.abs(+input.value)>999)return;current[key][i]=+input.value;render()};label.append(input);div.append(label)});$('fields').append(div)})}
function addRow(table,values,label='',className='',withPowers=false){const tr=document.createElement('tr');tr.className=className;const t=document.createElement('td');t.className='tag';t.textContent=label;tr.append(t);values.forEach((v,i)=>{let c=document.createElement('td'),degree=values.length-i-1;c.innerHTML=String(v)+(withPowers&&v&&degree?power(degree):'');tr.append(c)});table.append(tr)}
function render(){let {a,b,type}=current,answer=mul(a,b),n=answer.length,degree=n-1,bb=type==='bb';
 $('methodNote').textContent=bb?'For two binomials, vertical cross-product multiplication is usually simpler than stripping powers. Collect the middle products in the like-terms column.':'';
 $('stageTitle').textContent=answerOnly?'Answer':titles[step];
 $('stages').replaceChildren();titles.forEach((label,i)=>{let button=document.createElement('button');button.textContent=label;button.setAttribute('aria-pressed',String(step===i&&!answerOnly));button.onclick=()=>{step=i;answerOnly=false;render()};$('stages').append(button)});
 const root=$('canvas');root.replaceChildren();const formula=document.createElement('div');formula.className='math-factor';formula.innerHTML='('+fmt(a)+')('+fmt(b)+')';root.append(formula);
 if(answerOnly){let res=document.createElement('div');res.className='result';res.innerHTML=fmt(answer);root.append(res);$('prev').disabled=true;$('next').disabled=true;return}
 if(bb){const cross=document.createElement('div');cross.className='cross';let top=document.createElement('div');top.className='cross-factors';top.innerHTML='<span>('+fmt(a)+')</span><span>('+fmt(b)+')</span>';cross.append(top);
 if(step>=2){let parts=document.createElement('div');parts.className='cross-products';let other=document.createElement('div'),middle=document.createElement('div');let first=a[0]*b[0],last=a[1]*b[1],left=a[0]*b[1],right=a[1]*b[0];other.innerHTML='<strong>Outer products</strong>'+first+'x<sup>2</sup><div>'+last+'</div>';middle.innerHTML='<strong>Like-terms column</strong>'+left+'x<br>'+right+'x';parts.append(other,middle);cross.append(parts)}
 if(step>=3){let line=document.createElement('div');line.textContent='Middle coefficient: '+(a[0]*b[1])+' + '+(a[1]*b[0])+' = '+answer[1];cross.append(line)}
 root.append(cross);
 }else{const table=document.createElement('table');let hdr=document.createElement('tr');hdr.append(document.createElement('th'));for(let d=degree;d>=0;d--){let th=document.createElement('th');th.innerHTML=d?power(d):'#';hdr.append(th)}table.append(hdr);
 const pad=x=>Array(n-x.length).fill(0).concat(x);
 addRow(table,pad(a),'','',step===0);addRow(table,pad(b),'','line',step===0);
 if(step>=2)for(let j=b.length-1;j>=0;j--){let shift=b.length-j-1,values=Array(n).fill(0);for(let i=0;i<a.length;i++)values[n-a.length+i-shift]=a[i]*b[j];addRow(table,values)}
 if(step>=3)addRow(table,answer,'+','total');
 if(step>=4)addRow(table,answer,'','total',true);
 root.append(table)}
 if(step===4){let res=document.createElement('div');res.className='result';res.innerHTML=fmt(answer);root.append(res)}
 $('prev').disabled=step===0;$('next').disabled=step===4}
$('type').onchange=options;
$('random').onclick=()=>{history=history.slice(0,index+1);history.push(generate());load(history.length-1)};
$('openFixed').onclick=()=>load(+$('fixed').value);
$('previousQuestion').onclick=()=>load(index-1);
$('nextQuestion').onclick=()=>load(index+1);
$('restore').onclick=()=>{current=copy(history[index]);fieldInputs();render()};
$('questionOnly').onclick=()=>{answerOnly=false;step=0;render()};
$('showAnswer').onclick=()=>{answerOnly=true;render()};
$('prev').onclick=()=>{answerOnly=false;step=Math.max(0,step-1);render()};
$('next').onclick=()=>{answerOnly=false;step=Math.min(4,step+1);render()};
$('print').onclick=()=>window.print();
options();load(0);
})();
</script></body></html>
