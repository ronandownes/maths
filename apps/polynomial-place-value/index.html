<script>(()=>{'use strict';
const $ = id=>document.getElementById(id);

const mobileSettingsPanel=$('mobileSettingsPanel'),mobileSettingsToggle=$('mobileSettingsToggle');
const mobileSettingsBackdrop=$('mobileSettingsBackdrop'),mobileSettingsClose=$('mobileSettingsClose');
function setMobileSettings(open){
 mobileSettingsPanel.classList.toggle('mobile-open',open);
 mobileSettingsToggle.setAttribute('aria-expanded',String(open));
 mobileSettingsToggle.setAttribute('aria-label',open?'Close question settings':'Open question settings');
 mobileSettingsBackdrop.hidden=!open;
 if(open)mobileSettingsClose.focus();
 else mobileSettingsToggle.focus();
}
mobileSettingsToggle.addEventListener('click',()=>setMobileSettings(!mobileSettingsPanel.classList.contains('mobile-open')));
mobileSettingsClose.addEventListener('click',()=>setMobileSettings(false));
mobileSettingsBackdrop.addEventListener('click',()=>setMobileSettings(false));
document.addEventListener('keydown',event=>{
 if(event.key==='Escape'&&mobileSettingsPanel.classList.contains('mobile-open')){
  event.stopImmediatePropagation();event.preventDefault();setMobileSettings(false);
 }
},true);
window.matchMedia('(min-width: 761px)').addEventListener('change',event=>{
 if(event.matches&&mobileSettingsPanel.classList.contains('mobile-open'))setMobileSettings(false);
});

const actions=[
 'Set up powers-of-x columns',
 'Place coefficients in matching rows and columns',
 'Calculate partial products',
 'Combine like terms',
 'Append powers of x to each coefficient',
 'Box the answer with the correct signs',
 'Deepen your learning'
];
const instructions=[
 'Find the highest powers of the two factors and add them to find the top column.',
 'Keep the higher-degree factor on top. Match constants, x terms and other like powers in the same columns.',
 'Multiply the bottom coefficients by those above. Each partial product belongs in its matching power-of-x column.',
 'Add each column. The coefficient sequence runs from the highest power to the constant.',
 'Append the correct power of x to each non-zero coefficient, reading from left to right.',
 'Use descending powers of x, include every + and − sign, and box the final answer.',
 'Work independently, use spaced retrieval and explore a deeper connection if you want.'
];
const factorTypes=[['ll','Lin × Lin'],['ql','Lin × Quad'],['qq','Quad × Quad']];
const factorChoices=[['ll','Lin ×\nLin'],['ql','Lin ×\nQuad'],['qq','Quad ×\nQuad'],['any','Rand']];
const beyondChoices=[['l3','Linear × Cubic'],['l4','Linear × Quartic'],['l5','Linear × Quintic'],['q3','Quadratic × Cubic'],['q4','Quadratic × Quartic'],['44','Quartic × Quartic']];
const beyondTypes=beyondChoices.map(item=>item[0]);
const signTypes=[['positive','Positive'],['negative','Negative'],['mixed','Mixed'],['random','Signs']];
const signChoices=[['positive','All +'],['negative','Non-leading −'],['mixed','Mixed + / −'],['random','Random']];
const levels=[[1,'1'],[2,'2'],[3,'3']];
// A bank introduces ONE deliberate change at a time: internal signs, arithmetic, then degree.
// Selecting a bank applies its teaching defaults; the settings above remain teacher overrides.
const bankProfiles=[
 {type:'ll',level:1,sign:'positive',name:'Lin × Lin · sums · small coefficients'},
 {type:'ll',level:1,sign:'mixed',name:'Lin × Lin · sum × difference'},
 {type:'ll',level:1,sign:'negative',name:'Lin × Lin · two differences'},
 {type:'ll',level:2,sign:'mixed',name:'Lin × Lin · larger coefficients'},
 {type:'ql',level:2,sign:'mixed',name:'Lin × Quad · mixed signs'},
 {type:'qq',level:3,sign:'mixed',name:'Quad × Quad · double-digit prime challenge'}
];

const state={type:'ll',factorRandom:false,coreType:'ll',beyondOpen:false,constantOn:false,monic:false,sign:'positive',level:1,levelRandom:false,mode:'step',step:0,slot:0,freshCount:0,partialCount:0,partialAll:false,groupCount:0,groupAll:false,investigationOffset:0,helpStage:-1,showInvestigation:false,question:null,bankQuestion:0};

const pow=k=>k===0?'':k===1?'x':'x<sup>'+k+'</sup>';
const minus=v=>v<0?'−'+Math.abs(v):String(v);
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t}return a};
const primitive=a=>a.reduce((g,v)=>gcd(g,v),0)===1;
function poly(a){let result='',degree=a.length-1;
 for(let i=0;i<a.length;i++){const v=a[i],p=degree-i;if(v===0)continue;
  const body=(p&&Math.abs(v)===1?'':Math.abs(v))+pow(p);
  result+=(result?(v<0?' − ':' + '):(v<0?'−':''))+body;
 }return result||'0';
}
function product(a,b){const out=Array(a.length+b.length-1).fill(0);a.forEach((x,i)=>b.forEach((y,j)=>{out[i+j]+=x*y}));return out}
function seedFor(slot){const typeIndex=state.factorRandom?3:factorTypes.findIndex(x=>x[0]===state.type),signIndex=signTypes.findIndex(x=>x[0]===state.sign);
 return ((slot+1)*209759+(state.level+13)*17539+(typeIndex+1)*9151+(signIndex+2)*1877)>>>0}
function seeded(seed){let x=seed>>>0;return (min,max)=>{x^=x<<13;x^=x>>>17;x^=x<<5;x>>>=0;return min+(x%(max-min+1))}}
function chooseSign(next){return ['positive','negative','mixed'][next(0,2)]}
function makeQuestion(next,signOverride=null){
 const type=state.factorRandom?factorTypes[next(0,factorTypes.length-1)][0]:state.type;
 const [na,nb]=({ll:[2,2],ql:[3,2],qq:[3,3],cl:[2,1],l3:[4,2],l4:[5,2],l5:[6,2],q3:[4,3],q4:[5,3],'44':[5,5]})[type]||[3,2];
 const level=state.level,sign=signOverride||(state.sign==='random'?chooseSign(next):state.sign);
 const pick=values=>values[next(0,values.length-1)];
 const fav=()=>pick([1,2,2,2,3,3,3,5,5,4,7,8,9]);
 const easy=()=>pick([1,1,1,2,2,2,3,3,3,4,5,5,7]);
 const moderate=()=>pick([2,2,2,3,3,3,4,4,5,5,6,7,8,9]);
 const challenge=()=>pick(state.slot===5&&state.level===3?[11,13,17,19,23,29,31]:[10,11,11,11,20,21,30,31]);
 for(let trial=0;trial<3500;trial++){
  let a,b;
  if(level===1){
   a=Array.from({length:na},easy);
   b=Array.from({length:nb},easy);
   a[next(0,na-1)]=1;b[next(0,nb-1)]=1;
  }else if(level===2){
   a=Array.from({length:na},moderate);
   b=Array.from({length:nb},moderate);
  }else{
   a=Array.from({length:na},fav);
   b=Array.from({length:nb},fav);
   const target=next(0,1)===0?a:b;

const assessment={configureRequested:false,started:false,signScope:'only',typeScope:'only',mode:'practice',questions:[],responses:[],submitted:false,checked:[],choices:[],selected:[],firstAttempts:[],run:0,source:'bank',sound:true,quizType:'answer',workChoices:[],attempts:[],tried:[],quizIndex:0,quizVerified:[]};
function el(tag,textValue,className){
 const e=document.createElement(tag);if(textValue!==undefined)e.textContent=textValue;
 if(className)e.className=className;return e;
}
function playQuizSound(correct){
 MathsAssessment.playSound(correct,assessment.sound);

function testExpression(q){
 const factors=q.a.length>q.b.length?[q.b,q.a]:[q.a,q.b];
 return (q.scalar&&q.scalar!==1?minus(q.scalar)+'':'')+factors.map(f=>'('+poly(f)+')').join(' ');
}
function createChoices(q,index){
 const correct=product(q.a,q.b),length=correct.length;
 const rng=seeded(seedFor(index+assessment.run*31+53));
 const positions=[0,Math.floor(length/2),length-1];
 const variants=positions.map((position,k)=>{
  const answer=correct.slice(),magnitude=1+rng(0,2);
  answer[position]+= (k===1?-1:1)*magnitude;
  return answer;
 });
 const choices=[correct.slice(),...variants];
 for(let i=choices.length-1;i>0;i--){
  const j=rng(0,i);[choices[i],choices[j]]=[choices[j],choices[i]];
 }
 return choices;
}

function workRows(q){
 const a=q.a,b=q.b,n=a.length+b.length-1;
 const rows=[];
 for(let j=b.length-1;j>=0;j--){
  if(b[j]===0)continue;
  const shift=b.length-1-j,values=Array(n).fill(null);
  for(let i=0;i<a.length;i++)values[n-a.length+i-shift]=a[i]*b[j];
  rows.push(values);
 }
 return rows;
}
function createWorkChoices(q,index){
 const base=workRows(q),correct=product(q.a,q.b);
 const rng=seeded(seedFor(index+assessment.run*17+277));
 const variants=[{rows:base.map(r=>r.slice()),sum:correct.slice(),valid:true,error:'none',top:q.a.slice(),bottom:q.b.slice()}];
 // A transcription error: an incorrect coefficient is carried consistently
 // through the subsequent multiplication and addition.
 const incorrectTop=q.a.slice(),incorrectBottom=q.b.slice();
 const target=rng(0,1)===0?incorrectTop:incorrectBottom;
 const pos=rng(Math.max(0,target.length-2),target.length-1);
 target[pos]+=(target[pos]>=0?1:-1);
 const copied={a:incorrectTop,b:incorrectBottom};
 variants.push({rows:workRows(copied),sum:product(copied.a,copied.b),
  valid:false,error:'transcription',top:incorrectTop,bottom:incorrectBottom});
 // Multiplication error propagated into the final column total.
 const spots=[];
 base.forEach((row,i)=>row.forEach((v,j)=>{if(v!==null)spots.push([i,j])}));
 const preferred=spots.filter(([row,col])=>col>=Math.floor(correct.length/2));
 const [ri,ci]=(preferred.length?preferred:spots)[rng(0,(preferred.length?preferred:spots).length-1)];
 const badRows=base.map(row=>row.slice());
 const delta=rng(0,1)===0?-1:1;
 badRows[ri][ci]+=delta;
 const badSum=correct.slice();badSum[ci]+=delta;
 variants.push({rows:badRows,sum:badSum,valid:false,error:'multiplication',
  top:q.a.slice(),bottom:q.b.slice()});
 // Addition error: products correct but the column total incorrect.
 const col=rng(Math.floor(correct.length/2),correct.length-1),sum=correct.slice();
 sum[col]+=(rng(0,1)===0?-1:1);
 variants.push({rows:base.map(row=>row.slice()),sum,valid:false,error:'addition',
  top:q.a.slice(),bottom:q.b.slice()});
 for(let i=variants.length-1;i>0;i--){
  const j=rng(0,i);[variants[i],variants[j]]=[variants[j],variants[i]];
 }
 return variants;
}

function workingTable(q,work,showMistakes=false){
 const n=product(q.a,q.b).length,power=n-1,originalRows=workRows(q),baseRows=workRows({a:work.top,b:work.bottom});
 const actualTotals=Array(n).fill(0);
 work.rows.forEach(r=>r.forEach((v,j)=>{if(v!==null)actualTotals[j]+=v}));
 const display=(value,wrong)=>wrong&&showMistakes
   ?'<span class="work-error-cell"><span>'+minus(value)+'</span><span class="work-error-cross" aria-label="Incorrect value">✕</span></span>'
   :minus(value);
 const pad=v=>Array(n-v.length).fill(null).concat(v);
 const tr=(values,expected,kind='')=>'<tr class="'+kind+'"><td></td>'+values.map((v,j)=>
   '<td>'+(v===null?'':display(v,expected&&v!==expected[j]))+'</td>').join('')+'</tr>';
 const head='<tr><th>'+(showMistakes&&work.valid?'<span class="work-correct-tick" aria-label="All working correct">✓</span>':'')+'</th>'+Array.from({length:n},(_,i)=>'<th>'+(power-i?pow(power-i):'#')+'</th>').join('')+'</tr>';
 const totals='<tr class="work-total"><td>+</td>'+work.sum.map((v,j)=>'<td>'+
   (showMistakes&&v!==actualTotals[j]
    ?'<span class="work-error-cell"><span>'+minus(v)+(v!==0&&power-j?pow(power-j):'')+'</span><span class="work-error-cross" aria-label="Incorrect total">✕</span></span>'
    :minus(v)+(v!==0&&power-j?pow(power-j):''))+'</td>').join('')+'</tr>';
 return '<table class="quiz-work-table">'+head+tr(pad(work.top),pad(q.a))+
   tr(pad(work.bottom),pad(q.b),'factor-divider')+
   work.rows.map((row,i)=>tr(row,baseRows[i]||originalRows[i])).join('')+totals+'</table>';
}

function assessmentTypes(){

function assessmentSigns(){

// Both factors share a single place-value grid, with the higher-degree factor on top.
function boardStackRow(coefficients,row,highestDegree){
 let earlier=false,html='';
 coefficients.forEach((v,i)=>{
  if(v===0)return;
  const p=coefficients.length-1-i,abs=Math.abs(v);
  const sign=v<0?(earlier?'− ':'−'):(earlier?'+ ':'');
  const body=(p&&abs===1?'':abs)+pow(p);
  html+='<span class="board-stack-term" style="grid-row:'+row+';grid-column:'+(highestDegree-p+1)+'">'+sign+body+'</span>';
  earlier=true;
 });
 return html||'<span class="board-stack-term" style="grid-row:'+row+';grid-column:'+(highestDegree+1)+'">0</span>';
}
function boardFormula(q){
 const top=q.a.length>=q.b.length?q.a:q.b;
 const bottom=q.a.length>=q.b.length?q.b:q.a;
 const scalar=q.scalar&&q.scalar!==1?'<span class="board-stack-scalar">'+minus(q.scalar)+' ×</span>':'';
 return '<span class="board-stack-layout">'+scalar+
  '<span class="board-stack" style="--place-columns:'+top.length+'">'+
  boardStackRow(top,1,top.length-1)+boardStackRow(bottom,2,top.length-1)+
  '<span class="board-stack-rule" aria-hidden="true"></span></span></span>';
}
function boardAnswerHTML(q){
 const coefficients=product(q.a,q.b).map(v=>v*(q.scalar||1)),terms=[],degree=coefficients.length-1;
 coefficients.forEach((v,i)=>{
  if(!v)return;
  const p=degree-i,sign=terms.length?(v<0?'−':'+'):(v<0?'−':'');
  const term=(p&&Math.abs(v)===1?'':Math.abs(v))+pow(p);
  terms.push('<span class="board-answer-term">'+(sign?'<span class="board-answer-sign">'+sign+'</span>':'')+term+'</span>');
 });
 const first=terms.shift()||'<span class="board-answer-term">0</span>';
 return '<span class="board-answer-first"><span class="board-answer-equals">=</span>'+first+'</span>'+terms.join('');
}
function boardQuestions(count){

 return Array.from({length:count},(_,i)=>{
  if(i===0&&boardState.offset===0&&state.question)return {q:state.question,type:state.question.type};
  const seed=seedFor(900000+boardState.offset*13007+i*991+(Number.isInteger(state.slot)?state.slot*113+state.bankQuestion*379:state.freshCount*123));

function fitBoardQuestions(){
 const host=$('boardPanel');if(host.hidden)return;
 const grid=host.querySelector('.board-grid');if(!grid)return;
 grid.querySelectorAll('.board-question').forEach(cell=>{
  const expr=cell.querySelector('.board-expression'),answer=cell.querySelector('.board-answer');
  const line=cell.querySelector('.board-math-line');
  const width=Math.max(35,cell.clientWidth-20),height=Math.max(35,cell.clientHeight-22);
  const inline=Boolean(answer&&cell.classList.contains('board-question--single'));
  cell.classList.remove('board-inline-wrap');
  // Answer uses the same font size as the question, whether inline or stacked.
  let font=Math.min(230,Math.floor(height*(inline?.45:answer?.33:.70)));
  function sizeMath(){
   expr.style.fontSize=font+'px';
   if(answer)answer.style.fontSize=font+'px';
  }
  function tooLarge(){
   if(inline)return line.scrollWidth>width+2||line.scrollHeight>height;
   return expr.scrollWidth>width+2||
    expr.scrollHeight+(answer?answer.scrollHeight+7:0)>height||
    (answer&&answer.scrollWidth>width+2);
  }
  sizeMath();
  while(font>(inline?20:8)&&tooLarge()){font-=2;sizeMath()}
  // Extremely long challenge answers can still wrap, but never shrink to illegibility.
  if(inline&&tooLarge()){
   cell.classList.add('board-inline-wrap');
   while(font>14&&tooLarge()){font-=2;sizeMath()}
  }
 });
}

function worksheetQuestions(countOverride){
 const old={type:state.type,level:state.level,sign:state.sign,slot:state.slot,random:state.factorRandom,constant:state.constantOn,monic:state.monic};
 const out=[],count=countOverride||worksheetTotal(),selected=state.type;

 const levelBase=Math.max(1,Math.min(3,state.level));

 try{
  state.slot='fresh';state.factorRandom=false;
  for(let i=0;i<count;i++){
   const progress=count<=1?0:i/(count-1);
   const type=types[Math.min(types.length-1,Math.floor(progress*types.length))],sign=signFor(i);
   const level=ws.sheet===1?Math.min(levelBase,2):ws.sheet===2?levelBase:Math.max(levelBase,2);
   state.type=type;state.sign=sign;state.level=level;
   state.monic=(ws.sheet===1&&i%4===0)||(ws.sheet===2&&i%6===0);
   const seed=seedFor(50000+ws.sheet*1103+i*97+(ws.use==='homework'?10007:0));
   const q=makeQuestion(seeded(seed),sign);
   if(!state.constantOn&&ws.sheet>=3&&progress>.6&&i%4===1){
    const arr=i%2?q.a:q.b;
    arr[arr.length-1]=(arr[arr.length-1]<0?-1:1)*[21,31,41][i%3];
   }
   if(ws.sheet===4&&progress>.75&&ws.category==='progressive'){
    const review=['positive','negative','mixed'][i%3];
    if(review==='positive'){q.a=q.a.map(Math.abs);q.b=q.b.map(Math.abs)}
    else if(review==='negative'){q.a=q.a.map((v,j)=>j?-Math.abs(v):Math.abs(v));q.b=q.b.map((v,j)=>j?-Math.abs(v):Math.abs(v))}

   }
   out.push({q,type,level,number:i+1,stage:ws.category});

 const dots=el('div',undefined,'instruction-dots');
 instructionSlides.forEach((frame,i)=>{
  const dot=el('button','');dot.type='button';dot.setAttribute('aria-label','Slide '+(i+1)+': '+frame.heading);
  if(i===instructionSlide)dot.setAttribute('aria-current','step');
  dot.onclick=()=>{instructionSlide=i;drawInstruction()};dots.append(dot);
 });
 const next=el('button',instructionSlide===instructionSlides.length-1?'Restart lesson':'Next →');next.type='button';
 next.onclick=()=>{instructionSlide=(instructionSlide+1)%instructionSlides.length;if(instructionSlide===0){instructionAnswerVisible=false;instructionInsightVisible=false;instructionCarryVisible=false}drawInstruction()};
 footer.append(prev,count,dots,next);
 host.append(toolbar,stage,footer);
}
document.addEventListener('keydown',event=>{
 if(assessment.mode!=='instruction'||event.target.matches('input,textarea,select'))return;
 if(event.key==='ArrowRight'||event.key==='PageDown'||event.key===' '){
  event.preventDefault();instructionSlide=Math.min(instructionSlides.length-1,instructionSlide+1);drawInstruction();
 }else if(event.key==='ArrowLeft'||event.key==='PageUp'){
  event.preventDefault();instructionSlide=Math.max(0,instructionSlide-1);drawInstruction();
 }else if(event.key==='Home'){event.preventDefault();instructionSlide=0;instructionAnswerVisible=false;instructionInsightVisible=false;instructionCarryVisible=false;drawInstruction()}
 else if(event.key==='End'){event.preventDefault();instructionSlide=instructionSlides.length-1;drawInstruction()}
 else if(event.key==='Escape'&&!document.fullscreenElement){event.preventDefault();switchMode('practice')}
});
function switchMode(mode){
 const previous=assessment.mode;
 if(assessment.started&&mode!==assessment.mode){assessment.started=false;assessment.questions=[];assessment.configureRequested=false;setAssessmentControlsLocked()}
 assessment.mode=mode;
 $('practiceArea').hidden=mode!=='practice';
 $('testArea').hidden=mode!=='quiz'&&mode!=='test';
 $('worksheetPanel').hidden=mode!=='worksheet';
 $('instructionPanel').hidden=mode!=='instruction';
 $('boardPanel').hidden=mode!=='board';
 if(previous==='instruction'&&mode!=='instruction'&&document.fullscreenElement===$('instructionPanel'))document.exitFullscreen?.().catch(()=>{});
 $('practiceQuickControls').hidden=false;
 for(const [key,value] of [['practiceMode','practice'],['instructionMode','instruction'],['quizMode','quiz'],['testMode','test'],['worksheetMode','worksheet'],['boardMode','board']]){
  $(key).setAttribute('aria-pressed',String(key==='practiceMode'?mode==='practice'&&state.slot==='fresh':mode===value));
 }
 if(mode==='worksheet')worksheetOptions();
 else if(mode==='instruction'){if(mode!==previous){instructionSlide=0;instructionAnswerVisible=false;instructionInsightVisible=false;instructionCarryVisible=false}drawInstruction()}
 else if(mode==='board')drawBoard();
 else if((mode==='quiz'||mode==='test')&&mode!==previous){
  assessment.configureRequested=false;initialiseTest('random');
 }
}
$('practiceMode').onclick=()=>{switchMode('practice');freshQuestion()};
$('instructionMode').onclick=()=>switchMode('instruction');
$('quizMode').onclick=()=>switchMode('quiz');
$('testMode').onclick=()=>switchMode('test');
$('boardMode').onclick=()=>switchMode('board');
function connectTableOperands(){
 const host=$('canvas');
 const previous=host.querySelector&&host.querySelector('.table-operand-connector');
 if(previous)previous.remove();
 if(state.mode!=='step'||state.step!==3||!state.partialCount||state.partialAll||
    !host.querySelector||!host.getBoundingClientRect)return;
 const first=host.querySelector('.table-operand-first');
 const second=host.querySelector('.table-operand-second');
 if(!first||!second||!first.getBoundingClientRect||!second.getBoundingClientRect)return;
 const base=host.getBoundingClientRect(),a=first.getBoundingClientRect(),b=second.getBoundingClientRect();
 const x1=a.left+a.width/2-base.left,y1=a.bottom-base.top-6;
 const x2=b.left+b.width/2-base.left,y2=b.top-base.top+6;
 const length=Math.hypot(x2-x1,y2-y1);
 if(length<1)return;
 const line=document.createElement('div');line.className='table-operand-connector';
 line.style.left=x1+'px';line.style.top=y1+'px';line.style.width=length+'px';
 line.style.transform='rotate('+Math.atan2(y2-y1,x2-x1)+'rad)';
 host.append(line);
}
function render(){renderSelectors();coefficientInputs();draw();connectTableOperands();if(assessment.mode==='board')drawBoard();else if(assessment.mode==='worksheet')wsStatus()}
window.addEventListener('resize',connectTableOperands);
selectQuestion(0);
})();</script>
