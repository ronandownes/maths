<main>

<div class="beyond-choices" id="beyondPanel" hidden><strong>Optional challenge</strong><div class="button-group" id="beyondChoices"></div><span id="beyondNote">Choose a factor pattern to explore.</span></div>
</div>

<script>(()=>{'use strict';
const $ = id=>document.getElementById(id);
const actions=['Set up the place-value columns','Place the coefficients','Calculate partial products','Combine terms by powers of x','Interpret and populate the powers of x','Box the answer','Reflect'];
const instructions=[
 'Set up the place-value columns with powers of x',
 'Place the coefficients in the correct columns, with the higher-degree factor on top',
 'Calculate the partial products',
 'Combine contributions in each power-of-x column (add coefficients where there are two or more)',
 'Interpret and populate the powers of x',
 'Box the final answer',
 'Reflect on the efficiency of the method'
];
const factorTypes=[['ll','Lin × Lin'],['ql','Lin × Quad'],['qq','Quad × Quad']];
const factorChoices=[['ll','Lin ×\nLin'],['ql','Lin ×\nQuad'],['qq','Quad ×\nQuad'],['any','Rand']];
const beyondChoices=[['l5','Linear × Quintic'],['q4','Quadratic × Quartic'],['44','Quartic × Quartic']];
const beyondTypes=beyondChoices.map(item=>item[0]);
const signTypes=[['positive','Positive'],['negative','Negative'],['mixed','Mixed'],['random','Signs']];
const signChoices=[['positive','Both\npositive'],['negative','Negative\nnon-leading'],['mixed','Mixed\nsigns'],['random','Random\nsigns']];
const levels=[[1,'1'],[2,'2'],[3,'3']];

const state={type:'ql',factorRandom:false,coreType:'ql',beyondOpen:false,constantOn:false,monic:false,sign:'positive',level:2,levelRandom:false,mode:'step',step:0,slot:0,freshCount:0,partialCount:0,partialAll:false,groupCount:0,groupAll:false,investigationOffset:0,reflectionUsed:0,reflectionNeed:0,question:null};

const pow=k=>k===0?'':k===1?'x':'x<sup>'+k+'</sup>';
const minus=v=>v<0?'−'+Math.abs(v):String(v);
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t}return a};
const primitive=a=>a.reduce((g,v)=>gcd(g,v),0)===1;
function poly(a){let result='',degree=a.length-1;
 for(let i=0;i<a.length;i++){const v=a[i],p=degree-i;if(v===0)continue;
  const body=(p&&Math.abs(v)===1?'':Math.abs(v))+pow(p);
  result+=(result?(v<0?' − ':' + '):(v<0?'−':''))+body;
 }return result||'0';
}
function product(a,b){const out=Array(a.length+b.length-1).fill(0);a.forEach((x,i)=>b.forEach((y,j)=>{out[i+j]+=x*y}));return out}
function seedFor(slot){const typeIndex=state.factorRandom?3:factorTypes.findIndex(x=>x[0]===state.type),signIndex=signTypes.findIndex(x=>x[0]===state.sign);
 return ((slot+1)*209759+(state.level+13)*17539+(typeIndex+1)*9151+(signIndex+2)*1877)>>>0}
function seeded(seed){let x=seed>>>0;return (min,max)=>{x^=x<<13;x^=x>>>17;x^=x<<5;x>>>=0;return min+(x%(max-min+1))}}
function chooseSign(next){return ['positive','negative','mixed'][next(0,2)]}
function makeQuestion(next,signOverride=null){
 const type=state.factorRandom?factorTypes[next(0,factorTypes.length-1)][0]:state.type;
 const [na,nb]=({ll:[2,2],ql:[3,2],qq:[3,3],cl:[2,1],l5:[6,2],q4:[5,3],'44':[5,5]})[type]||[3,2];
 const level=state.level,sign=signOverride||(state.sign==='random'?chooseSign(next):state.sign);
 const pick=values=>values[next(0,values.length-1)];
 const fav=()=>pick([1,2,2,2,3,3,3,5,5,4,7,8,9]);
 const easy=()=>pick([1,1,1,2,2,2,3,3,3,4,5,5,7]);
 const moderate=()=>pick([2,2,2,3,3,3,4,4,5,5,6,7,8,9]);
 const challenge=()=>pick([10,11,11,11,20,21,30,31]);
 for(let trial=0;trial<3500;trial++){
  let a,b;
  if(level===1){
   a=Array.from({length:na},easy);
   b=Array.from({length:nb},easy);
   a[next(0,na-1)]=1;b[next(0,nb-1)]=1;
  }else if(level===2){
   a=Array.from({length:na},moderate);
   b=Array.from({length:nb},moderate);
  }else{
   a=Array.from({length:na},fav);
   b=Array.from({length:nb},fav);
   const target=next(0,1)===0?a:b;
   target[next(0,target.length-1)]=challenge();
  }
  if(state.monic&&state.slot==='fresh'){a[0]=1;if(type!=='cl')b[0]=1;}
  for(const arr of [a,b])for(let i=1;i<arr.length;i++){
   if(sign==='negative'||(sign==='mixed'&&next(0,1)===1))arr[i]=-Math.abs(arr[i]);
  }
  if(sign==='mixed'){
   const all=a.slice(1).concat(b.slice(1));
   if(all.every(v=>v>0))b[b.length-1]=-Math.abs(b[b.length-1]);
   if(all.every(v=>v<0))a[a.length-1]=Math.abs(a[a.length-1]);
  }
  if(!primitive(a)||(type!=='cl'&&!primitive(b)))continue;
  if(type==='cl'&&Math.abs(b[0])===1)continue;
  if(!beyondTypes.includes(type)&&level===2&&product(a,b).some(v=>Math.abs(v)>100))continue;
  if(!beyondTypes.includes(type)&&level===1&&product(a,b).some(v=>Math.abs(v)>60))continue;

function playQuizSound(correct){
 if(!assessment.sound)return;
 try{
  const AudioCtor=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtor)return;
  const ctx=new AudioCtor();
  const now=ctx.currentTime;
  const notes=correct===true?[[660,0,.16],[880,.18,.25]]:correct==='fanfare'?[[523,0,.16],[659,.18,.16],[784,.36,.18],[1047,.56,.48]]:correct==='final-wrong'?[[410,0,.20],[300,.25,.22],[195,.53,.42]]:[[350,0,.23],[245,.29,.31]];
  notes.forEach(([frequency,offset,duration])=>{
   const osc=ctx.createOscillator(),gain=ctx.createGain();
   osc.type=correct==='final-wrong'?'sawtooth':correct===false?'triangle':'sine';osc.frequency.value=frequency;
   gain.gain.setValueAtTime(0,now+offset);
   gain.gain.linearRampToValueAtTime(correct==='final-wrong'?.17:correct===false?.085:.13,now+offset+.02);
   gain.gain.exponentialRampToValueAtTime(.001,now+offset+duration);
   osc.connect(gain);gain.connect(ctx.destination);
   osc.start(now+offset);osc.stop(now+offset+duration+.01);
  });
  if(ctx.close) setTimeout(()=>{Promise.resolve(ctx.close()).catch(()=>{})},1700);
 }catch(_err){/* Sound is optional; marking always works without audio. */}
}
function testExpression(q){
 const factors=['ql','cl','l5','q4'].includes(q.type)?[q.b,q.a]:[q.a,q.b];
 return (q.scalar&&q.scalar!==1?minus(q.scalar)+'':'')+factors.map(f=>'('+poly(f)+')').join(' ');
}
function createChoices(q,index){
 const correct=product(q.a,q.b),length=correct.length;
 const rng=seeded(seedFor(index+assessment.run*31+53));
 const positions=[0,Math.floor(length/2),length-1];
 const variants=positions.map((position,k)=>{
  const answer=correct.slice(),magnitude=1+rng(0,2);
  answer[position]+= (k===1?-1:1)*magnitude;
  return answer;
 });
 const choices=[correct.slice(),...variants];
 for(let i=choices.length-1;i>0;i--){
  const j=rng(0,i);[choices[i],choices[j]]=[choices[j],choices[i]];
 }
 return choices;
}

function workRows(q){
 const a=q.a,b=q.b,n=a.length+b.length-1;
 const rows=[];
 for(let j=b.length-1;j>=0;j--){
  if(b[j]===0)continue;
  const shift=b.length-1-j,values=Array(n).fill(null);
  for(let i=0;i<a.length;i++)values[n-a.length+i-shift]=a[i]*b[j];
  rows.push(values);
 }
 return rows;
}
function createWorkChoices(q,index){
 const base=workRows(q),correct=product(q.a,q.b);
 const rng=seeded(seedFor(index+assessment.run*17+277));
 const variants=[{rows:base.map(r=>r.slice()),sum:correct.slice(),valid:true,error:'none',top:q.a.slice(),bottom:q.b.slice()}];
 // A transcription error: an incorrect coefficient is carried consistently
 // through the subsequent multiplication and addition.
 const incorrectTop=q.a.slice(),incorrectBottom=q.b.slice();
 const target=rng(0,1)===0?incorrectTop:incorrectBottom;
 const pos=rng(Math.max(0,target.length-2),target.length-1);
 target[pos]+=(target[pos]>=0?1:-1);
 const copied={a:incorrectTop,b:incorrectBottom};
 variants.push({rows:workRows(copied),sum:product(copied.a,copied.b),
  valid:false,error:'transcription',top:incorrectTop,bottom:incorrectBottom});
 // Multiplication error propagated into the final column total.
 const spots=[];
 base.forEach((row,i)=>row.forEach((v,j)=>{if(v!==null)spots.push([i,j])}));
 const preferred=spots.filter(([row,col])=>col>=Math.floor(correct.length/2));
 const [ri,ci]=(preferred.length?preferred:spots)[rng(0,(preferred.length?preferred:spots).length-1)];
 const badRows=base.map(row=>row.slice());
 const delta=rng(0,1)===0?-1:1;
 badRows[ri][ci]+=delta;
 const badSum=correct.slice();badSum[ci]+=delta;
 variants.push({rows:badRows,sum:badSum,valid:false,error:'multiplication',
  top:q.a.slice(),bottom:q.b.slice()});
 // Addition error: products correct but the column total incorrect.
 const col=rng(Math.floor(correct.length/2),correct.length-1),sum=correct.slice();
 sum[col]+=(rng(0,1)===0?-1:1);
 variants.push({rows:base.map(row=>row.slice()),sum,valid:false,error:'addition',
  top:q.a.slice(),bottom:q.b.slice()});
 for(let i=variants.length-1;i>0;i--){
  const j=rng(0,i);[variants[i],variants[j]]=[variants[j],variants[i]];
 }
 return variants;
}

function workingTable(q,work,showMistakes=false){
 const n=product(q.a,q.b).length,power=n-1,originalRows=workRows(q),baseRows=workRows({a:work.top,b:work.bottom});
 const actualTotals=Array(n).fill(0);
 work.rows.forEach(r=>r.forEach((v,j)=>{if(v!==null)actualTotals[j]+=v}));
 const display=(value,wrong)=>wrong&&showMistakes
   ?'<span class="work-error-cell"><span>'+minus(value)+'</span><span class="work-error-cross" aria-label="Incorrect value">✕</span></span>'
   :minus(value);
 const pad=v=>Array(n-v.length).fill(null).concat(v);
 const tr=(values,expected,kind='')=>'<tr class="'+kind+'"><td></td>'+values.map((v,j)=>
   '<td>'+(v===null?'':display(v,expected&&v!==expected[j]))+'</td>').join('')+'</tr>';
 const head='<tr><th>'+(showMistakes&&work.valid?'<span class="work-correct-tick" aria-label="All working correct">✓</span>':'')+'</th>'+Array.from({length:n},(_,i)=>'<th>'+(power-i?pow(power-i):'#')+'</th>').join('')+'</tr>';
 const totals='<tr class="work-total"><td>+</td>'+work.sum.map((v,j)=>'<td>'+
   (showMistakes&&v!==actualTotals[j]
    ?'<span class="work-error-cell"><span>'+minus(v)+(v!==0&&power-j?pow(power-j):'')+'</span><span class="work-error-cross" aria-label="Incorrect total">✕</span></span>'
    :minus(v)+(v!==0&&power-j?pow(power-j):''))+'</td>').join('')+'</tr>';
 return '<table class="quiz-work-table">'+head+tr(pad(work.top),pad(q.a))+
   tr(pad(work.bottom),pad(q.b),'factor-divider')+
   work.rows.map((row,i)=>tr(row,baseRows[i]||originalRows[i])).join('')+totals+'</table>';
}

    values.map(v=>'<td>'+(v===null?'':minus(v))+'</td>').join('')+'</tr>';
  }
  const rows=tableRow(pad(q.a),'factor-top')+tableRow(pad(q.b),'factor-bottom')+
   workRows(q).map(values=>tableRow(values,'partial-row')).join('')+
   tableRow(product(q.a,q.b),'sum-row','+');
  return '<article class="problem worked"'+style+'>'+label+'<div class="formula">'+formula+'</div>'+
   '<table class="worked-table"><thead><tr><th></th>'+headers+'</tr></thead><tbody>'+rows+'</tbody></table>'+
   '<div class="worked-answer">= '+poly(product(q.a,q.b))+'</div></article>';
 }
 for(let i=0;i<all.length;i+=perPage){
  const chunk=all.slice(i,i+perPage).map((x,k)=>problem(x,i+k)).join('');
  pages.push('<section class="sheet"><header><strong>'+worksheetTitle()+'</strong>'+
   '<span>Name: _______________________</span></header>'+
   (ws.steps&&i===0?'<div class="page-method">Align coefficients · Multiply · Add like terms</div>':'')+
   '<div class="questions">'+chunk+
   '</div><footer>'+(i+1)+'–'+Math.min(i+perPage,all.length)+' / '+all.length+'</footer></section>');
 }
 const key=ws.answers==='key'?all.map((item,i)=>{const q=item.q,fs=q.type==='ql'?[q.b,q.a]:[q.a,q.b];
  return '<div class="solution"><strong>'+(i+1)+'. '+names[item.type]+' · L'+item.level+'</strong>'+
   '<div>('+poly(fs[0])+')('+poly(fs[1])+')</div><b>= '+poly(product(q.a,q.b))+'</b></div>';
 }).join(''):'';
 const html='<!doctype html><html lang="en-IE"><head><meta charset="utf-8"><title>Polynomial worksheet</title><style>'+
 '@page{size:A4 '+ws.orientation+';margin:10mm}*{box-sizing:border-box}body{margin:0;background:#f1f3f6;color:#26364a;font-family:Arial,sans-serif}'+

 '.questions{display:grid;grid-template-columns:repeat('+columns+',minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:6mm;justify-content:center;margin:11mm auto 0;min-height:158mm}'+
 '.problem{min-width:0;padding:3mm 2mm;break-inside:avoid;min-height:70mm}'+
 '.meta{font-size:11px;font-weight:650;color:#455770;min-height:9mm}.formula{font:var(--question-size,21pt)/1.3 Cambria,"Cambria Math",Georgia,serif;text-align:center;overflow-wrap:anywhere}'+
 '.problem.independent .formula{margin-top:4mm}.gentle-hint{margin-top:5mm;font-size:10px;color:#808b98;text-align:center}'+
 '.vertical-question{width:fit-content;max-width:100%;margin:3mm auto 0;text-align:right;font:var(--question-size,22pt)/1.5 Cambria,"Cambria Math",Georgia,serif;font-variant-numeric:tabular-nums}'+
 '.vertical-factor{position:relative;white-space:nowrap;padding:0 5mm 0 9mm}'+

 '.worked-table{width:100%;table-layout:fixed;border-collapse:collapse;text-align:center;font:clamp(14px,1.4vw,20px)/1.3 Cambria,"Cambria Math",Georgia,serif}'+

  'footer{text-align:right;font-size:10px;color:#6a7686;margin-top:12px}.key{display:block;background:white;max-width:'+(ws.orientation==='portrait'?'210mm':'297mm')+';margin:12px auto;padding:12mm;break-before:page}'+
 '.key h2{font-size:17px}.answer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.solution{break-inside:avoid;border-bottom:1px solid #ddd;padding:10px 0}.solution div,.solution b{display:block;font:15px Cambria,Georgia,serif;margin-top:7px}'+

 pages.join('')+(ws.answers==='key'?'<section class="key"><h2>Answers · '+all.length+' questions</h2><div class="answer-grid">'+key+'</div></section>':'')+'</body></html>';

$('worksheetMode').onclick=()=>switchMode('worksheet');
function switchMode(mode){
 if(assessment.started&&mode!==assessment.mode)return;
 const previous=assessment.mode;
 assessment.mode=mode;
 $('practiceArea').hidden=mode!=='practice';
 $('testArea').hidden=mode!=='quiz'&&mode!=='test';
 $('worksheetPanel').hidden=mode!=='worksheet';
 $('boardPanel').hidden=mode!=='board';
 $('practiceQuickControls').hidden=mode!=='practice';
 for(const [key,value] of [['practiceMode','practice'],['quizMode','quiz'],['testMode','test'],['worksheetMode','worksheet'],['boardMode','board']]){
  $(key).setAttribute('aria-pressed',String(key==='practiceMode'?mode==='practice'&&state.slot==='fresh':mode===value));
 }
 if(mode==='worksheet')worksheetOptions();
 else if(mode==='board')drawBoard();
 else if((mode==='quiz'||mode==='test')&&mode!==previous){
  assessment.started=false;assessment.questions=[];setAssessmentControlsLocked();drawTest();
 }
}
$('practiceMode').onclick=()=>{switchMode('practice');freshQuestion()};
$('quizMode').onclick=()=>switchMode('quiz');
$('testMode').onclick=()=>switchMode('test');
$('boardMode').onclick=()=>switchMode('board');
function connectTableOperands(){
 const host=$('canvas');
 const previous=host.querySelector&&host.querySelector('.table-operand-connector');
 if(previous)previous.remove();
 if(state.mode!=='step'||state.step!==3||!state.partialCount||state.partialAll||
    !host.querySelector||!host.getBoundingClientRect)return;
 const first=host.querySelector('.table-operand-first');
 const second=host.querySelector('.table-operand-second');
 if(!first||!second||!first.getBoundingClientRect||!second.getBoundingClientRect)return;
 const base=host.getBoundingClientRect(),a=first.getBoundingClientRect(),b=second.getBoundingClientRect();
 const x1=a.left+a.width/2-base.left,y1=a.bottom-base.top-6;
 const x2=b.left+b.width/2-base.left,y2=b.top-base.top+6;
 const length=Math.hypot(x2-x1,y2-y1);
 if(length<1)return;
 const line=document.createElement('div');line.className='table-operand-connector';
 line.style.left=x1+'px';line.style.top=y1+'px';line.style.width=length+'px';
 line.style.transform='rotate('+Math.atan2(y2-y1,x2-x1)+'rad)';
 host.append(line);
}
function render(){renderSelectors();coefficientInputs();draw();connectTableOperands()}
window.addEventListener('resize',connectTableOperands);
selectQuestion(0);
})();</script>
