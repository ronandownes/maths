<main>
<div class="settings settings-top common-settings">

 <div class="practice-working">

<script>(()=>{'use strict';
const $ = id=>document.getElementById(id);
const actions=['Set up the place-value columns','Place the coefficients','Calculate partial products','Group like terms','Interpret and populate the powers of x','Box the answer','Reflect'];
const instructions=[
 'Set up the place-value columns with powers of x',
 'Place the coefficients in the correct columns, with the higher-degree factor on top',
 'Calculate the partial products',
 'Group like terms by adding the coefficients in each column',
 'Interpret and populate the powers of x',
 'Box the final answer',
 'Reflect on the efficiency of the method'
];
const factorTypes=[['ll','Lin × Lin'],['ql','Lin × Quad'],['qq','Quad × Quad']];
const factorChoices=[['ll','Lin ×\nLin'],['ql','Lin ×\nQuad'],['qq','Quad ×\nQuad'],['any','Rand']];
const signTypes=[['positive','Positive'],['negative','Negative'],['mixed','Mixed'],['random','Signs']];
const signChoices=[['positive','Both\npositive'],['negative','Both\nnegative'],['mixed','Mixed\nsigns'],['random','Random\nsigns']];
const levels=[[1,'1'],[2,'2'],[3,'3']];

const state={type:'ql',factorRandom:false,sign:'positive',level:1,levelRandom:false,mode:'worked',step:0,slot:0,freshCount:0,partialCount:0,partialAll:false,question:null};

const pow=k=>k===0?'':k===1?'x':'x<sup>'+k+'</sup>';
const minus=v=>v<0?'−'+Math.abs(v):String(v);
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t}return a};
const primitive=a=>a.reduce((g,v)=>gcd(g,v),0)===1;
function poly(a){let result='',degree=a.length-1;
 for(let i=0;i<a.length;i++){const v=a[i],p=degree-i;if(v===0)continue;
  const body=(p&&Math.abs(v)===1?'':Math.abs(v))+pow(p);
  result+=(result?(v<0?' − ':' + '):(v<0?'−':''))+body;
 }return result||'0';
}
function product(a,b){const out=Array(a.length+b.length-1).fill(0);a.forEach((x,i)=>b.forEach((y,j)=>{out[i+j]+=x*y}));return out}
function seedFor(slot){const typeIndex=state.factorRandom?3:factorTypes.findIndex(x=>x[0]===state.type),signIndex=signTypes.findIndex(x=>x[0]===state.sign);
 return ((slot+1)*209759+(state.level+13)*17539+(typeIndex+1)*9151+(signIndex+2)*1877)>>>0}
function seeded(seed){let x=seed>>>0;return (min,max)=>{x^=x<<13;x^=x>>>17;x^=x<<5;x>>>=0;return min+(x%(max-min+1))}}
function chooseSign(next){return ['positive','negative','mixed'][next(0,2)]}
function makeQuestion(next){
 const type=state.factorRandom?factorTypes[next(0,factorTypes.length-1)][0]:state.type;
 const [na,nb]=type==='ll'?[2,2]:type==='ql'?[3,2]:[3,3];
 const level=state.level,sign=state.sign==='random'?chooseSign(next):state.sign;
 const pick=values=>values[next(0,values.length-1)];
 const fav=()=>pick([1,2,2,2,3,3,3,5,5,4,7,8,9]);
 const easy=()=>pick([1,1,1,2,2,2,3,3,3,4,5,5,7]);
 const moderate=()=>pick([1,2,2,3,3,3,4,4,5,5,7,8,9]);
 const challenge=()=>pick([10,11,11,11,20,21,30,31]);
 for(let trial=0;trial<3500;trial++){
  let a,b;
  if(level===1){
   a=Array.from({length:na},easy);
   b=Array.from({length:nb},easy);
   a[next(0,na-1)]=1;b[next(0,nb-1)]=1;
  }else if(level===2){
   a=Array.from({length:na},moderate);
   b=Array.from({length:nb},moderate);
   if(next(0,5)===0){const target=next(0,1)===0?a:b;target[next(0,target.length-1)]=11;}
  }else{
   a=Array.from({length:na},fav);
   b=Array.from({length:nb},fav);
   const target=next(0,1)===0?a:b;
   target[next(0,target.length-1)]=challenge();
  }
  for(const arr of [a,b])for(let i=1;i<arr.length;i++){
   if(sign==='negative'||(sign==='mixed'&&next(0,1)===1))arr[i]=-Math.abs(arr[i]);
  }
  if(sign==='mixed'){
   const all=a.slice(1).concat(b.slice(1));
   if(all.every(v=>v>0))b[b.length-1]=-Math.abs(b[b.length-1]);
   if(all.every(v=>v<0))a[a.length-1]=Math.abs(a[a.length-1]);
  }
  if(!primitive(a)||!primitive(b))continue;
  if(level===2&&product(a,b).some(v=>Math.abs(v)>100))continue;
  if(level===1&&product(a,b).some(v=>Math.abs(v)>60))continue;
  return {a,b,type,sign};
 }
 return {a:[1,...Array(na-1).fill(sign==='negative'?-2:2)],b:[1,...Array(nb-1).fill(sign==='positive'?3:-3)],type,sign};
}
function chosenQuestion(){
 const rng=state.slot==='fresh'
  ?seeded(seedFor(state.freshCount+1000)^((Math.random()*0xffffffff)>>>0))
  :seeded(seedFor(state.slot));
 return makeQuestion(rng);
}
function selectQuestion(slot){
 state.slot=slot;state.question=chosenQuestion();state.partialCount=0;state.partialAll=false;render();
}
function freshQuestion(){
 const previous=state.question;
 for(let attempt=0;attempt<16;attempt++){
  state.freshCount++;const next=(()=>{state.slot='fresh';return chosenQuestion()})();
  if(!previous||JSON.stringify(next)!==JSON.stringify(previous)){state.question=next;state.partialCount=0;state.partialAll=false;render();return}
 }
 state.question=chosenQuestion();state.partialCount=0;render();
}

function chooseButtons(id,entries,current,change){
 const host=$(id);host.replaceChildren();
 entries.forEach(([value,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-label',label.replace(/\n/g,' '));b.setAttribute('aria-pressed',String(value===current));b.onclick=()=>change(value);host.append(b)});
}
function individualProducts(a,b){
 const products=[];
 const n=a.length+b.length-1;
 for(let j=b.length-1;j>=0;j--){
  const shift=b.length-1-j;
  for(let i=a.length-1;i>=0;i--){
   products.push({j,i,shift,column:n-a.length+i-shift,
    left:a[i],right:b[j],value:a[i]*b[j],
    power:(a.length-1-i)+(b.length-1-j)});
  }
 }
 // Follow place value from the constant column towards higher powers.
 // Within each degree, multiply the bottom factor's higher-power term first
 // (e.g. constant × x before x × constant).
 products.sort((left,right)=>left.power-right.power||left.j-right.j);
 return products;
}
function renderSelectors(){
 const q=[];for(let i=0;i<4;i++)q.push([i,String(i+1)]);q.push(['fresh','Random']);
 chooseButtons('questions',q,state.slot,v=>v==='fresh'?freshQuestion():selectQuestion(v));
 function filter(key,value){state[key]=value;freshQuestion();if(assessment.mode!=='practice')initialiseTest(assessment.source)}
 chooseButtons('types',factorChoices,state.factorRandom?'any':state.type,v=>{
  if(v==='any'){
   const possible=factorTypes.map(pair=>pair[0]).filter(type=>type!==state.type);
   state.factorRandom=false;
   filter('type',possible[Math.floor(Math.random()*possible.length)]);
  }
  else {state.factorRandom=false;filter('type',v)}
 });
 chooseButtons('signs',signChoices,state.sign,v=>filter('sign',v));
 if(state.sign==='random'&&state.question){
  const outcome=signChoices.findIndex(([value])=>value===state.question.sign);
  if(outcome>=0&&outcome<3){
   const actual=$('signs').children[outcome];
   actual.className+=' random-sign-outcome';
   actual.title='Chosen for this question: '+signChoices[outcome][1].replace(/\n/g,' ');
  }
 }
 chooseButtons('levels',levels,state.level,v=>filter('level',v));
 const randomFactor=$('types').children[factorTypes.length];randomFactor.className='level-random';randomFactor.title='Randomly choose linear or quadratic factors';randomFactor.setAttribute('aria-label','Random factors');
 const randomSign=$('signs').children[3];randomSign.className='level-random';randomSign.title='Randomly choose a sign pattern';randomSign.setAttribute('aria-label','Random signs');
 const host=$('modes');host.replaceChildren();
 const toggle=document.createElement('button');toggle.type='button';toggle.textContent=state.mode==='worked'?'Hide':'Worked';toggle.setAttribute('aria-pressed',String(state.mode==='worked'));
 toggle.onclick=()=>{state.mode=state.mode==='worked'?'question':'worked';render()};host.append(toggle);
 const steps=document.createElement('button');steps.type='button';steps.textContent='Step by step';steps.setAttribute('aria-pressed',String(state.mode==='step'));
 steps.onclick=()=>{state.mode='step';state.step=0;state.partialCount=0;state.partialAll=false;render()};host.append(steps);
 if(state.mode==='step'){
  const reset=document.createElement('button');reset.type='button';reset.textContent='Reset steps';
  reset.setAttribute('aria-label','Reset step-by-step working');
  reset.onclick=()=>{state.step=0;state.partialCount=0;state.partialAll=false;render()};host.append(reset);
 }
}
function coefficientInputs(){
 const host=$('coefficients');host.replaceChildren();
 (state.question.type==='ql'?[['First factor','b'],['Second factor','a']]:[['First factor','a'],['Second factor','b']]).forEach(([title,key])=>{
  const group=document.createElement('div');group.className='factor-fields';
  state.question[key].forEach((v,i)=>{
   const degree=state.question[key].length-i-1;
   const label=document.createElement('label');label.className='coefficient';
   const control=document.createElement('div');control.className='coefficient-control';
   if(state.mode==='step'&&state.step===3&&state.partialCount>0&&!state.partialAll){
    const selected=individualProducts(state.question.a,state.question.b)[state.partialCount-1];
    if(selected&&((key==='a'&&i===selected.i)||(key==='b'&&i===selected.j)))control.className+=' coefficient-highlight';
   }
   const caption=document.createElement('span');caption.className='coefficient-symbol';caption.innerHTML=degree===0?'#':degree===1?'x':pow(degree);
   const input=document.createElement('input');input.type='text';input.inputMode='numeric';input.value=String(v);
   input.setAttribute('aria-label',title+', coefficient of '+(degree===0?'constant':degree===1?'x':'x to the power '+degree));
   const arrows=document.createElement('div');arrows.className='coefficient-arrows';
   function update(n){if(!Number.isInteger(n)||Math.abs(n)>999)return;
    state.question[key][i]=n;input.value=String(n);input.removeAttribute('aria-invalid');draw();
   }
   input.addEventListener('input',()=>{const raw=input.value.trim();
    if(!/^-?\d+$/.test(raw)||Math.abs(Number(raw))>999){input.setAttribute('aria-invalid','true');return}
    update(Number(raw));
   });
   input.addEventListener('blur',()=>{input.value=String(state.question[key][i]);input.removeAttribute('aria-invalid')});
   input.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    e.preventDefault();update(state.question[key][i]+(e.key==='ArrowUp'?1:-1));
   }});
   [['▲',1,'Increase'],['▼',-1,'Decrease']].forEach(([glyph,delta,action])=>{
    const button=document.createElement('button');button.type='button';button.textContent=glyph;
    button.setAttribute('aria-label',action+' '+title+' coefficient of '+(degree===0?'constant':degree===1?'x':'x to the power '+degree));
    button.onclick=()=>update(state.question[key][i]+delta);
    arrows.append(button);
   });
   const valueLine=document.createElement('div');valueLine.className='coefficient-value';
   valueLine.append(input,arrows);control.append(caption,valueLine);label.append(control);group.append(label);
  });host.append(group);
 });
}
function row(table,values,kind='',label='',degree=0,showPowers=false,asPolynomial=false,trailingZeros=0){
 const tr=document.createElement('tr');if(kind)tr.className=kind;
 const head=document.createElement('td');head.className='row-label';head.textContent=label;tr.append(head);
 let started=false;
 values.forEach((v,i)=>{
  const cell=document.createElement('td'),p=degree-i;
  if(v===null){
   if(trailingZeros>0&&i>=values.length-trailingZeros){cell.textContent='0';cell.className='placeholder-zero'}
  }else if(asPolynomial){
   if(v!==0){
    const prefix=started?(v>0?' + ':' − '):(v<0?'−':'');
    const magnitude=Math.abs(v);
    cell.innerHTML=prefix+(p&&magnitude===1?'':magnitude)+(p?pow(p):'');
    started=true;
   }
  }else cell.innerHTML=minus(v)+(showPowers&&p?pow(p):'');
  tr.append(cell);
 });
 table.append(tr);
}
function draw(){
 const {a,b}=state.question,final=product(a,b),n=final.length,degree=n-1;
 const mode=state.mode,step=mode==='worked'?6:mode==='question'?0:state.step;
 const root=$('canvas');root.replaceChildren();
 $('heading').textContent='';
 $('help').textContent='';
 $('practiceArea').className=mode==='step'?'step-active'+(step===3&&state.partialCount&&!state.partialAll?' partial-theme-'+((state.partialCount-1)%3):''):'';
 const checklist=$('stepChecklist');
 checklist.hidden=mode!=='step';
 if(mode==='step'){
  checklist.replaceChildren();
  const caption=document.createElement('div');caption.className='step-checklist-title';caption.textContent='Steps';checklist.append(caption);
  actions.forEach((action,i)=>{
   const entry=document.createElement('button');entry.type='button';
   entry.className='checklist-item '+(i<step?'step-complete':i===step?'step-current':'step-upcoming');
   entry.setAttribute('aria-current',i===step?'step':'false');
   entry.setAttribute('aria-label','Go to step '+(i+1)+': '+action);
   const marker=document.createElement('span');marker.className='checklist-marker';marker.textContent=i<step?'✓':String(i+1);
   const label=document.createElement('span');label.textContent=action;
   entry.append(marker,label);
   entry.onclick=()=>{state.step=i+1;if(i===2){state.partialCount=1;state.partialAll=false;}render()};
   checklist.append(entry);
   if(i===2&&step===3){
    const sub=document.createElement('div');sub.className='partial-buttons';
    sub.setAttribute('aria-label','Individual partial products');
    const items=individualProducts(a,b);
    items.forEach((item,index)=>{
     const btn=document.createElement('button');btn.type='button';
     btn.textContent=String(index+1);
     btn.setAttribute('aria-label','Show partial product '+(index+1)+' of '+items.length);
     btn.setAttribute('aria-pressed',String(state.partialCount===index+1));
     btn.className=index<state.partialCount?'partial-done':'';
     btn.onclick=()=>{state.partialCount=index+1;state.partialAll=index===items.length-1;render()};
     sub.append(btn);
    });
    const all=document.createElement('button');all.type='button';all.className='partial-all';
    all.textContent='All';all.setAttribute('aria-label','Show all partial products');
    all.setAttribute('aria-pressed',String(state.partialAll));
    all.onclick=()=>{state.partialCount=items.length;state.partialAll=true;render()};
    sub.append(all);
    checklist.append(sub);
   }
  });
 }
 const pad=v=>Array(n-v.length).fill(null).concat(v);
 const visibleFactors=state.question.type==='ql'?[b,a]:[a,b];
 $('factorExpression').innerHTML=visibleFactors.map(f=>'<span class="factor"><span class="bracket">(</span>'+poly(f)+'<span class="bracket">)</span></span>').join(' ');
 if(mode!=='question'&&(mode!=='step'||step>=1)){
  const table=document.createElement('table');table.className='math-table';
  if(true){
   const headings=document.createElement('tr');headings.append(document.createElement('th'));
   for(let p=degree;p>=0;p--){const th=document.createElement('th');th.innerHTML=p?pow(p):'#';headings.append(th)}table.append(headings);
  }
  if(mode!=='step'||step>=2){
   row(table,pad(a),'','',degree);
   row(table,pad(b),'underline','',degree);
  }
  if(mode==='step'&&step===3&&state.partialCount>0&&!state.partialAll){
   const active=individualProducts(a,b)[state.partialCount-1];
   if(active){
    const rows=table.children;
    const top=rows[1]?.children[n-a.length+active.i+1];
    const bottom=rows[2]?.children[n-b.length+active.j+1];
    if(top){top.className+=' table-operand table-operand-first';top.innerHTML='<span class="partial-ring">'+top.innerHTML+'</span>'}
    if(bottom){bottom.className+=' table-operand table-operand-second';bottom.innerHTML='<span class="partial-ring">'+bottom.innerHTML+'</span>'}
   }
  }
  if(step>=3){
   const products=individualProducts(a,b);
   const visible=mode==='step'&&step===3?state.partialCount:products.length;
   for(let j=b.length-1;j>=0;j--){
    const shift=b.length-1-j,values=Array(n).fill(null);
    for(let i=a.length-1;i>=0;i--){
     const index=products.findIndex(item=>item.i===i&&item.j===j);
     if(index<visible)values[n-a.length+i-shift]=a[i]*b[j];
    }
    row(table,values,'','',degree,false,false,0);
   }
  }
  if(mode==='step'&&step===3&&state.partialCount>0&&!state.partialAll){
   const active=individualProducts(a,b)[state.partialCount-1];
   if(active){
    const resultRow=table.children[3+(b.length-1-active.j)];
    const resultCell=resultRow?.children[active.column+1];
    if(resultCell){
     resultCell.className+=' table-product-result';
     resultCell.innerHTML='<span class="partial-ring">'+resultCell.innerHTML+'</span>';
    }
   }
  }
  if(step>=4)row(table,final,'sum','+',degree,step>=5);
  root.append(table);
  if(mode==='step'&&step===3&&state.partialCount>0&&!state.partialAll){
   const items=individualProducts(a,b);
   const item=items[state.partialCount-1];
   const note=document.createElement('div');note.className='partial-explanation';
   note.textContent=minus(item.left)+' × '+minus(item.right)+' = '+minus(item.value);
   const location=document.createElement('span');
   location.textContent=' · '+(item.power===0?'constant column':item.power===1?'x column':'x'+String.fromCharCode(0x00b2+0)+' column');
   if(item.power>1)location.textContent=' · x^'+item.power+' column';
   note.append(location);root.append(note);
  }
  if(step>=6){
   const eq=document.createElement('div');eq.className='equation worked-conclusion';
   eq.innerHTML=poly(final);
   root.append(eq);
  }
  if(mode==='step'&&step===7){
   const reflection=document.createElement('div');reflection.className='reflection';
   const heading=document.createElement('strong');heading.textContent='Reflection';
   const paragraph=document.createElement('p');
   paragraph.textContent=state.question.type==='ll'
    ?'Overkill! This method is overkill for linear × linear. FOIL or the cross-product method is quicker. But hey, it was fun!'
    :'For linear × quadratic and quadratic × quadratic, place-value multiplication is an especially effective method. It keeps like powers aligned and the partial products organised. Expanding brackets term by term can become laborious, tedious and prone to errors; the place-value method makes the calculation clearer and more systematic.';
   reflection.append(heading,paragraph);root.append(reflection);
  }
 }

}

const assessment={mode:'practice',questions:[],responses:[],submitted:false,checked:[],choices:[],selected:[],firstAttempts:[],run:0,source:'bank',sound:true,quizType:'working',workChoices:[],attempts:[],tried:[]};
function el(tag,textValue,className){
 const e=document.createElement(tag);if(textValue!==undefined)e.textContent=textValue;
 if(className)e.className=className;return e;
}
function playQuizSound(correct){
 if(!assessment.sound)return;
 try{
  const AudioCtor=window.AudioContext||window.webkitAudioContext;
  if(!AudioCtor)return;
  const ctx=new AudioCtor();
  const now=ctx.currentTime;
  const notes=correct===true?[[660,0,.16],[880,.18,.25]]:correct==='fanfare'?[[523,0,.16],[659,.18,.16],[784,.36,.18],[1047,.56,.48]]:correct==='final-wrong'?[[410,0,.20],[300,.25,.22],[195,.53,.42]]:[[350,0,.23],[245,.29,.31]];
  notes.forEach(([frequency,offset,duration])=>{
   const osc=ctx.createOscillator(),gain=ctx.createGain();
   osc.type=correct==='final-wrong'?'sawtooth':correct===false?'triangle':'sine';osc.frequency.value=frequency;
   gain.gain.setValueAtTime(0,now+offset);
   gain.gain.linearRampToValueAtTime(correct==='final-wrong'?.17:correct===false?.085:.13,now+offset+.02);
   gain.gain.exponentialRampToValueAtTime(.001,now+offset+duration);
   osc.connect(gain);gain.connect(ctx.destination);
   osc.start(now+offset);osc.stop(now+offset+duration+.01);
  });
  if(ctx.close) setTimeout(()=>{Promise.resolve(ctx.close()).catch(()=>{})},1700);
 }catch(_err){/* Sound is optional; marking always works without audio. */}
}
function testExpression(q){
 const factors=q.type==='ql'?[q.b,q.a]:[q.a,q.b];
 return factors.map(f=>'('+poly(f)+')').join(' ');
}
function createChoices(q,index){
 const correct=product(q.a,q.b),length=correct.length;
 const rng=seeded(seedFor(index+assessment.run*31+53));
 const positions=[0,Math.floor(length/2),length-1];
 const variants=positions.map((position,k)=>{
  const answer=correct.slice(),magnitude=1+rng(0,2);
  answer[position]+= (k===1?-1:1)*magnitude;
  return answer;
 });
 const choices=[correct.slice(),...variants];
 for(let i=choices.length-1;i>0;i--){
  const j=rng(0,i);[choices[i],choices[j]]=[choices[j],choices[i]];
 }
 return choices;
}

function workRows(q){
 const a=q.a,b=q.b,n=a.length+b.length-1;
 const rows=[];
 for(let j=b.length-1;j>=0;j--){
  if(b[j]===0)continue;
  const shift=b.length-1-j,values=Array(n).fill(null);
  for(let i=0;i<a.length;i++)values[n-a.length+i-shift]=a[i]*b[j];
  rows.push(values);
 }

}
function createWorkChoices(q,index){
 const base=workRows(q),correct=product(q.a,q.b);
 const rng=seeded(seedFor(index+assessment.run*17+277));
 const variants=[{rows:base.map(r=>r.slice()),sum:correct.slice(),valid:true,error:'none',top:q.a.slice(),bottom:q.b.slice()}];
 // A transcription error: an incorrect coefficient is carried consistently
 // through the subsequent multiplication and addition.
 const incorrectTop=q.a.slice(),incorrectBottom=q.b.slice();
 const target=rng(0,1)===0?incorrectTop:incorrectBottom;
 const pos=rng(Math.max(0,target.length-2),target.length-1);
 target[pos]+=(target[pos]>=0?1:-1);
 const copied={a:incorrectTop,b:incorrectBottom};
 variants.push({rows:workRows(copied),sum:product(copied.a,copied.b),
  valid:false,error:'transcription',top:incorrectTop,bottom:incorrectBottom});
 // Multiplication error propagated into the final column total.
 const spots=[];
 base.forEach((row,i)=>row.forEach((v,j)=>{if(v!==null)spots.push([i,j])}));
 const preferred=spots.filter(([row,col])=>col>=Math.floor(correct.length/2));
 const [ri,ci]=(preferred.length?preferred:spots)[rng(0,(preferred.length?preferred:spots).length-1)];
 const badRows=base.map(row=>row.slice());
 const delta=rng(0,1)===0?-1:1;
 badRows[ri][ci]+=delta;
 const badSum=correct.slice();badSum[ci]+=delta;
 variants.push({rows:badRows,sum:badSum,valid:false,error:'multiplication',
  top:q.a.slice(),bottom:q.b.slice()});
 // Addition error: products correct but the column total incorrect.
 const col=rng(Math.floor(correct.length/2),correct.length-1),sum=correct.slice();
 sum[col]+=(rng(0,1)===0?-1:1);
 variants.push({rows:base.map(row=>row.slice()),sum,valid:false,error:'addition',
  top:q.a.slice(),bottom:q.b.slice()});
 for(let i=variants.length-1;i>0;i--){
  const j=rng(0,i);[variants[i],variants[j]]=[variants[j],variants[i]];
 }
 return variants;
}

function workingTable(q,work,showMistakes=false){
 const n=product(q.a,q.b).length,power=n-1,originalRows=workRows(q),baseRows=workRows({a:work.top,b:work.bottom});
 const actualTotals=Array(n).fill(0);
 work.rows.forEach(r=>r.forEach((v,j)=>{if(v!==null)actualTotals[j]+=v}));
 const display=(value,wrong)=>wrong&&showMistakes
   ?'<span class="work-error-cell"><span>'+minus(value)+'</span><span class="work-error-cross" aria-label="Incorrect value">✕</span></span>'
   :minus(value);
 const pad=v=>Array(n-v.length).fill(null).concat(v);
 const tr=(values,expected,kind='')=>'<tr class="'+kind+'"><td></td>'+values.map((v,j)=>
   '<td>'+(v===null?'':display(v,expected&&v!==expected[j]))+'</td>').join('')+'</tr>';
 const head='<tr><th>'+(showMistakes&&work.valid?'<span class="work-correct-tick" aria-label="All working correct">✓</span>':'')+'</th>'+Array.from({length:n},(_,i)=>'<th>'+(power-i?pow(power-i):'#')+'</th>').join('')+'</tr>';
 const totals='<tr class="work-total"><td>+</td>'+work.sum.map((v,j)=>'<td>'+
   (showMistakes&&v!==actualTotals[j]
    ?'<span class="work-error-cell"><span>'+minus(v)+(v!==0&&power-j?pow(power-j):'')+'</span><span class="work-error-cross" aria-label="Incorrect total">✕</span></span>'
    :minus(v)+(v!==0&&power-j?pow(power-j):''))+'</td>').join('')+'</tr>';
 return '<table class="quiz-work-table">'+head+tr(pad(work.top),pad(q.a))+
   tr(pad(work.bottom),pad(q.b),'factor-divider')+
   work.rows.map((row,i)=>tr(row,baseRows[i]||originalRows[i])).join('')+totals+'</table>';
}

function worksheetQuestions(){

   state.type=type;state.factorRandom=false;
   for(let i=0;i<count;i++){
    const availableLevels=ws.levels.includes('random')?[1,2,3]:ws.levels;
    const availableSigns=ws.signs.includes('random')?['positive','negative','mixed']:ws.signs;
    state.level=availableLevels[i%availableLevels.length];state.sign=availableSigns[i%availableSigns.length];
    const seed=i<4?seedFor(i):(seedFor(i%4)^((i+19)*47231))>>>0;

  const types=['ll','ql','qq'].filter(t=>ws.counts[t]>0);
  for(let i=0;i<ws.extra&&types.length;i++){
   state.type=types[i%types.length];
   const availableLevels=ws.levels.includes('random')?[1,2,3]:ws.levels;
   const availableSigns=ws.signs.includes('random')?['positive','negative','mixed']:ws.signs;
   state.level=availableLevels[i%availableLevels.length];state.sign=availableSigns[i%availableSigns.length];
   const seed=((Math.random()*0xffffffff)>>>0);
   out.push({q:makeQuestion(seeded(seed)),type:state.type,level:state.level,number:null});
  }
 }finally{state.type=old.type;state.level=old.level;state.sign=old.sign;state.factorRandom=old.random}

 const names={ll:'Linear × Linear',ql:'Linear × Quadratic',qq:'Quadratic × Quadratic'};
 function problem(item,index){
  const q=item.q,n=q.a.length+q.b.length-1,degree=n-1,mode=support(index);
  const factors=q.type==='ql'?[q.b,q.a]:[q.a,q.b],pad=values=>Array(n-values.length).fill(null).concat(values);
  const formula='('+poly(factors[0])+') × ('+poly(factors[1])+')';
  const label='<div class="meta">'+(index+1)+'. '+names[item.type]+' · Level '+item.level+(item.number?' · HW '+item.number:' · Random')+'</div>';
  const greyAnswer=ws.answers==='grey'?'<div class="grey-answer">= '+poly(product(q.a,q.b))+'</div>':'';
  const prompt=ws.steps&&mode!=='full'?'<div class="method-prompts">1. Set up columns &nbsp; 2. Place coefficients &nbsp; 3. Multiply &nbsp; 4. Group like terms &nbsp; 5. Write the answer</div>':'';
  if(mode==='none'){
   return '<article class="problem independent">'+label+'<div class="formula">'+formula+'</div>'+prompt+greyAnswer+'</article>';
  }
  if(mode==='guided'||mode==='faded'){
   const hint=mode==='guided'?'Align coefficients by place value.':'Group like terms.';
   return '<article class="problem independent">'+label+'<div class="formula">'+formula+'</div>'+
    '<div class="gentle-hint">'+hint+'</div>'+prompt+greyAnswer+'</article>';
  }
  const headers=Array.from({length:n},(_,i)=>'<th>'+(degree-i?pow(degree-i):'#')+'</th>').join('');
  function tableRow(values,cls='',mark=''){
   return '<tr class="'+cls+'"><td class="operator">'+mark+'</td>'+
    values.map(v=>'<td>'+(v===null?'':minus(v))+'</td>').join('')+'</tr>';
  }
  const rows=tableRow(pad(q.a),'factor-top')+tableRow(pad(q.b),'factor-bottom')+
   workRows(q).map(values=>tableRow(values,'partial-row')).join('')+
   tableRow(product(q.a,q.b),'sum-row','+');
  return '<article class="problem worked">'+label+'<div class="formula">'+formula+'</div>'+
   '<table class="worked-table"><thead><tr><th></th>'+headers+'</tr></thead><tbody>'+rows+'</tbody></table>'+
   '<div class="worked-answer">= '+poly(product(q.a,q.b))+'</div></article>';
 }
 for(let i=0;i<all.length;i+=perPage){
  const chunk=all.slice(i,i+perPage).map((x,k)=>problem(x,i+k)).join('');
  pages.push('<section class="sheet"><header><strong>Polynomial multiplication · Place-value method</strong>'+
   '<span>Name: _______________________ &nbsp; Date: __________</span></header><div class="questions">'+chunk+
   '</div><footer>'+(i+1)+'–'+Math.min(i+perPage,all.length)+' / '+all.length+'</footer></section>');
 }
 const key=ws.answers==='key'?all.map((item,i)=>{const q=item.q,fs=q.type==='ql'?[q.b,q.a]:[q.a,q.b];
  return '<div class="solution"><strong>'+(i+1)+'. '+names[item.type]+' · L'+item.level+'</strong>'+
   '<div>('+poly(fs[0])+') × ('+poly(fs[1])+')</div><b>= '+poly(product(q.a,q.b))+'</b></div>';
 }).join(''):'';
 const html='<!doctype html><html lang="en-IE"><head><meta charset="utf-8"><title>Polynomial worksheet</title><style>'+
 '@page{size:A4 landscape;margin:10mm}*{box-sizing:border-box}body{margin:0;background:#f1f3f6;color:#26364a;font-family:Arial,sans-serif}'+
 '.controls{background:#fff;padding:10px;position:sticky;top:0;z-index:9}button{padding:9px;margin-right:8px}'+
 '.sheet{background:#fff;max-width:297mm;min-height:190mm;margin:12px auto;padding:10mm;break-after:page}header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #9eafc2;padding-bottom:8px;font-size:13px}'+
 '.questions{display:grid;grid-template-columns:repeat('+columns+',minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:6mm;justify-content:center;margin:11mm auto 0;min-height:158mm}'+
 '.problem{min-width:0;padding:3mm 2mm;break-inside:avoid;min-height:70mm}'+
 '.meta{font-size:11px;font-weight:650;color:#455770;min-height:9mm}.formula{font:clamp(17px,1.9vw,26px)/1.3 Cambria,"Cambria Math",Georgia,serif;text-align:center;overflow-wrap:anywhere}'+
 '.problem.independent .formula{margin-top:4mm}.gentle-hint{margin-top:5mm;font-size:10px;color:#808b98;text-align:center}'+
 '.method-prompts{font:10px/1.55 Arial,sans-serif;color:#69798a;margin-top:8mm;text-align:center}'+
 '.grey-answer{font:clamp(14px,1.3vw,18px) Cambria,Georgia,serif;color:#b3bbc5;text-align:center;margin-top:9mm}'+
 '.problem.worked{padding:2.5mm;border:1px solid #bfcbd8;border-radius:5px;background:#fff}'+
 '.problem.worked .formula{margin:1mm 0 4mm;font-size:clamp(16px,1.65vw,23px)}'+
 '.worked-table{width:100%;table-layout:fixed;border-collapse:collapse;text-align:center;font:clamp(14px,1.4vw,20px)/1.3 Cambria,"Cambria Math",Georgia,serif}'+
 '.worked-table th{height:8mm;border-bottom:2px solid #a8b6c5;font-weight:600;color:#334155}'+
 '.worked-table td{height:6.6mm;padding:0 1px}.worked-table .operator{width:12px;text-align:left;color:#687589}'+
 '.worked-table .factor-bottom td{border-bottom:2px solid #8e9cad}'+
 '.worked-table .sum-row td{border-top:2px solid #8e9cad;font-weight:bold}'+
 '.worked-answer{display:table;font:clamp(14px,1.45vw,20px) Cambria,"Cambria Math",Georgia,serif;border:1.5px solid #63758a;border-radius:4px;padding:2mm 3mm;margin:4mm auto 0;text-align:center}'+
  'footer{text-align:right;font-size:10px;color:#6a7686;margin-top:12px}.key{display:none;background:white;max-width:297mm;margin:12px auto;padding:12mm;break-after:page}'+
 '.key h2{font-size:17px}.answer-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.solution{break-inside:avoid;border-bottom:1px solid #ddd;padding:10px 0}.solution div,.solution b{display:block;font:15px Cambria,Georgia,serif;margin-top:7px}'+
 'body.answers .sheet{display:none}body.answers .key{display:block}'+
 '@media print{body{background:white}.controls{display:none}.sheet{margin:0;padding:0;min-height:0;break-after:page}.sheet:last-of-type{break-after:auto}.problem{min-height:0}.key{padding:0;margin:0;max-width:none}}'+
 '</style></head><body><div class="controls">'+
 '<button onclick="document.body.className=\'\';window.print()">Print student worksheet</button>'+
 (ws.answers==='key'?'<button onclick="document.body.className=\'answers\';window.print()">Print teacher answers</button>':'')+
 '<button onclick="document.body.className=\'\';">View questions</button>'+
 (ws.answers==='key'?'<button onclick="document.body.className=\'answers\';">View answers</button>':'')+'</div>'+
 pages.join('')+(ws.answers==='key'?'<section class="key"><h2>Teacher answers · '+all.length+' questions</h2><div class="answer-grid">'+key+'</div></section>':'')+'</body></html>';
 const popup=window.open('','_blank');if(!popup){alert('Allow pop-ups to view the worksheet.');return}
 popup.document.open();popup.document.write(html);popup.document.close();
}
$('worksheetMode').onclick=()=>{
 const panel=$('worksheetPanel');panel.hidden=!panel.hidden;
 $('worksheetMode').setAttribute('aria-expanded',String(!panel.hidden));
 if(!panel.hidden)worksheetOptions();
};
function switchMode(mode){
 assessment.mode=mode;
 const active=mode!=='practice';
 $('practiceArea').hidden=active;$('testArea').hidden=!active;
 for(const [key,value] of [['practiceMode','practice'],['quizMode','quiz'],['testMode','test']]){
  $(key).setAttribute('aria-pressed',String(mode===value));
 }
 if(active){initialiseTest('random')}
}
$('practiceMode').onclick=()=>switchMode('practice');
$('quizMode').onclick=()=>switchMode('quiz');
$('testMode').onclick=()=>switchMode('test');
function connectTableOperands(){
 const host=$('canvas');
 const previous=host.querySelector&&host.querySelector('.table-operand-connector');
 if(previous)previous.remove();
 if(state.mode!=='step'||state.step!==3||!state.partialCount||state.partialAll||
    !host.querySelector||!host.getBoundingClientRect)return;
 const first=host.querySelector('.table-operand-first');
 const second=host.querySelector('.table-operand-second');
 if(!first||!second||!first.getBoundingClientRect||!second.getBoundingClientRect)return;
 const base=host.getBoundingClientRect(),a=first.getBoundingClientRect(),b=second.getBoundingClientRect();
 const x1=a.left+a.width/2-base.left,y1=a.bottom-base.top-6;
 const x2=b.left+b.width/2-base.left,y2=b.top-base.top+6;
 const length=Math.hypot(x2-x1,y2-y1);
 if(length<1)return;
 const line=document.createElement('div');line.className='table-operand-connector';
 line.style.left=x1+'px';line.style.top=y1+'px';line.style.width=length+'px';
 line.style.transform='rotate('+Math.atan2(y2-y1,x2-x1)+'rad)';
 host.append(line);
}
function render(){renderSelectors();coefficientInputs();draw();connectTableOperands()}
window.addEventListener('resize',connectTableOperands);
selectQuestion(0);
})();</script>
