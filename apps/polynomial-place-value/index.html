<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202124;background:#f1f3f4}
*{box-sizing:border-box}
body{margin:0}
header{background:#fff;border-bottom:1px solid #dadce0;padding:4px max(16px,calc((100vw - 1150px)/2));display:flex;align-items:center;gap:8px;min-height:48px}

button:hover{background:#f1f5fb}button:focus-visible,input:focus-visible{outline:3px solid #78aaff;outline-offset:2px}

.top-questions{margin:3px 0 6px}.bankbar{padding-top:9px}.bankbar>span{font-size:.84rem;color:#576270;font-weight:650}.edit-hint{font-size:.81rem;color:#647080;margin:10px 0 0}
.top-questions button{flex:0 0 34px;width:34px;height:34px;border-radius:50%;padding:0;font-weight:700}
.top-questions button{min-width:34px}
.settings{display:flex;flex-wrap:wrap;gap:8px 12px;padding:7px 0 8px;border-top:1px solid #e2e6ea;border-bottom:1px solid #e2e6ea}
.setting{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:6px 12px;border:1px solid #dce2e9;border-radius:8px;background:#fbfcfe}

.modes button[aria-pressed=true]{border-color:#174ea6}.modes button:first-child{font-weight:700}
.coefficients{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start;justify-content:center;margin:5px 0 9px}

.coefficient-control{display:flex;flex-direction:column;align-items:stretch;width:88px;height:62px;border:1px solid #b8c0c9;border-radius:7px;background:#fff;overflow:hidden}
.coefficient-symbol{display:block;text-align:center;height:20px;flex:0 0 20px;font:0.94rem/20px "Cambria Math",Cambria,Georgia,serif;color:#596474;background:#f8fafc;border-bottom:1px solid #edf0f3}

.coefficient-value{display:flex;flex:1 1 auto;min-height:0}
.coefficient-control:focus-within{outline:2px solid #78aaff;outline-offset:1px}
.coefficient-control input{width:100%;min-width:0;flex:1 1 0;border:0;border-radius:0;padding:4px 0 4px 3px;text-align:center;font:1.3rem/1.2 "Cambria Math",Cambria,Georgia,serif;font-variant-numeric:tabular-nums;outline:none!important}
.coefficient-control input:focus-visible{outline:none!important}
.coefficient-arrows{display:flex;flex-direction:column;width:23px;flex:0 0 23px;border-left:1px solid #e5e8ed;background:#f6f7f9}
.coefficient-arrows button{flex:1;border:0;border-radius:0;padding:0;font:10px/1 Arial,sans-serif;color:#7b8490;background:transparent;cursor:pointer}
.coefficient-arrows button:hover{background:#e8edf5;color:#26364d}
.coefficient-arrows button+button{border-top:1px solid #e5e8ed}
.canvas{border:1px solid #d9dfe6;border-radius:9px;padding:18px 14px;min-height:250px;overflow-x:auto}
#heading{font-size:1.12rem;margin:0 0 9px;font-weight:650}
.math-table{margin:0 auto;border-collapse:collapse;table-layout:fixed;width:min(100%,760px)}
.math-table td,.math-table th{font:clamp(1.25rem,2.5vw,2rem)/1.35 "Cambria Math",Cambria,Georgia,serif;text-align:center;padding:8px 5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.math-table th{font:1.03rem Arial,sans-serif;font-weight:500;color:#69747f}
.math-table .row-label{width:45px;text-align:right;font:1rem Arial,sans-serif;color:#5f6973;padding-right:6px}
.math-table .underline td{border-bottom:2px solid #8d99a5}
.math-table .sum td{border-top:2px solid #8d99a5;font-weight:700}
.math-table sup{font-size:.62em;vertical-align:super}.math-table .final-power td{font-weight:700;border-top:1px solid #b3bdc7}.math-table .final-power td:not(.row-label){font-family:"Cambria Math",Cambria,Georgia,serif}
.equation{font:clamp(1.4rem,3vw,2.2rem)/1.4 "Cambria Math",Cambria,Georgia,serif;text-align:center;margin:18px 0 3px;overflow-wrap:anywhere}
.equation sup{font-size:.62em;vertical-align:super}.question-formula{margin:3px auto 10px;font-size:clamp(1.4rem,2.7vw,1.95rem)}.equation.worked-conclusion{font-size:clamp(1.35rem,2.6vw,1.85rem);margin:8px auto 0;max-width:100%;text-align:center}.math-table .final-power td{padding-top:4px;padding-bottom:3px}.math-table .sum td{padding-bottom:3px}
.stepper{justify-content:space-between;gap:12px;margin-top:12px}
.stepper button:last-child{margin-left:auto;font-weight:650}
#stepProgress{font-size:.86rem;color:#647080}
#help{font-size:.88rem;color:#5f6973;margin:3px 0 12px}
#help:empty{display:none}
@media(max-width:680px){
 header img{width:92px}header h1{font-size:1.02rem}.apps-name{font-size:.88rem;margin-right:5px}
 main{margin:0;padding:13px 9px}
 .settings{gap:7px}.setting{width:100%;padding:6px 9px}.setting .caption{min-width:48px}
 .button-group button{padding:7px 9px}
 .coefficients{gap:10px}.coefficient-control{width:80px}
 .math-table td,.math-table th{font-size:1.17rem;padding:7px 2px}
 .math-table .row-label{width:38px;font-size:.76rem}
 .canvas{padding:12px 3px}
}
.factor-expression{font:clamp(1.65rem,3.2vw,2.25rem)/1.35 "Cambria Math",Cambria,Georgia,serif;text-align:center;padding:5px 8px 1px;color:#202124}
.factor-expression sup{font-size:.62em;vertical-align:super}
.factor-expression .bracket{display:inline-block;font-size:1.14em;line-height:1;vertical-align:-.035em}
.factor-expression .factor{display:inline-block;white-space:nowrap}
@media(max-width:680px){.factor-expression{font-size:1.55rem}}
.toolbar-bottom{display:flex;flex-wrap:wrap;align-items:center;gap:7px 10px;margin:7px 0 4px}
.toolbar-bottom .setting{padding:4px 8px;gap:8px}
.toolbar-bottom .top-questions{margin:0}
.toolbar-bottom .modes{margin:0 0 0 auto}
.settings-top{justify-content:flex-start;border-top:0;padding-top:1px}
.settings-top .setting{padding:4px 8px}
.level-random{font-size:.78rem!important;padding:7px 8px!important;color:#6b7280!important;background:#f8fafc!important;border-style:dashed!important}
.level-random[aria-pressed=true]{background:#f8fafc!important;border-color:#b8c0c9!important}
#types button:first-child,#signs button:first-child{font-weight:700}
@media(max-width:700px){.toolbar-bottom .modes{margin-left:0}.toolbar-bottom{gap:8px}.settings-top{gap:7px}}
</style>
</head>
<body>
<header>
<a href="../../index.html" aria-label="Maths home"><img src="../../assets/maths-logo.svg" alt="Maths four-dot logo"></a><span class="apps-name">Apps</span>
<div><a href="../../algebra/index.html">Algebra</a><h1>Place-Value Expansion in One Variable</h1></div>
</header>
<main>

<div class="settings settings-top">
<div class="setting"><div class="button-group" id="types" aria-label="Factors: choose a degree combination or random factors"></div></div>
<div class="setting"><span class="caption">Level</span><div class="button-group" id="levels" aria-label="Difficulty level"></div></div>
</div>
<div class="toolbar-bottom">
<div class="setting bank-setting"><span class="caption">Bank</span><nav class="top-questions" id="questions" aria-label="Four reproducible questions for the selected settings"></nav></div>
<div class="setting"><div class="button-group" id="signs" aria-label="Signs: choose a sign pattern or random signs"></div></div>
<div class="modes" id="modes" aria-label="How to view the solution"></div>
</div>
<div class="factor-expression" id="factorExpression" aria-label="Current multiplication question"></div>


<div class="coefficients" id="coefficients" aria-label="Edit factor coefficients"></div>
<h2 id="heading"></h2>
<p id="help"></p>
<section class="canvas" id="canvas" aria-live="polite"></section>

</main>
<script>(()=>{'use strict';
const $ = id=>document.getElementById(id);
const actions=['Set up the place-value columns','Calculate the partial products','Group like terms','Bring back the powers of x'];
const factorTypes=[['ll','Lin × Lin'],['ql','Lin × Quad'],['qq','Quad × Quad']];
const factorChoices=[['any','Factors'],...factorTypes];
const signTypes=[['positive','Positive'],['negative','Negative'],['mixed','Mixed'],['random','Signs']];
const signChoices=[['random','Signs'],['positive','Positive'],['negative','Negative'],['mixed','Mixed']];
const levels=[[1,'1'],[2,'2'],[3,'3'],['any','↻']];

const state={type:'ql',factorRandom:false,sign:'positive',level:1,mode:'worked',step:0,slot:0,freshCount:0,question:null};
const pow=k=>k===0?'':k===1?'x':'x<sup>'+k+'</sup>';
const minus=v=>v<0?'−'+Math.abs(v):String(v);
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t}return a};
const primitive=a=>a.reduce((g,v)=>gcd(g,v),0)===1;
function poly(a){let result='',degree=a.length-1;
 for(let i=0;i<a.length;i++){const v=a[i],p=degree-i;if(v===0)continue;
  const body=(p&&Math.abs(v)===1?'':Math.abs(v))+pow(p);
  result+=(result?(v<0?' − ':' + '):(v<0?'−':''))+body;
 }return result||'0';
}
function product(a,b){const out=Array(a.length+b.length-1).fill(0);a.forEach((x,i)=>b.forEach((y,j)=>{out[i+j]+=x*y}));return out}
function seedFor(slot){const typeIndex=factorTypes.findIndex(x=>x[0]===state.type),signIndex=signTypes.findIndex(x=>x[0]===state.sign);
 return ((slot+1)*209759+(state.level+13)*17539+(typeIndex+1)*9151+(signIndex+2)*1877)>>>0}
function seeded(seed){let x=seed>>>0;return (min,max)=>{x^=x<<13;x^=x>>>17;x^=x<<5;x>>>=0;return min+(x%(max-min+1))}}
function chooseSign(next){return ['positive','negative','mixed'][next(0,2)]}
function makeQuestion(next,serial){
 const [na,nb]=state.type==='ll'?[2,2]:state.type==='ql'?[3,2]:[3,3];
 const level=state.level,sign=state.sign==='random'?chooseSign(next):state.sign;
 const choose=(a)=>a[next(0,a.length-1)];
 const small=()=>next(2,9),low=()=>next(1,6),big=()=>choose([10,11,11,11,20,21,30,31]);
 let a,b;
 for(let trial=0;trial<2000;trial++){
  if(level===1){
   a=Array.from({length:na},()=>low());b=Array.from({length:nb},()=>low());
   // One unit coefficient in each factor, at independently selected positions.
   a[next(0,na-1)]=1;b[next(0,nb-1)]=1;
  }else if(level===2){
   a=Array.from({length:na},small);b=Array.from({length:nb},small);
   if(next(0,3)===0)(next(0,1)?a:b)[0]=11;
  }else{
   a=Array.from({length:na},small);b=Array.from({length:nb},small);
   // A useful two-digit factor, usually 11, rather than unrestricted large coefficients.
   const target=next(0,1)?a:b;target[next(0,target.length-1)]=big();
  }
  for(const arr of [a,b]){
   for(let i=1;i<arr.length;i++){
    if(sign==='negative'||(sign==='mixed'&&next(0,1)===1))arr[i]*=-1;
   }
  }
  if(sign==='mixed'){
   const other=a.slice(1).concat(b.slice(1)).filter(v=>v!==0);
   if(other.every(v=>v>0))b[b.length-1]*=-1;
   if(other.every(v=>v<0))a[a.length-1]*=-1;
  }
  if(primitive(a)&&primitive(b)&&a[0]>0&&b[0]>0)return{a,b};
 }
 // Guaranteed primitive fallback, retaining the selected sign pattern.
 return{a:[1,...Array(na-1).fill(sign==='negative'?-2:2)],
        b:[1,...Array(nb-1).fill(sign==='positive'?3:-3)]};
}
function chosenQuestion(){const rng=state.slot==='fresh'?seeded(seedFor(state.freshCount+1000) ^ ((Math.random()*0xffffffff)>>>0)):seeded(seedFor(state.slot));return makeQuestion(rng,state.slot)}
function selectQuestion(slot){state.slot=slot;state.question=chosenQuestion();render()}
function freshQuestion(){state.freshCount++;selectQuestion('fresh')}
function chooseButtons(id,entries,current,change){
 const host=$(id);host.replaceChildren();
 entries.forEach(([value,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-pressed',String(value===current));b.onclick=()=>change(value);host.append(b)});
}
function renderSelectors(){
 const q=[];for(let i=0;i<4;i++)q.push([i,String(i+1)]);
 chooseButtons('questions',q,state.slot,v=>selectQuestion(v));
 function filter(key,value){state[key]=value;freshQuestion()}
 chooseButtons('types',factorChoices,state.factorRandom?'any':state.type,v=>{
  if(v==='any'){state.factorRandom=true;state.type=factorTypes[Math.floor(Math.random()*factorTypes.length)][0];freshQuestion()}
  else {state.factorRandom=false;filter('type',v)}
 });
 chooseButtons('signs',signChoices,state.sign,v=>filter('sign',v));
 chooseButtons('levels',levels,state.level,v=>{if(v==='any'){state.level=1+Math.floor(Math.random()*3);freshQuestion()}else filter('level',v)});
 const randomLevel=$('levels').children[3];randomLevel.className='level-random';randomLevel.title='Randomly choose Level 1, 2 or 3';randomLevel.setAttribute('aria-label','Random level');
 const host=$('modes');host.replaceChildren();
 const toggle=document.createElement('button');toggle.type='button';toggle.textContent=state.mode==='worked'?'Hide':'Worked';toggle.setAttribute('aria-pressed',String(state.mode==='worked'));
 toggle.onclick=()=>{state.mode=state.mode==='worked'?'question':'worked';render()};host.append(toggle);
 const steps=document.createElement('button');steps.type='button';steps.textContent=state.mode!=='step'?'Step by step':state.step===3?'Restart steps':'Next: '+actions[state.step+1]+' →';steps.setAttribute('aria-pressed',String(state.mode==='step'));
 steps.onclick=()=>{if(state.mode!=='step'){state.mode='step';state.step=0;}else{state.step=state.step===3?0:state.step+1;}render()};host.append(steps);
}
function coefficientInputs(){
 const host=$('coefficients');host.replaceChildren();
 (state.type==='ql'?[['First factor','b'],['Second factor','a']]:[['First factor','a'],['Second factor','b']]).forEach(([title,key])=>{
  const group=document.createElement('div');group.className='factor-fields';
  state.question[key].forEach((v,i)=>{
   const degree=state.question[key].length-i-1;
   const label=document.createElement('label');label.className='coefficient';
   const control=document.createElement('div');control.className='coefficient-control';
   const caption=document.createElement('span');caption.className='coefficient-symbol';caption.innerHTML=degree===0?'#':degree===1?'x':pow(degree);
   const input=document.createElement('input');input.type='text';input.inputMode='numeric';input.value=String(v);
   input.setAttribute('aria-label',title+', coefficient of '+(degree===0?'constant':degree===1?'x':'x to the power '+degree));
   const arrows=document.createElement('div');arrows.className='coefficient-arrows';
   function update(n){if(!Number.isInteger(n)||Math.abs(n)>999)return;
    state.question[key][i]=n;input.value=String(n);input.removeAttribute('aria-invalid');draw();
   }
   input.addEventListener('input',()=>{const raw=input.value.trim();
    if(!/^-?\d+$/.test(raw)||Math.abs(Number(raw))>999){input.setAttribute('aria-invalid','true');return}
    update(Number(raw));
   });
   input.addEventListener('blur',()=>{input.value=String(state.question[key][i]);input.removeAttribute('aria-invalid')});
   input.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){
    e.preventDefault();update(state.question[key][i]+(e.key==='ArrowUp'?1:-1));
   }});
   [['▲',1,'Increase'],['▼',-1,'Decrease']].forEach(([glyph,delta,action])=>{
    const button=document.createElement('button');button.type='button';button.textContent=glyph;
    button.setAttribute('aria-label',action+' '+title+' coefficient of '+(degree===0?'constant':degree===1?'x':'x to the power '+degree));
    button.onclick=()=>update(state.question[key][i]+delta);
    arrows.append(button);
   });
   const valueLine=document.createElement('div');valueLine.className='coefficient-value';
   valueLine.append(input,arrows);control.append(caption,valueLine);label.append(control);group.append(label);
  });host.append(group);
 });
}
function row(table,values,kind='',label='',degree=0,showPowers=false,asPolynomial=false){
 const tr=document.createElement('tr');if(kind)tr.className=kind;
 const head=document.createElement('td');head.className='row-label';head.textContent=label;tr.append(head);
 let started=false;
 values.forEach((v,i)=>{const cell=document.createElement('td');const p=degree-i;
  if(v===null){cell.textContent='';}
  else if(asPolynomial){if(v===0){cell.textContent='';}else{
   const sign=started?(v>0?'+':'−'):(v<0?'−':'');
   const number=Math.abs(v);
   cell.innerHTML=sign+(p&&number===1?'':number)+(p?pow(p):'');
   started=true;
  }}
  else cell.innerHTML=minus(v)+(showPowers&&v!==0&&p?pow(p):'');
  tr.append(cell);
 });table.append(tr);
}
function draw(){
 const {a,b}=state.question,final=product(a,b),n=final.length,degree=n-1;
 const mode=state.mode,step=mode==='worked'?3:mode==='question'?0:state.step;
 const root=$('canvas');root.replaceChildren();
 $('heading').textContent=mode==='step'?actions[step]:'';
 $('help').textContent='';
 const pad=v=>Array(n-v.length).fill(null).concat(v);
 const visibleFactors=state.type==='ql'?[b,a]:[a,b];
 $('factorExpression').innerHTML=visibleFactors.map(f=>'<span class="factor"><span class="bracket">(</span>'+poly(f)+'<span class="bracket">)</span></span>').join(' ');
 if(mode!=='question'){
  const table=document.createElement('table');table.className='math-table';
  if(true){
   const headings=document.createElement('tr');headings.append(document.createElement('th'));
   for(let p=degree;p>=0;p--){const th=document.createElement('th');th.innerHTML=p?pow(p):'#';headings.append(th)}table.append(headings);
  }
  row(table,pad(a),'','',degree,false,false);
  row(table,pad(b),'underline','',degree,false,false);
  if(step>=1){
   for(let j=b.length-1;j>=0;j--){
    if(b[j]===0)continue;
    const shift=b.length-1-j,values=Array(n).fill(null);
    for(let i=0;i<a.length;i++)values[n-a.length+i-shift]=a[i]*b[j];
    row(table,values,'','',degree);
   }
  }
  if(step>=2)row(table,final,'sum','+',degree);
  if(step>=3)row(table,final,'final-power','',degree,true);
  root.append(table);
  if(step>=3){
   const eq=document.createElement('div');eq.className='equation worked-conclusion';
   eq.innerHTML=visibleFactors.map(f=>'('+poly(f)+')').join('')+' = '+poly(final);
   root.append(eq);
  }
 }

}
function render(){renderSelectors();coefficientInputs();draw()}
selectQuestion(0);
})();</script>
</body>
</html>
