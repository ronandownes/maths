<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202124;background:#f1f3f4}
*{box-sizing:border-box}
body{margin:0}
header{background:#fff;border-bottom:1px solid #dadce0;padding:4px max(16px,calc((100vw - 1150px)/2));display:flex;align-items:center;gap:8px;min-height:48px}
header img{width:122px;display:block}.apps-name{font-size:1.05rem;font-weight:700;margin-left:-7px;margin-right:14px}header a{color:#174ea6;text-decoration:none;font-size:.88rem}
header h1{font-weight:650;font-size:1.16rem;margin:0}
main{max-width:1100px;margin:8px auto;background:white;padding:14px 26px 28px;min-height:0;border:1px solid #e2e4e7}
button,input{font:inherit;border-radius:6px;border:1px solid #b8c0c9;background:#fff;color:inherit}
button{padding:9px 13px;cursor:pointer;white-space:nowrap}
button:hover{background:#f1f5fb}button:focus-visible,input:focus-visible{outline:3px solid #78aaff;outline-offset:2px}
button[aria-pressed=true]{background:#e8f0fe;border-color:#1a73e8;color:#174ea6;font-weight:750}
button:disabled{opacity:.38;cursor:default}
.top-questions,.modes,.stepper,.control-line,.button-group{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.top-questions{margin:5px 0 8px}.bankbar{padding-top:9px}.bankbar>span{font-size:.84rem;color:#576270;font-weight:650}.edit-hint{font-size:.81rem;color:#647080;margin:10px 0 0}
.top-questions button{flex:1 1 98px;padding:11px 8px;font-weight:700}
.top-questions #random{flex:1.2 1 130px}
.settings{display:flex;flex-wrap:wrap;gap:8px 12px;padding:10px 0 12px;border-top:1px solid #e2e6ea;border-bottom:1px solid #e2e6ea}
.setting{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:6px 12px;border:1px solid #dce2e9;border-radius:8px;background:#fbfcfe}
.setting .caption{font-size:.81rem;font-weight:700;color:#59636f;min-width:0}
.button-group button{font-size:.87rem;padding:8px 11px}
.modes{margin:14px 0 11px}
.modes button{font-size:.94rem}

.canvas{border:1px solid #d9dfe6;border-radius:9px;padding:18px 14px;min-height:250px;overflow-x:auto}
#heading{font-size:1.12rem;margin:0 0 9px;font-weight:650}
.math-table{margin:0 auto;border-collapse:collapse;table-layout:fixed;width:min(100%,760px)}
.math-table td,.math-table th{font:clamp(1.25rem,2.5vw,2rem)/1.35 "Cambria Math",Cambria,Georgia,serif;text-align:center;padding:8px 5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.math-table th{font:1.03rem Arial,sans-serif;font-weight:500;color:#69747f}
.math-table .row-label{width:45px;text-align:right;font:1rem Arial,sans-serif;color:#5f6973;padding-right:6px}
.math-table .underline td{border-bottom:2px solid #8d99a5}

.math-table sup{font-size:.62em;vertical-align:super}.math-table .final-power td{font-weight:700;border-top:1px solid #b3bdc7}.math-table .final-power td:not(.row-label){font-family:"Cambria Math",Cambria,Georgia,serif}
.equation{font:clamp(1.4rem,3vw,2.2rem)/1.4 "Cambria Math",Cambria,Georgia,serif;text-align:center;margin:18px 0 3px;overflow-wrap:anywhere}
.equation sup{font-size:.62em;vertical-align:super}.question-formula{margin:3px auto 10px;font-size:clamp(1.4rem,2.7vw,1.95rem)}.equation.worked-conclusion{font-size:clamp(1.35rem,2.6vw,1.85rem);margin:8px auto 0;max-width:100%;text-align:center}.math-table .final-power td{padding-top:4px;padding-bottom:3px}.math-table .sum td{padding-bottom:3px}

#help:empty{display:none}
@media(max-width:680px){
 header img{width:92px}header h1{font-size:1.02rem}.apps-name{font-size:.88rem;margin-right:5px}
 main{margin:0;padding:13px 9px}
 .settings{gap:7px}.setting{width:100%;padding:6px 9px}.setting .caption{min-width:48px}
 .button-group button{padding:7px 9px}
 .coefficients{gap:10px}.coefficient input{width:84px;min-width:84px}
 .math-table td,.math-table th{font-size:1.17rem;padding:7px 2px}
 .math-table .row-label{width:38px;font-size:.76rem}
 .canvas{padding:12px 3px}
}

</head>
<body>
<header>
<a href="../../index.html" aria-label="Maths home"><img src="../../assets/maths-logo.svg" alt="Maths four-dot logo"></a><span class="apps-name">Apps</span>
<div><a href="../../algebra/index.html">Algebra</a><h1>Place-Value Expansion in One Variable</h1></div>
</header>
<main>

<div class="settings">
<div class="setting"><span class="caption">Factors</span><div class="button-group" id="types" aria-label="Polynomial degrees"></div></div>
<div class="setting"><span class="caption">Signs</span><div class="button-group" id="signs" aria-label="Coefficient signs"></div></div>
<div class="setting"><span class="caption">Level</span><div class="button-group" id="levels" aria-label="Difficulty level"></div></div>
</div>
<div class="bankbar"><span id="bankLabel">Questions for these settings</span><nav class="top-questions" id="questions" aria-label="Questions for the selected factors, signs and level"></nav></div>
<div class="modes" id="modes" aria-label="How to view the solution"></div>
<p class="edit-hint">Change any coefficient using the arrows or by typing a number. The working updates immediately.</p>
<div class="coefficients" id="coefficients" aria-label="Edit factor coefficients"></div>
<h2 id="heading"></h2>
<p id="help"></p>
<section class="canvas" id="canvas" aria-live="polite"></section>
<div class="stepper"><button id="back">← Previous</button><span id="stepProgress"></span><button id="forward">Next →</button></div>
</main>
<script>(()=>{'use strict';
const $ = id=>document.getElementById(id);
const actions=['Set up the place-value columns','Calculate the partial products','Group like terms','Bring back the powers of x'];
const factorTypes=[['ll','Linear × linear'],['ql','Quadratic × linear'],['qq','Quadratic × quadratic']];
const signTypes=[['positive','Positive'],['negative','Negative'],['mixed','Mixed']];
const levels=[[1,'1'],[2,'2'],[3,'3']];
const modes=[['question','Question only'],['step','Step by step'],['answer','Answer'],['worked','Fully worked']];
const state={type:'ql',sign:'positive',level:1,mode:'question',step:0,slot:0,randomCount:0,question:null};
const pow=k=>k===0?'':k===1?'x':'x<sup>'+k+'</sup>';
const minus=v=>v<0?'−'+Math.abs(v):String(v);
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){const t=b;b=a%b;a=t}return a};
const primitive=a=>a.reduce((g,v)=>gcd(g,v),0)===1;
function poly(a){let result='',degree=a.length-1;
 for(let i=0;i<a.length;i++){const v=a[i],p=degree-i;if(v===0)continue;
  const body=(p&&Math.abs(v)===1?'':Math.abs(v))+pow(p);
  result+=(result?(v<0?' − ':' + '):(v<0?'−':''))+body;
 }return result||'0';
}
function product(a,b){const out=Array(a.length+b.length-1).fill(0);a.forEach((x,i)=>b.forEach((y,j)=>{out[i+j]+=x*y}));return out}
function seedFor(slot){const typeIndex=factorTypes.findIndex(x=>x[0]===state.type),signIndex=signTypes.findIndex(x=>x[0]===state.sign);
 return ((slot+1)*209759+(state.level+13)*17539+(typeIndex+1)*9151+(signIndex+2)*1877)>>>0}
function seeded(seed){let x=seed>>>0;return (min,max)=>{x^=x<<13;x^=x>>>17;x^=x<<5;x>>>=0;return min+(x%(max-min+1))}}
function makeQuestion(next,serial){
 const [na,nb]=state.type==='ll'?[2,2]:state.type==='ql'?[3,2]:[3,3];
 const level=state.level,sign=state.sign;
 const choose=(a)=>a[next(0,a.length-1)];
 const small=()=>next(2,9),low=()=>next(1,6),big=()=>choose([10,11,11,11,20,21,30,31]);
 let a,b;
 for(let trial=0;trial<2000;trial++){
  if(level===1){
   a=Array.from({length:na},()=>low());b=Array.from({length:nb},()=>low());
   // One unit coefficient in each factor, at independently selected positions.
   a[next(0,na-1)]=1;b[next(0,nb-1)]=1;
  }else if(level===2){
   a=Array.from({length:na},small);b=Array.from({length:nb},small);
   if(next(0,3)===0)(next(0,1)?a:b)[0]=11;
  }else{
   a=Array.from({length:na},small);b=Array.from({length:nb},small);
   // A useful two-digit factor, usually 11, rather than unrestricted large coefficients.
   const target=next(0,1)?a:b;target[next(0,target.length-1)]=big();
  }
  for(const arr of [a,b]){
   for(let i=1;i<arr.length;i++){
    if(sign==='negative'||(sign==='mixed'&&next(0,1)===1))arr[i]*=-1;
   }
  }
  if(sign==='mixed'){
   const other=a.slice(1).concat(b.slice(1));
   if(other.every(v=>v>0))b[b.length-1]*=-1;
   if(other.every(v=>v<0))a[a.length-1]*=-1;
  }
  if(primitive(a)&&primitive(b)&&a[0]>0&&b[0]>0)return{a,b};
 }
 // Guaranteed primitive fallback, retaining the selected sign pattern.
 return{a:[1,...Array(na-1).fill(sign==='negative'?-2:2)],
        b:[1,...Array(nb-1).fill(sign==='positive'?3:-3)]};
}
function chosenQuestion(){const rng=state.slot==='random'?seeded(seedFor(state.randomCount+1000) ^ ((Math.random()*0xffffffff)>>>0)):seeded(seedFor(state.slot));return makeQuestion(rng,state.slot)}
function selectQuestion(slot){state.slot=slot;state.question=chosenQuestion();render()}
function freshRandom(){state.randomCount++;selectQuestion('random')}
function chooseButtons(id,entries,current,change){
 const host=$(id);host.replaceChildren();
 entries.forEach(([value,label])=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-pressed',String(value===current));b.onclick=()=>change(value);host.append(b)});
}
function renderSelectors(){
 const q=[];for(let i=0;i<6;i++)q.push([i,'Q'+(i+1)]);q.push(['random','Random']);
 chooseButtons('questions',q,state.slot,v=>v==='random'?freshRandom():selectQuestion(v));
 function filter(key,value){state[key]=value;state.slot=0;state.question=chosenQuestion();render()}
 chooseButtons('types',factorTypes,state.type,v=>filter('type',v));
 chooseButtons('signs',signTypes,state.sign,v=>filter('sign',v));
 chooseButtons('levels',levels,state.level,v=>filter('level',v));
 chooseButtons('modes',modes,state.mode,v=>{state.mode=v;if(v==='step')state.step=0;render()});
}
function coefficientInputs(){
 const host=$('coefficients');host.replaceChildren();
 [['First factor','a'],['Second factor','b']].forEach(([title,key])=>{
  const group=document.createElement('div');group.className='factor-fields';
  const h=document.createElement('div');h.className='group-label';h.textContent=title;group.append(h);
  state.question[key].forEach((v,i)=>{
   const degree=state.question[key].length-i-1;
   const label=document.createElement('label');label.className='coefficient';label.innerHTML=degree===0?'#':degree===1?'x':pow(degree);
   const input=document.createElement('input');input.type='number';input.step='1';input.value=v;input.min='-999';input.max='999';
   input.setAttribute('aria-label',title+', coefficient of '+(degree===0?'constant':degree===1?'x':'x to the power '+degree));
   input.addEventListener('input',()=>{if(input.value.trim()==='')return;const val=Number(input.value);if(!Number.isInteger(val)||Math.abs(val)>999)return;state.question[key][i]=val;draw()});
   label.append(input);group.append(label);
  });host.append(group);
 });
}
function row(table,values,kind='',label='',degree=0,showPowers=false,asPolynomial=false){
 const tr=document.createElement('tr');if(kind)tr.className=kind;
 const head=document.createElement('td');head.className='row-label';head.textContent=label;tr.append(head);
 let started=false;
 values.forEach((v,i)=>{const cell=document.createElement('td');const p=degree-i;
  if(v===null){cell.textContent='';}
  else if(asPolynomial){if(v===0){cell.textContent='';}else{
   const sign=started?(v>0?'+':'−'):(v<0?'−':'');
   const number=Math.abs(v);
   cell.innerHTML=sign+(p&&number===1?'':number)+(p?pow(p):'');
   started=true;
  }}
  else cell.innerHTML=minus(v)+(showPowers&&v!==0&&p?pow(p):'');
  tr.append(cell);
 });table.append(tr);
}
function draw(){
 const {a,b}=state.question,final=product(a,b),n=final.length,degree=n-1;
 const mode=state.mode,step=mode==='worked'?3:mode==='answer'||mode==='question'?0:state.step;
 const root=$('canvas');root.replaceChildren();
 $('heading').textContent=mode==='step'?actions[step]:mode==='worked'?'Fully worked':'';
 $('help').textContent='';
 const pad=v=>Array(n-v.length).fill(null).concat(v);
 const question=document.createElement('div');question.className='equation question-formula';
 question.innerHTML='('+poly(a)+')('+poly(b)+')';
 if(mode!=='answer')root.append(question);
 if(mode==='answer'){
  const eq=document.createElement('div');eq.className='equation';
  eq.innerHTML='('+poly(a)+')('+poly(b)+') = '+poly(final);
  root.append(eq);
 }else if(mode!=='question'){
  const table=document.createElement('table');table.className='math-table';
  if(true){
   const headings=document.createElement('tr');headings.append(document.createElement('th'));
   for(let p=degree;p>=0;p--){const th=document.createElement('th');th.innerHTML=p?pow(p):'#';headings.append(th)}table.append(headings);
  }
  row(table,pad(a),'','',degree,false,false);
  row(table,pad(b),'underline','',degree,false,false);
  if(step>=1){
   for(let j=b.length-1;j>=0;j--){
    const shift=b.length-1-j,values=Array(n).fill(null);
    for(let i=0;i<a.length;i++)values[n-a.length+i-shift]=a[i]*b[j];
    row(table,values,'','',degree);
   }
  }
  if(step>=2)row(table,final,'sum','+',degree);
  if(step>=3)row(table,final,'final-power','',degree,true);
  root.append(table);
  if(step>=3){
   const eq=document.createElement('div');eq.className='equation worked-conclusion';
   eq.innerHTML='('+poly(a)+')('+poly(b)+') = '+poly(final);
   root.append(eq);
  }
 }
 $('back').hidden=mode!=='step';$('forward').hidden=mode!=='step';
 $('stepProgress').textContent=mode==='step'?(step+1)+' / 4':'';
 $('back').disabled=step===0;$('forward').disabled=step===3;
 $('forward').textContent=step===3?'Complete':'Next: '+actions[step+1]+' →';
}
function render(){renderSelectors();$('bankLabel').textContent='Questions: '+factorTypes.find(x=>x[0]===state.type)[1]+' · '+signTypes.find(x=>x[0]===state.sign)[1]+' · Level '+state.level;coefficientInputs();draw()}
$('back').onclick=()=>{state.step=Math.max(0,state.step-1);draw()};
$('forward').onclick=()=>{state.step=Math.min(3,state.step+1);draw()};
selectQuestion(0);
})();</script>
</body>
</html>
