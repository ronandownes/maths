<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Place-Value Expansion in One Variable | Maths</title>
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202124;background:#f1f3f4}
*{box-sizing:border-box}
body{margin:0}
header{background:#fff;border-bottom:1px solid #dadce0;padding:8px max(16px,calc((100vw - 1150px)/2));display:flex;align-items:center;gap:20px}
header img{width:145px;display:block}header a{color:#174ea6;text-decoration:none;font-size:.88rem}
header h1{font-weight:650;font-size:1.3rem;margin:1px 0}
main{max-width:1100px;margin:16px auto;background:white;padding:20px 26px 38px;min-height:82vh;border:1px solid #e2e4e7}
button,input{font:inherit;border-radius:6px;border:1px solid #b8c0c9;background:#fff;color:inherit}
button{padding:9px 13px;cursor:pointer;white-space:nowrap}
button:hover{background:#f1f5fb}button:focus-visible,input:focus-visible{outline:3px solid #78aaff;outline-offset:2px}
button[aria-pressed=true]{background:#e8f0fe;border-color:#1a73e8;color:#174ea6;font-weight:750}
button:disabled{opacity:.38;cursor:default}
.top-questions,.modes,.stepper,.control-line,.button-group{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.top-questions{margin-bottom:12px}
.top-questions button{flex:1 1 62px;padding:11px 8px;font-weight:700}
.top-questions #random{flex:1.5 1 110px}
.settings{display:flex;flex-wrap:wrap;gap:10px 24px;padding:10px 0 12px;border-top:1px solid #e2e6ea;border-bottom:1px solid #e2e6ea}
.setting{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.setting .caption{font-size:.85rem;font-weight:700;color:#59636f;min-width:46px}
.button-group button{font-size:.87rem;padding:8px 11px}
.modes{margin:14px 0 11px}
.modes button{font-size:.94rem}
.modes button[aria-pressed=true]{border-color:#174ea6}
.coefficients{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start;margin:13px 0 16px}
.factor-fields{display:flex;flex-wrap:wrap;gap:9px}
.factor-fields .group-label{width:100%;color:#586575;font-size:.84rem;font-weight:650}
.coefficient{display:flex;flex-direction:column;gap:3px;font-size:.83rem;color:#536170}
.coefficient input{width:96px;min-width:96px;padding:8px 5px 8px 10px;font-size:1.2rem;font-variant-numeric:tabular-nums;line-height:1.3}
.coefficient input::-webkit-inner-spin-button{opacity:1}
.canvas{border:1px solid #d9dfe6;border-radius:9px;padding:20px 14px;min-height:295px;overflow-x:auto}
#heading{font-size:1.12rem;margin:0 0 9px;font-weight:650}
.math-table{margin:0 auto;border-collapse:collapse;table-layout:fixed;width:min(100%,760px)}
.math-table td,.math-table th{font:clamp(1.25rem,2.5vw,2rem)/1.35 "Cambria Math",Cambria,Georgia,serif;text-align:center;padding:8px 5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.math-table th{font:1.03rem Arial,sans-serif;font-weight:500;color:#69747f}
.math-table .row-label{width:68px;text-align:right;font:1rem Arial,sans-serif;color:#5f6973;padding-right:10px}
.math-table .underline td{border-bottom:2px solid #8d99a5}
.math-table .sum td{border-top:2px solid #8d99a5;font-weight:700}
.math-table sup{font-size:.62em;vertical-align:super}
.equation{font:clamp(1.4rem,3vw,2.2rem)/1.4 "Cambria Math",Cambria,Georgia,serif;text-align:center;margin:18px 0 3px;overflow-wrap:anywhere}
.equation sup{font-size:.62em;vertical-align:super}
.stepper{justify-content:space-between;gap:12px;margin-top:12px}
.stepper button:last-child{margin-left:auto;font-weight:650}
#stepProgress{font-size:.86rem;color:#647080}
#help{font-size:.88rem;color:#5f6973;margin:3px 0 12px}
#help:empty{display:none}
@media(max-width:680px){
 header img{width:95px}header h1{font-size:1.05rem}
 main{margin:0;padding:13px 9px}
 .settings{gap:10px}.setting{width:100%}.setting .caption{min-width:48px}
 .button-group button{padding:7px 9px}
 .coefficients{gap:10px}.coefficient input{width:84px;min-width:84px}
 .math-table td,.math-table th{font-size:1.17rem;padding:7px 2px}
 .math-table .row-label{width:38px;font-size:.76rem}
 .canvas{padding:12px 3px}
}
</style>
</head>
<body>
<header>
<a href="../../index.html" aria-label="Maths home"><img src="../../assets/maths-logo.svg" alt="Maths four-dot logo"></a>
<div><a href="../../algebra/index.html">Algebra</a><h1>Place-Value Expansion in One Variable</h1></div>
</header>
<main>
<nav class="top-questions" id="questions" aria-label="Questions"></nav>
<div class="settings">
<div class="setting"><span class="caption">Factors</span><div class="button-group" id="types" aria-label="Polynomial degrees"></div></div>
<div class="setting"><span class="caption">Signs</span><div class="button-group" id="signs" aria-label="Coefficient signs"></div></div>
<div class="setting"><span class="caption">Level</span><div class="button-group" id="levels" aria-label="Difficulty level"></div></div>
</div>
<div class="modes" id="modes" aria-label="How to view the solution"></div>
<div class="coefficients" id="coefficients" aria-label="Edit factor coefficients"></div>
<h2 id="heading"></h2>
<p id="help"></p>
<section class="canvas" id="canvas" aria-live="polite"></section>
<div class="stepper"><button id="back">← Previous</button><span id="stepProgress"></span><button id="forward">Next →</button></div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const bank=[
 {a:[1,2],b:[1,7],type:'ll',sign:'positive',level:1},
 {a:[1,4],b:[1,-3],type:'ll',sign:'mixed',level:1},
 {a:[3,5],b:[4,-2],type:'ll',sign:'mixed',level:2},
 {a:[2,3,4],b:[5,6],type:'ql',sign:'positive',level:2},
 {a:[3,-4,5],b:[7,-2],type:'ql',sign:'mixed',level:2},
 {a:[2,3,4],b:[5,6,-3],type:'qq',sign:'mixed',level:2},
 {a:[2,-4,6],b:[3,2,-5],type:'qq',sign:'mixed',level:2},
 {a:[12,-15,17],b:[11,13,-8],type:'qq',sign:'mixed',level:3}
];
const actions=['Stack the factors','Strip the powers of x','Calculate the partial products','Group like terms','Bring back the powers of x'];
const questionTypes=[['ll','Linear × linear'],['ql','Quadratic × linear'],['qq','Quadratic × quadratic']];
const signTypes=[['positive','Positive'],['negative','Negative'],['mixed','Mixed']];
const levels=[[1,'1'],[2,'2'],[3,'3']];
const views=[['question','Question only'],['step','Step by step'],['answer','Answer'],['worked','Fully worked']];
const copy=x=>({a:[...x.a],b:[...x.b],type:x.type,sign:x.sign,level:x.level});
const state={type:'ll',sign:'positive',level:1,mode:'question',step:0,selected:0,randomNumber:0,question:copy(bank[0]),randomHistory:[],randomIndex:-1};
const power=n=>n===0?'':n===1?'x':'x<sup>'+n+'</sup>';
function formatPoly(a){let s='',d=a.length-1;for(let i=0;i<a.length;i++){let v=a[i],k=d-i;if(v===0)continue;let term=(k&&Math.abs(v)===1?'':Math.abs(v))+power(k);s+=(s?(v<0?' − ':' + '):(v<0?'−':''))+term;}return s||'0'}
function multiply(a,b){let result=Array(a.length+b.length-1).fill(0);a.forEach((v,i)=>b.forEach((w,j)=>{result[i+j]+=v*w}));return result}
const rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function generate(){let type=state.type,al=type==='ll'?2:3,bl=type==='qq'?3:2,level=state.level,sign=state.sign;
 function coefficients(n){let high=level===3?18:level===2?8:5;
   let arr=Array.from({length:n},(_,i)=>i===0?(level===1?1:rand(level===2?2:4,high)):rand(1,high));
   for(let i=1;i<arr.length;i++)if(sign==='negative'||(sign==='mixed'&&rand(0,1)===1))arr[i]*=-1;
   return arr;
 }
 let a=coefficients(al),b=coefficients(bl);
 if(sign==='mixed'){let all=a.slice(1).concat(b.slice(1));
   if(all.every(x=>x>0))b[b.length-1]*=-1;
   if(all.every(x=>x<0))a[a.length-1]*=-1;
 }
 return {a,b,type,sign,level};
}
function choices(node,options,value,onClick){const host=$(node);host.replaceChildren();options.forEach(([id,label])=>{let b=document.createElement('button');b.type='button';b.textContent=label;b.setAttribute('aria-pressed',String(id===value));b.onclick=()=>onClick(id);host.append(b)})}
function questionButtons(){$('questions').replaceChildren();bank.forEach((q,i)=>{const b=document.createElement('button');b.textContent='Q'+(i+1);b.type='button';b.setAttribute('aria-pressed',String(state.selected===i));b.onclick=()=>openFixed(i);$('questions').append(b)});
 const b=document.createElement('button');b.id='random';b.type='button';b.textContent='Random';b.setAttribute('aria-pressed',String(state.selected==='random'));b.onclick=()=>nextRandom();$('questions').append(b)}
function openFixed(i){state.selected=i;state.question=copy(bank[i]);state.type=state.question.type;state.sign=state.question.sign;state.level=state.question.level;render()}
function nextRandom(){const q=generate();state.randomHistory.push(copy(q));state.randomIndex=state.randomHistory.length-1;state.selected='random';state.question=copy(q);state.randomNumber++;render()}
function renderFilters(){
 choices('types',questionTypes,state.type,id=>{state.type=id;renderFilters()});
 choices('signs',signTypes,state.sign,id=>{state.sign=id;renderFilters()});
 choices('levels',levels,state.level,id=>{state.level=id;renderFilters()});
 choices('modes',views,state.mode,id=>{state.mode=id;if(id==='step')state.step=0;render()});
}
function coefficientInputs(){$('coefficients').replaceChildren();
 [['First factor','a'],['Second factor','b']].forEach(([name,key])=>{
  const div=document.createElement('div');div.className='factor-fields';
  let title=document.createElement('div');title.className='group-label';title.textContent=name;div.append(title);
  state.question[key].forEach((v,i)=>{let d=state.question[key].length-i-1;
   let lab=document.createElement('label');lab.className='coefficient';lab.innerHTML=d===0?'#':d===1?'x':'x<sup>'+d+'</sup>';
   const input=document.createElement('input');input.type='number';input.step='1';input.min='-999';input.max='999';input.value=v;
   input.setAttribute('aria-label',name+', coefficient of '+(d===0?'constant':d===1?'x':'x to the power '+d));
   input.addEventListener('input',()=>{let val=Number(input.value);if(input.value.trim()===''||!Number.isInteger(val)||Math.abs(val)>999)return;state.question[key][i]=val;draw();});
   lab.append(input);div.append(lab);
  });$('coefficients').append(div);
 });
}
function addRow(table,values,kind,label,degree,withPowers,asFactors){
 let tr=document.createElement('tr');tr.className=kind||'';
 const labelCell=document.createElement('td');labelCell.className='row-label';labelCell.textContent=label||'';tr.append(labelCell);
 let encountered=false;
 values.forEach((v,i)=>{let td=document.createElement('td'),p=degree-i;
  if(asFactors){if(v===null||v===0){td.textContent='';}else{let prefix=encountered?(v>0?'+':'−'):(v<0?'−':'');let magnitude=Math.abs(v);td.innerHTML=prefix+(p&&magnitude===1?'':magnitude)+(p?power(p):'');encountered=true;}}
  else td.innerHTML=(v===null?'':String(v)+(withPowers&&v&&p?power(p):''));
  tr.append(td);
 });table.append(tr);
}
function draw(){
 let {a,b}=state.question,answer=multiply(a,b),n=answer.length,degree=n-1;
 let root=$('canvas');root.replaceChildren();
 let mode=state.mode,step=mode==='worked'?4:mode==='question'||mode==='answer'?0:state.step;
 $('heading').textContent=mode==='step'?actions[step]:mode==='worked'?'Fully worked':mode==='answer'?'Answer':'';
 $('help').textContent='';
 const pad=x=>Array(n-x.length).fill(null).concat(x);
 function makeTable(){let table=document.createElement('table');table.className='math-table';
  if(step>0){let hdr=document.createElement('tr');let corner=document.createElement('th');hdr.append(corner);for(let d=degree;d>=0;d--){let th=document.createElement('th');th.innerHTML=d===0?'#':power(d);hdr.append(th)}table.append(hdr)}
  addRow(table,pad(a),'','',degree,false,step===0);
  addRow(table,pad(b),'underline','',degree,false,step===0);
  if(step>=1){ // Replace blank structural cells with zeros, not empty spaces.
    for(let row of Array.from(table.rows).slice(-2)){for(let cell of Array.from(row.cells).slice(1)){if(cell.textContent==='')cell.textContent='0'}}
  }
  if(step>=2){for(let j=b.length-1;j>=0;j--){let shift=b.length-1-j,vals=Array(n).fill(0);
   for(let i=0;i<a.length;i++)vals[n-a.length+i-shift]=a[i]*b[j];
   addRow(table,vals,'','',degree,false,false);
  }}
  if(step>=3)addRow(table,answer,'sum','+',degree,false,false);
  if(step>=4)addRow(table,answer,'','',degree,true,false);
  return table;
 }
 if(mode==='answer'){
   let eq=document.createElement('div');eq.className='equation';eq.innerHTML='('+formatPoly(a)+')('+formatPoly(b)+') = '+formatPoly(answer);root.append(eq);
 }else{root.append(makeTable());if(step===4){let eq=document.createElement('div');eq.className='equation';eq.innerHTML=formatPoly(answer);root.append(eq)}}
 $('stepProgress').textContent=mode==='step'?(step+1)+' / 5':'';
 $('back').hidden=mode!=='step';$('forward').hidden=mode!=='step';
 $('back').disabled=step===0;$('forward').disabled=step===4;
 $('forward').textContent=step===4?'Complete':'Next: '+actions[step+1]+' →';
}
function render(){questionButtons();renderFilters();coefficientInputs();draw()}
$('back').onclick=()=>{state.step=Math.max(0,state.step-1);draw()};
$('forward').onclick=()=>{state.step=Math.min(4,state.step+1);draw()};
render();
})();
</script>
</body>
</html>
