<!doctype html><html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pythagoras | Maths Apps</title><link rel="icon" href="../../assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../shared/assessment.css"><link rel="stylesheet" href="../shared/triangle-app.css"></head><body data-app="pythagoras"><header><a href="../../index.html"><img src="../../assets/maths-logo.svg" alt="Maths four-dot logo"></a><div><a href="../../geometry/index.html">Geometry</a><h1>Pythagoras</h1><small id="questionRoute"></small></div></header><main><nav class="menu" aria-label="Activities"><button data-mode="instruction">Instruction</button><button data-mode="practice">Practice</button><button data-mode="display">Display</button><button data-mode="quiz">Quiz</button><button data-mode="test">Test</button><button data-mode="sheets">Sheets</button></nav><div class="controls"><span id="ratioControls"><button data-ratio="sin">Sine</button><button data-ratio="cos">Cosine</button><button data-ratio="tan">Tangent</button></span><span id="routeControls"><button data-route="ratio">By ratio</button><button data-route="unknown">By unknown</button></span><button id="optionsToggle" aria-expanded="false">Options ▾</button></div><div class="options" id="optionsPanel"><label id="trigFind">Find <select id="find"><option value="num">Numerator</option><option value="den">Denominator</option><option value="angle">Angle</option></select></label><label id="pythBank" hidden>Missing side <select id="pythFind"><option value="any">Any</option><option value="hyp">Hypotenuse</option><option value="adj">Horizontal leg</option><option value="opp">Vertical leg</option></select></label><label>Number bank <select id="bank"><option value="triples">Pythagorean triples</option><option value="nontriples">Non-triples</option><option value="decimal">One-decimal sides</option><option value="near">Near integers</option><option value="surds">Exact surds</option><option value="mixed">Mixed</option></select></label><label>Precision <select id="precision"><option value="1">1 decimal</option><option value="2">2 decimals</option></select></label><label>Angle <input id="angle" type="range" min="5" max="85" value="35"><output id="angleOut">35°</output></label><label>Hypotenuse <input id="hyp" type="range" min="3" max="20" step=".5" value="10"><output id="hypOut">10</output></label></div><section id="instructionPanel"></section><section id="practicePanel" hidden class="stage"><div class="triangle"><div id="triangle"></div><div class="triangle-tools"><button id="highlight">Highlight the sides</button><span id="included" class="label"></span></div></div><div class="panel"><h2 id="questionTitle"></h2><p id="questionText"></p><div class="predict" id="prediction"></div><div class="math" id="ratioEquation"></div><div class="progress-steps" id="steps"></div><p id="practiceExtra" class="note"></p><div id="worked" class="math answer-box" hidden></div><div class="buttons"><button id="stepReset">Reset</button><button id="stepWorked">Worked</button><button id="newQuestion" class="primary">New question</button></div></div></section><section id="displayPanel" class="stage" hidden><div class="triangle"><div id="displayTriangle"></div></div><div class="panel"><h2>Classroom display</h2><div id="displayEquation" class="math"></div><button id="displayAnswer">Reveal / Hide</button><button id="displayNew">New question</button></div></section><section id="quizPanel" hidden></section><section id="testPanel" hidden></section><section id="assessmentPanel" hidden></section><section id="sheetsPanel" hidden><h2>Sheets</h2><p>Six questions with a separate answer key.</p><button id="sheetOpen" class="primary">Open printable sheet</button></section><p class="footer">Blue: hypotenuse · Green: adjacent · Amber: opposite. Labels as well as colour show the relationships.</p></main><script src="../shared/triangle-math.js"></script><script src="../shared/assessment.js"></script><script src="../shared/triangle-app.js"></script></body></html>
