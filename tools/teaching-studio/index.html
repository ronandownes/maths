<!doctype html><html lang="en-IE"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teaching Studio | Maths</title><style>
:root{--blue:#205da9;--red:#e63329;--green:#3fae49;--black:#1a1a1a}*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:#202124;background:#f1f3f4}button,input,select{font:inherit}button{background:#fff;color:#243447;border:1px solid #cbd5e1;border-radius:6px;padding:8px;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}button:hover:not(:disabled){background:#eaf1fa}header{display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #dce2e8;min-height:60px;padding:6px 12px}header a{text-decoration:none;color:#202124;font-weight:bold;font-size:19px;white-space:nowrap}header img{width:111px;vertical-align:middle}.tools{display:flex;align-items:center;gap:6px;overflow-x:auto;flex:1;padding:3px}.tools>*{flex-shrink:0}.tools select{padding:8px;border:1px solid #cbd5e1;border-radius:6px;max-width:145px}.record{color:white;background:#b52323;border-color:#b52323;font-weight:bold}.dots{display:flex;gap:5px}.dot{height:26px;width:26px;border:2px solid #cbd5e1;border-radius:50%;padding:0}.dot[aria-pressed=true]{outline:3px solid #9ac4f5}.workspace{height:calc(100dvh - 60px);display:flex;overflow:hidden}.pane{min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden;position:relative}.left{width:34%;background:white}.right{flex:1;background:#121518}.divider{flex:0 0 9px;background:#aeb9c7;cursor:col-resize;touch-action:none}.divider:hover{background:#205da9}.label{height:42px;flex-shrink:0;display:flex;gap:6px;align-items:center;padding:5px 8px;background:#fff;border-bottom:1px solid #dde3eb;min-width:0}.label input{min-width:70px;flex:1;border:1px solid #d1d9e4;padding:7px;border-radius:5px}.view{flex:1;position:relative;min-height:0;overflow:hidden}.view>iframe,.view>video,.view>canvas,.view>img{position:absolute;inset:0;width:100%;height:100%;border:0}.view>iframe{background:white}.view>video,.view>img{object-fit:contain}.view>canvas{touch-action:none;pointer-events:none}.help{position:absolute;bottom:15px;left:15px;padding:10px;background:#131820be;color:white;border-radius:7px;pointer-events:none}.vertical .workspace{flex-direction:column}.vertical .left{width:100%!important;height:34%}.vertical .divider{height:9px;flex-basis:9px;cursor:row-resize}.vertical .right{flex:1}.minimal header,.minimal .label{display:none}.minimal .workspace{height:100dvh}#msg{position:fixed;bottom:10px;right:12px;background:#202124;color:white;padding:8px 12px;border-radius:6px;max-width:70vw;z-index:5}input[type=file]{display:none}@media(max-width:800px){header{flex-wrap:wrap}.workspace{height:calc(100dvh - 110px)}.tools{width:100%}}
</style></head><body><header><a href="../../index.html" title="Return to Maths"><img src="../../assets/maths-logo.svg" alt="Maths"> · Studio</a><div class="tools">
<label><button type="button" id="openFileBtn">Open PDF / image</button><input id="file" type="file" accept="application/pdf,image/*"></label>
<button id="start">Start camera</button><select id="cameras" aria-label="Camera"><option value="">Default camera</option></select><button id="write">Writing mode</button><button id="rotate">Rotate</button><button id="mirror">Mirror</button><button id="orientation">Top / side</button><button id="leftToggle">Left on/off</button><button id="pen">Pen off</button><span class="dots"><button class="dot" data-colour="#1a1a1a" style="background:#1a1a1a" aria-label="Black pen" aria-pressed="true"></button><button class="dot" data-colour="#205da9" style="background:#205da9" aria-label="Blue pen"></button><button class="dot" data-colour="#e63329" style="background:#e63329" aria-label="Red pen"></button><button class="dot" data-colour="#3fae49" style="background:#3fae49" aria-label="Green pen"></button></span><button id="clear">Clear</button><button id="record" class="record">● Record</button><button id="stop" disabled>■ Stop & save</button><button id="full">Full screen</button><button id="hide">Hide UI (H)</button></div></header>
<main class="workspace" id="workspace"><section class="pane left" id="left"><div class="label"><b>Webpage</b><input id="url" type="text" aria-label="Webpage URL" value="https://ronandownes.github.io/maths/" placeholder="https://..."><button id="go">Go</button><button id="share">Share window</button></div><div class="view"><iframe id="page" title="Webpage" referrerpolicy="no-referrer"></iframe><video id="shared" autoplay muted playsinline style="display:none"></video><img id="picture" alt="Selected image" style="display:none"></div></section><div class="divider" id="divider" role="separator" tabindex="0" aria-label="Adjust split"></div><section class="pane right"><div class="label"><b id="rightTitle">Camera / writing area</b></div><div class="view" id="rightView"><video id="camera" autoplay muted playsinline style="background:#fff"></video><canvas id="ink"></canvas><div class="help" id="help">Start camera, or choose Writing mode.</div></div></section></main><div id="msg" role="status">Ready</div><script>
const $=s=>document.getElementById(s);let stream=null,shareStream=null,captureStream=null,rec=null,parts=[],angle=0,mirrored=false,writing=false,penOn=false,colour='#1a1a1a',dragging=false,ratio=.34,vertical=false,hiddenLeft=false,blobUrl=null;const cam=$('camera'),ink=$('ink'),ctx=ink.getContext('2d');
function notice(s){$('msg').textContent=s}function videoTransform(){cam.style.transform='rotate('+angle+'deg) scaleX('+(mirrored?-1:1)+')'}
function sizeCanvas(){if(!ink.clientWidth||!ink.clientHeight)return;const copy=document.createElement('canvas');copy.width=ink.width;copy.height=ink.height;copy.getContext('2d').drawImage(ink,0,0);ink.width=ink.clientWidth*devicePixelRatio;ink.height=ink.clientHeight*devicePixelRatio;ctx.drawImage(copy,0,0,ink.width,ink.height)}new ResizeObserver(sizeCanvas).observe($('rightView'));
async function listCameras(){try{const old=$('cameras').value;const devices=await navigator.mediaDevices.enumerateDevices();$('cameras').innerHTML='<option value="">Default camera</option>';devices.filter(d=>d.kind==='videoinput').forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=d.label||'Camera '+(i+1);$('cameras').append(o)});$('cameras').value=old}catch(e){}}
async function startCamera(){try{if(stream)stream.getTracks().forEach(t=>t.stop());const id=$('cameras').value;stream=await navigator.mediaDevices.getUserMedia({video:id?{deviceId:{ideal:id}}:{width:{ideal:1920},height:{ideal:1080}},audio:false});cam.srcObject=stream;await cam.play();writing=false;cam.style.display='block';$('help').style.display='none';$('rightTitle').textContent='Document camera';listCameras();notice('Camera on')}catch(e){notice('Camera error: '+e.message)}}$('start').onclick=startCamera;$('cameras').onchange=startCamera;listCameras();
$('write').onclick=()=>{writing=true;cam.style.display='none';$('rightTitle').textContent='Writing surface';$('rightView').style.background='#fff';$('help').style.display='none';if(!penOn)$('pen').click();notice('Writing mode enabled')};
$('rotate').onclick=()=>{angle=(angle+90)%360;videoTransform()};$('mirror').onclick=()=>{mirrored=!mirrored;videoTransform()};
function showLeft(type){$('page').style.display=type==='page'?'block':'none';$('shared').style.display=type==='shared'?'block':'none';$('picture').style.display=type==='picture'?'block':'none'}
function go(){let s=$('url').value.trim();if(!s)return;try{if(!/^https?:\/\//i.test(s))s='https://'+s;const u=new URL(s);if(!['https:','http:'].includes(u.protocol))throw Error();$('url').value=u.href;$('page').src=u.href;showLeft('page');notice('If website refuses embedding, use Share window')}catch(e){notice('Invalid webpage address')}}$('go').onclick=go;$('url').onkeydown=e=>{if(e.key==='Enter')go()};go();
$('share').onclick=async()=>{try{if(shareStream)shareStream.getTracks().forEach(t=>t.stop());shareStream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:false});$('shared').srcObject=shareStream;showLeft('shared');shareStream.getVideoTracks()[0].onended=()=>{showLeft('page');notice('Sharing stopped')};notice('Window shown; use original window to interact')}catch(e){notice('Sharing cancelled: '+e.message)}};
$('openFileBtn').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(blobUrl)URL.revokeObjectURL(blobUrl);blobUrl=URL.createObjectURL(f);if(f.type==='application/pdf'){$('page').src=blobUrl;showLeft('page')}else if(f.type.startsWith('image/')){$('picture').src=blobUrl;showLeft('picture')}else notice('Choose PDF or image')};
function setRatio(r){ratio=Math.min(.9,Math.max(.1,r));if(!hiddenLeft){$('left').style.width=vertical?'100%':(ratio*100)+'%';$('left').style.height=vertical?(ratio*100)+'%':''}}$('divider').onpointerdown=e=>{dragging=true;$('divider').setPointerCapture(e.pointerId)};$('divider').onpointermove=e=>{if(!dragging)return;const b=$('workspace').getBoundingClientRect();setRatio(vertical?(e.clientY-b.top)/b.height:(e.clientX-b.left)/b.width)};$('divider').onpointerup=()=>dragging=false;$('divider').onpointercancel=()=>dragging=false;$('divider').onkeydown=e=>{if(['ArrowLeft','ArrowUp'].includes(e.key))setRatio(ratio-.025);if(['ArrowRight','ArrowDown'].includes(e.key))setRatio(ratio+.025)};
$('orientation').onclick=()=>{vertical=!vertical;document.body.classList.toggle('vertical',vertical);setRatio(ratio)};$('leftToggle').onclick=()=>{hiddenLeft=!hiddenLeft;$('left').style.display=hiddenLeft?'none':'flex';$('divider').style.display=hiddenLeft?'none':'block';if(!hiddenLeft)setRatio(ratio)};
$('pen').onclick=()=>{penOn=!penOn;ink.style.pointerEvents=penOn?'auto':'none';$('pen').textContent=penOn?'Pen on':'Pen off'};document.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{colour=b.dataset.colour;document.querySelectorAll('.dot').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));if(!penOn)$('pen').click()});
let drawing=false;function at(e){let r=ink.getBoundingClientRect();return[(e.clientX-r.left)*ink.width/r.width,(e.clientY-r.top)*ink.height/r.height]}ink.onpointerdown=e=>{if(!penOn)return;drawing=true;ink.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...at(e))};ink.onpointermove=e=>{if(!drawing)return;ctx.lineTo(...at(e));ctx.lineWidth=3*devicePixelRatio;ctx.strokeStyle=colour;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()};ink.onpointerup=ink.onpointercancel=()=>drawing=false;$('clear').onclick=()=>ctx.clearRect(0,0,ink.width,ink.height);
$('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen()};function hide(){document.body.classList.toggle('minimal')} $('hide').onclick=hide;document.addEventListener('keydown',e=>{if(e.key.toLowerCase()==='h'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName))hide()});
$('record').onclick=async()=>{try{if(!window.MediaRecorder)throw Error('MediaRecorder unsupported');captureStream=await navigator.mediaDevices.getDisplayMedia({video:{displaySurface:'browser'},audio:true,preferCurrentTab:true,selfBrowserSurface:'include'});const type=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x));rec=new MediaRecorder(captureStream,type?{mimeType:type}:undefined);parts=[];rec.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};rec.onstop=()=>{const blob=new Blob(parts,{type:type||'video/webm'});if(blob.size){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='Maths-Teaching-'+new Date().toISOString().replace(/[:.]/g,'-')+'.webm';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}captureStream.getTracks().forEach(t=>t.stop());$('record').disabled=false;$('stop').disabled=true;notice('Recording saved')};captureStream.getVideoTracks()[0].onended=()=>{if(rec.state==='recording')rec.stop()};rec.start(500);$('record').disabled=true;$('stop').disabled=false;notice('Recording. Select This Tab in the sharing dialogue.')}catch(e){notice('Recording failed: '+e.message)}};$('stop').onclick=()=>{if(rec&&rec.state==='recording')rec.stop()};
</script><script src="../../assets/navigation.js" defer></script>
</body></html>
